<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · JACKPOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .app {
            max-width: 440px;
            width: 100%;
            padding-bottom: 20px;
            position: relative;
        }

        .win-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(145deg, #00c853, #009624);
            color: white;
            padding: 16px 24px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 6px 0 #00691e;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .win-notification.show {
            transform: translateX(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .bet-modal {
            width: 320px;
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.6);
            border-radius: 40px;
            padding: 28px 20px 20px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(155, 77, 255, 0.6);
            color: #b87aff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(155, 77, 255, 0.2);
            transform: scale(1.1);
        }

        .modal-title {
            text-align: center;
            color: #b87aff;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(155, 77, 255, 0.6);
            border-radius: 60px;
            padding: 16px 20px;
            font-size: 22px;
            font-weight: 700;
            color: #b87aff;
            outline: none;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-input:focus {
            border-color: #b87aff;
            box-shadow: 0 0 20px rgba(155, 77, 255, 0.6);
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .modal-btn {
            background: rgba(106, 13, 173, 0.4);
            border: 2px solid rgba(155, 77, 255, 0.6);
            border-radius: 60px;
            padding: 16px;
            font-weight: 700;
            color: #b87aff;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
            font-size: 18px;
        }

        .modal-btn:active {
            background: rgba(106, 13, 173, 0.6);
            transform: scale(0.96);
        }

        .modal-error {
            color: #ff4444;
            font-size: 16px;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 8px;
            min-height: 30px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
        }

        .modal-submit {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            border-radius: 60px;
            padding: 18px;
            width: 100%;
            color: white;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 0 #2d0b4e;
            transition: all 0.1s;
            letter-spacing: 1px;
        }

        .modal-submit:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 7, 12, 0.6);
            margin: 10px 20px 25px;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            backdrop-filter: blur(4px);
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            background-size: cover;
            background-position: center;
        }

        .nick-level {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .nick {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .balance-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 14, 22, 0.9);
            padding: 5px 12px;
            border-radius: 40px;
            border: 1px solid rgba(138, 43, 226, 0.5);
        }

        .balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 800;
            font-size: 16px;
            color: white;
        }

        .puzzle-icon {
            color: #ffd700;
            font-size: 16px;
        }

        .stats-container {
            margin: 0 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-block {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 16px 20px;
            backdrop-filter: blur(4px);
        }

        .stat-block-top {
            text-align: center;
        }

        .stat-block-bottom {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-block-item {
            flex: 1;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            padding: 12px 10px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .stat-label {
            font-size: 13px;
            color: #8e98a3;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #b87aff;
        }

        .stat-value-large {
            font-size: 30px;
        }

        .roulette-container {
            margin: 0 20px 25px;
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 20px;
            overflow: hidden;
        }

        .roulette-header {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .timer {
            background: rgba(106, 13, 173, 0.4);
            padding: 8px 18px;
            border-radius: 40px;
            color: #b87aff;
            font-weight: 800;
            font-size: 24px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            text-align: center;
            min-width: 80px;
        }

        .timer.waiting {
            background: rgba(255, 165, 0, 0.2);
            color: #ffaa00;
        }

        .roulette-track {
            position: relative;
            height: 150px;
            overflow: hidden;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(138, 43, 226, 0.4);
            margin-top: 10px;
        }

        .pointer-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 150px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .pointer-line {
            width: 6px;
            height: 150px;
            background: linear-gradient(to bottom, #b87aff, #9b4dff);
            box-shadow: 0 0 20px #b87aff;
        }

        .roulette-items {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            transition: left 5s cubic-bezier(0.25, 0.1, 0.2, 1);
            will-change: left;
        }

        .roulette-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(20, 25, 35, 0.95);
            border: 2px solid rgba(155, 77, 255, 0.6);
            border-radius: 25px;
            padding: 10px 12px;
            min-width: 90px;
            box-shadow: 0 4px 0 #1a1428;
        }

        .roulette-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            border: 2px solid #b87aff;
            background-size: cover;
            background-position: center;
        }

        .roulette-bet {
            font-weight: 700;
            color: #b87aff;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .players-container {
            margin: 0 20px 25px;
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 20px;
        }

        .players-header {
            display: flex;
            justify-content: space-between;
            color: #b87aff;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .player-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            border: 2px solid #b87aff;
            background-size: cover;
            background-position: center;
        }

        .player-name-small {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }

        .player-bet-small {
            font-weight: 700;
            color: #b87aff;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .no-players {
            text-align: center;
            color: #8e98a3;
            padding: 30px;
            font-size: 14px;
        }

        .bet-button-container {
            margin: 0 20px 25px;
        }

        .open-bet-btn {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            border-radius: 60px;
            padding: 18px;
            width: 100%;
            color: white;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 0 #2d0b4e;
            transition: all 0.1s;
        }

        .open-bet-btn:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        .open-bet-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .open-bet-btn.waiting {
            opacity: 0.5;
            pointer-events: none;
            background: linear-gradient(145deg, #666, #444);
        }
    </style>
</head>
<body>
    <div class="win-notification" id="winNotification"></div>

    <div class="modal-overlay" id="betModal">
        <div class="bet-modal">
            <div class="modal-close" id="closeModal">
                <i class="fas fa-times"></i>
            </div>
            <div class="modal-title">СДЕЛАТЬ СТАВКУ</div>
            <input type="number" class="modal-input" id="modalBetInput" value="100" min="10" max="100000" step="1">
            <div class="modal-buttons">
                <div class="modal-btn" id="modalHalfBtn">½</div>
                <div class="modal-btn" id="modalDoubleBtn">x2</div>
                <div class="modal-btn" id="modalMinBtn">Мин</div>
                <div class="modal-btn" id="modalMaxBtn">Макс</div>
            </div>
            <div class="modal-error" id="modalError"></div>
            <button class="modal-submit" id="modalSubmitBtn">ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <div class="app">
        <div class="profile-header">
            <div class="profile-left">
                <div class="avatar" id="avatar"></div>
                <div class="nick-level">
                    <div class="nick" id="nickname">Загрузка...</div>
                </div>
            </div>
            <div class="balance-right">
                <div class="balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceDisplay">10000</span>
                </div>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-block stat-block-top">
                <div class="stat-label">ОБЩИЙ БАНК</div>
                <div class="stat-value stat-value-large" id="totalPot">0</div>
            </div>
            <div class="stat-block stat-block-bottom">
                <div class="stat-block-item">
                    <div class="stat-label">% ВЫИГРЫША</div>
                    <div class="stat-value" id="winPercent">0</div>
                </div>
                <div class="stat-block-item">
                    <div class="stat-label">ВАША СТАВКА</div>
                    <div class="stat-value" id="yourBet">0</div>
                </div>
            </div>
        </div>

        <div class="roulette-container">
            <div class="roulette-header">
                <div class="timer" id="rouletteTimer">0</div>
            </div>
            <div class="roulette-track">
                <div class="pointer-container">
                    <div class="pointer-line"></div>
                </div>
                <div class="roulette-items" id="rouletteItems"></div>
            </div>
        </div>

        <div class="bet-button-container">
            <button class="open-bet-btn" id="openBetBtn">СДЕЛАТЬ СТАВКУ</button>
        </div>

        <div class="players-container">
            <div class="players-header">
                <span>ИГРОКИ</span>
                <span>СТАВКА</span>
            </div>
            <div id="playersList" class="players-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        const TOTAL_ROULETTE_ITEMS = 50;
        
        let userData = {
            id: null,
            firstName: '',
            lastName: '',
            avatarUrl: null
        };
        
        let players = [];
        let userHasBet = false;
        let roundActive = true;
        let roundInProgress = false;
        let roundEndTime = null;
        let timerStarted = false;

        // Получаем данные из Telegram
        if (tg) {
            tg.ready();
            
            const user = tg.initDataUnsafe?.user;
            if (user) {
                userData.id = user.id;
                userData.firstName = user.first_name || '';
                userData.lastName = user.last_name || '';
                
                let fullName = userData.firstName;
                if (userData.lastName) fullName += ' ' + userData.lastName;
                document.getElementById('nickname').innerText = fullName;
                
                if (user.photo_url) {
                    userData.avatarUrl = user.photo_url;
                    document.getElementById('avatar').style.backgroundImage = `url(${user.photo_url})`;
                } else {
                    document.getElementById('avatar').innerText = userData.firstName.charAt(0).toUpperCase();
                }
            }
        }

        // ========== ХРАНИЛИЩЕ ==========
        const STATE_KEY = 'yeter_jackpot_live';
        
        function getGameState() {
            const saved = localStorage.getItem(STATE_KEY);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    return createNewRound();
                }
            }
            return createNewRound();
        }
        
        function createNewRound() {
            return {
                players: [],
                totalPot: 0,
                roundActive: true,
                timerStarted: false,
                roundEndTime: null
            };
        }
        
        function saveGameState(state) {
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        // Загружаем состояние
        let gameState = getGameState();
        players = gameState.players || [];
        roundActive = gameState.roundActive;
        timerStarted = gameState.timerStarted;
        roundEndTime = gameState.roundEndTime;

        // ПРОВЕРЯЕМ, ЕСТЬ ЛИ УЖЕ СТАВКА У ЭТОГО ПОЛЬЗОВАТЕЛЯ
        const existingPlayer = players.find(p => p.id === userData.id);
        if (existingPlayer) {
            userHasBet = true;
        }

        function addPlayer(player) {
            // Удаляем старую ставку этого пользователя если была
            players = players.filter(p => p.id !== player.id);
            players.push(player);
            
            let total = players.reduce((sum, p) => sum + p.bet, 0);
            
            if (players.length >= 2 && !timerStarted && roundActive) {
                timerStarted = true;
                roundEndTime = Date.now() + 15000;
            }
            
            gameState = {
                players: players,
                totalPot: total,
                roundActive: roundActive,
                timerStarted: timerStarted,
                roundEndTime: roundEndTime
            };
            
            saveGameState(gameState);
            updateAllDisplays();
        }

        function startNewRound() {
            players = [];
            timerStarted = false;
            roundEndTime = null;
            roundActive = true;
            userHasBet = false;
            
            gameState = {
                players: [],
                totalPot: 0,
                roundActive: true,
                timerStarted: false,
                roundEndTime: null
            };
            
            saveGameState(gameState);
            updateAllDisplays();
        }

        function pickWinner() {
            roundActive = false;
            
            if (players.length === 0) {
                setTimeout(startNewRound, 5000);
                return;
            }
            
            let lotteryPool = [];
            players.forEach(p => {
                for (let i = 0; i < p.bet; i++) lotteryPool.push(p);
            });
            
            const winner = lotteryPool[Math.floor(Math.random() * lotteryPool.length)];
            
            // Анимация
            roundInProgress = true;
            const roulette = document.getElementById('rouletteItems');
            roulette.style.transition = 'left 5s cubic-bezier(0.25, 0.1, 0.2, 1)';
            roulette.style.left = - (2500 + Math.random() * 2000) + 'px';
            
            setTimeout(() => {
                if (winner && winner.id === userData.id) {
                    const total = gameState.totalPot;
                    const winNotif = document.getElementById('winNotification');
                    winNotif.innerHTML = `🎉 ВЫИГРЫШ ${total} 🧩`;
                    winNotif.classList.add('show');
                    setTimeout(() => winNotif.classList.remove('show'), 5000);
                }
                roundInProgress = false;
                setTimeout(startNewRound, 3000);
            }, 5000);
        }

        function generateRouletteItems() {
            if (players.length === 0) return [];
            
            const total = gameState.totalPot;
            const items = [];
            
            for (let i = 0; i < TOTAL_ROULETTE_ITEMS; i++) {
                const randomValue = Math.random() * total;
                let cumulative = 0;
                for (const player of players) {
                    cumulative += player.bet;
                    if (randomValue < cumulative) {
                        items.push(player);
                        break;
                    }
                }
            }
            return items;
        }

        function updateAllDisplays() {
            // Обновляем статистику
            document.getElementById('totalPot').innerText = gameState.totalPot;
            
            const userPlayer = players.find(p => p.id === userData.id);
            if (userPlayer) {
                userHasBet = true;
                document.getElementById('yourBet').innerText = userPlayer.bet;
                let winPercent = ((userPlayer.bet / gameState.totalPot) * 100).toFixed(1);
                document.getElementById('winPercent').innerText = winPercent;
            } else {
                userHasBet = false;
                document.getElementById('yourBet').innerText = '0';
                document.getElementById('winPercent').innerText = '0';
            }
            
            // Обновляем таймер
            const timerEl = document.getElementById('rouletteTimer');
            if (timerStarted && roundEndTime) {
                const remaining = Math.max(0, Math.floor((roundEndTime - Date.now()) / 1000));
                timerEl.innerText = remaining;
                timerEl.classList.remove('waiting');
                
                if (remaining <= 0 && roundActive && !roundInProgress) {
                    document.getElementById('openBetBtn').classList.add('disabled');
                    pickWinner();
                }
            } else {
                timerEl.innerText = '0';
                if (players.length >= 2) {
                    timerEl.classList.add('waiting');
                } else {
                    timerEl.classList.remove('waiting');
                }
            }
            
            // Обновляем кнопку
            const betBtn = document.getElementById('openBetBtn');
            if (userHasBet) {
                betBtn.classList.add('waiting');
                betBtn.innerText = 'ОЖИДАНИЕ РАУНДА';
            } else if (!roundActive || roundInProgress) {
                betBtn.classList.add('disabled');
                betBtn.innerText = 'СДЕЛАТЬ СТАВКУ';
            } else {
                betBtn.classList.remove('disabled', 'waiting');
                betBtn.innerText = 'СДЕЛАТЬ СТАВКУ';
            }
            
            // Обновляем список игроков
            updatePlayersList();
            updateRoulette();
        }

        function updatePlayersList() {
            const listDiv = document.getElementById('playersList');
            
            if (players.length === 0) {
                listDiv.innerHTML = '<div class="no-players">ПОКА НЕТ СТАВОК</div>';
                return;
            }
            
            const sorted = [...players].sort((a, b) => b.bet - a.bet);
            
            listDiv.innerHTML = sorted.map(p => {
                const displayName = p.firstName + (p.lastName ? ' ' + p.lastName : '');
                return `
                <div class="player-row">
                    <div class="player-info">
                        <div class="player-avatar-small" style="background-image: ${p.avatarUrl ? `url(${p.avatarUrl})` : 'none'}; background-size: cover;">${!p.avatarUrl ? (p.firstName?.charAt(0) || '?') : ''}</div>
                        <span class="player-name-small">${displayName}</span>
                    </div>
                    <div class="player-bet-small">
                        ${p.bet} <span class="puzzle-icon">🧩</span>
                    </div>
                </div>
            `}).join('');
        }

        function updateRoulette() {
            const roulette = document.getElementById('rouletteItems');
            
            if (players.length === 0) {
                roulette.innerHTML = '';
                return;
            }
            
            const items = generateRouletteItems();
            
            roulette.innerHTML = items.map(p => {
                return `
                <div class="roulette-item">
                    <div class="roulette-avatar" style="background-image: ${p.avatarUrl ? `url(${p.avatarUrl})` : 'none'}; background-size: cover;">${!p.avatarUrl ? (p.firstName?.charAt(0) || '?') : ''}</div>
                    <div class="roulette-bet">
                        ${p.bet} <span class="puzzle-icon">🧩</span>
                    </div>
                </div>
            `}).join('');
        }

        // Модальное окно
        const modal = document.getElementById('betModal');
        const openBtn = document.getElementById('openBetBtn');
        const closeBtn = document.getElementById('closeModal');
        const modalBetInput = document.getElementById('modalBetInput');
        const modalError = document.getElementById('modalError');
        const modalSubmit = document.getElementById('modalSubmitBtn');
        
        openBtn.addEventListener('click', () => {
            if (userHasBet || !roundActive || roundInProgress) return;
            modalBetInput.value = 100;
            modalError.innerText = '';
            modal.classList.add('active');
        });
        
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        document.getElementById('modalHalfBtn').addEventListener('click', () => {
            let val = parseInt(modalBetInput.value) || 100;
            modalBetInput.value = Math.max(10, Math.floor(val / 2));
        });

        document.getElementById('modalDoubleBtn').addEventListener('click', () => {
            let val = parseInt(modalBetInput.value) || 100;
            modalBetInput.value = Math.min(100000, Math.max(10, val * 2));
        });

        document.getElementById('modalMinBtn').addEventListener('click', () => modalBetInput.value = 10);
        document.getElementById('modalMaxBtn').addEventListener('click', () => modalBetInput.value = 100000);

        modalSubmit.addEventListener('click', () => {
            let amount = parseInt(modalBetInput.value);
            if (isNaN(amount) || amount < 10) amount = 10;
            if (amount > 100000) amount = 100000;
            
            if (amount > 10000) {
                modalError.innerText = 'НЕДОСТАТОЧНО СРЕДСТВ';
                setTimeout(() => modalError.innerText = '', 3000);
                return;
            }
            
            if (userHasBet || !roundActive || roundInProgress) {
                modal.classList.remove('active');
                return;
            }
            
            addPlayer({
                id: userData.id,
                firstName: userData.firstName,
                lastName: userData.lastName,
                avatarUrl: userData.avatarUrl,
                bet: amount
            });
            
            modal.classList.remove('active');
        });

        // Обновление каждые 200мс
        setInterval(() => {
            const currentState = getGameState();
            if (JSON.stringify(currentState) !== JSON.stringify(gameState)) {
                gameState = currentState;
                players = gameState.players || [];
                timerStarted = gameState.timerStarted;
                roundEndTime = gameState.roundEndTime;
                roundActive = gameState.roundActive;
                updateAllDisplays();
            }
            
            if (modal.classList.contains('active') && (!roundActive || roundInProgress)) {
                modal.classList.remove('active');
                modalError.innerText = '';
            }
        }, 200);

        // Первое обновление
        updateAllDisplays();
    </script>
</body>
</html>
