<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · МИНЫ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        
        body {
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        /* ========== ОПТИМИЗИРОВАННЫЕ ЗВЕЗДЫ ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0;
            animation: twinkle 4s infinite ease-in-out;
        }

        .star.medium {
            width: 3px;
            height: 3px;
        }

        .star.large {
            width: 4px;
            height: 4px;
        }

        @keyframes twinkle {
            0% { opacity: 0; }
            20% { opacity: 0.8; }
            40% { opacity: 0.3; }
            60% { opacity: 0.6; }
            80% { opacity: 0.2; }
            100% { opacity: 0; }
        }

        .app { 
            max-width: 440px; 
            width: 100%; 
            background: transparent; 
            position: relative; 
            min-height: 100vh; 
            padding-bottom: 20px;
            z-index: 1;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 18px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 20px 16px; 
            background: transparent; 
        }
        
        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b87aff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            background: rgba(106, 13, 173, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            transition: 0.1s ease;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .back-button:active { 
            background: rgba(106, 13, 173, 0.3); 
            transform: scale(0.95);
        }
        
        .balance-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 14, 22, 0.8);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(138, 43, 226, 0.4);
        }
        
        .balance { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            font-weight: 700; 
            font-size: 16px; 
            color: white; 
        }
        
        .player-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 14, 22, 0.6);
            backdrop-filter: blur(5px);
            padding: 15px 20px;
            margin: 0 20px 20px;
            border-radius: 25px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        
        .avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }
        
        .profile-info { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        
        .profile-name { 
            font-size: 16px; 
            font-weight: 700; 
            color: white; 
        }
        
        .profile-level-row { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .level-number {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: white;
        }
        
        .progress-small {
            width: 70px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }
        
        .progress-fill-small { 
            height: 100%; 
            background: linear-gradient(90deg, #9b4dff, #b87aff); 
            border-radius: 20px; 
            transition: width 0.2s ease;
        }
        
        .next-level { 
            color: #b87aff; 
            font-size: 14px; 
            font-weight: 700; 
        }
        
        .message-container {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .game-message {
            width: 100%;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.3);
            animation: messagePop 0.3s ease;
            min-height: 56px;
            text-align: center;
        }
        
        @keyframes messagePop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .game-message.success {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
            border: 1px solid rgba(46, 204, 113, 0.5);
        }
        
        .game-message.error {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
            border: 1px solid rgba(231, 76, 60, 0.5);
        }
        
        .game-message.warning {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
            border: 1px solid rgba(243, 156, 18, 0.5);
        }
        
        .game-container { 
            padding: 0 20px; 
        }
        
        /* КРАСИВЫЕ МИНЫ И ПАЗЛЫ */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(10, 14, 22, 0.4);
            padding: 20px;
            border-radius: 28px;
            border: 1px solid rgba(138, 43, 226, 0.2);
        }
        
        .mine-cell {
            aspect-ratio: 1;
            background: rgba(20, 25, 35, 0.8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            border: 1px solid rgba(138, 43, 226, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            box-shadow: 0 4px 0 #0a0c16;
        }
        
        .mine-cell:hover { 
            transform: scale(1.05); 
            border-color: rgba(255, 215, 0, 0.6); 
            background: rgba(40, 45, 60, 0.9); 
        }
        
        .mine-cell.revealed { 
            animation: cellReveal 0.3s ease; 
        }
        
        @keyframes cellReveal { 
            0% { transform: scale(0.8); opacity: 0.5; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        
        .mine-cell.star { 
            background: rgba(255, 215, 0, 0.15); 
            border-color: #ffd700; 
        }
        
        .mine-cell.mine { 
            background: rgba(255, 59, 48, 0.15); 
            border-color: #ff3b30; 
        }

        .mine-cell.star i {
            color: #ffd700;
            font-size: 24px;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }

        .mine-cell.mine i {
            color: #ff4444;
            font-size: 24px;
            filter: drop-shadow(0 0 5px rgba(255, 68, 68, 0.5));
        }
        
        .controls-row { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 20px; 
            align-items: center; 
        }
        
        .input-group { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        
        .input-label { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            color: #b87aff; 
            font-size: 14px; 
            font-weight: 800; 
            letter-spacing: 0.3px; 
        }
        
        .input-field {
            background: rgba(10, 14, 22, 0.8);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.1s ease;
            width: 100%;
        }
        
        .input-field:focus { 
            border-color: #9b4dff; 
            background: rgba(20, 25, 35, 0.9); 
        }
        
        .action-button {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #2d0b4e;
            transition: all 0.1s ease;
            margin-bottom: 20px;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        
        .action-button:active { 
            transform: translateY(6px); 
            box-shadow: 0 0 0 #2d0b4e; 
        }
        
        .action-button.disabled { 
            opacity: 0.6; 
            pointer-events: none; 
        }
        
        .cooldown-message {
            width: 100%;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
            border: 1px solid rgba(243, 156, 18, 0.5);
            box-shadow: 0 6px 0 #b85e0a;
            animation: messagePop 0.3s ease;
            min-height: 56px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="header">
            <a href="index.html" class="back-button" onclick="window.location.href='index.html'; return false;">
                <i class="fas fa-arrow-left"></i>
                <span>Назад</span>
            </a>
            <div class="balance-wrapper">
                <div class="balance">
                    <span id="balanceDisplay">12.5k</span>
                    <span class="puzzle-icon">🧩</span>
                </div>
            </div>
        </div>
        
        <div class="player-profile">
            <div class="avatar-small" id="playerAvatar"></div>
            <div class="profile-info">
                <div class="profile-name" id="playerName">Загрузка...</div>
                <div class="profile-level-row">
                    <div class="level-number" id="levelDisplay">1</div>
                    <div class="progress-small">
                        <div class="progress-fill-small" id="progressFill" style="width: 0%;"></div>
                    </div>
                    <span class="next-level" id="nextLevelDisplay">2</span>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <div class="mines-grid" id="minesGrid"></div>
            <div class="controls-row">
                <div class="input-group">
                    <div class="input-label">
                        <i class="fas fa-bomb"></i>
                        Бомбы
                    </div>
                    <input type="number" id="minesCount" class="input-field" placeholder="2-24" min="2" max="24" value="3">
                </div>
                <div class="input-group">
                    <div class="input-label">
                        <i class="fas fa-puzzle-piece"></i>
                        Ставка
                    </div>
                    <input type="number" id="betAmount" class="input-field" placeholder="10-100k" value="50" min="10" max="100000">
                </div>
            </div>
            <button class="action-button" id="gameActionBtn">ИГРАТЬ</button>
            <div class="message-container" id="messageContainer"></div>
            <div id="cooldownContainer"></div>
        </div>
    </div>
    
    <script>
        // ========== ЗАЩИТА КАК ВЕЗДЕ ==========
        (function() {
            const tg = window.Telegram?.WebApp;
            
            if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #03050a; color: white; text-align: center; padding: 20px;">
                        <div>
                            <h2 style="margin-bottom: 20px; color: #ff4444;">❌ Доступ запрещен</h2>
                            <p style="color: #8e98a3; margin-bottom: 20px;">Приложение работает только в Telegram</p>
                        </div>
                    </div>
                `;
                throw new Error('Not in Telegram');
            }
        })();

        // ========== ОПТИМИЗИРОВАННЫЕ ЗВЕЗДЫ ==========
        function createStars() {
            const starsContainer = document.getElementById('stars');
            if (!starsContainer) return;
            
            starsContainer.innerHTML = '';
            
            requestAnimationFrame(() => {
                const isLowEnd = navigator.hardwareConcurrency <= 4 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                const starCount = isLowEnd ? 30 : 50;
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    
                    const size = Math.random();
                    if (size < 0.6) {
                        star.className = 'star';
                    } else if (size < 0.85) {
                        star.className = 'star medium';
                    } else {
                        star.className = 'star large';
                    }
                    
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 5 + 's';
                    
                    starsContainer.appendChild(star);
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createStars);
        } else {
            createStars();
        }

        document.addEventListener('visibilitychange', function() {
            const stars = document.getElementById('stars');
            if (stars) {
                if (document.hidden) {
                    stars.style.animation = 'none';
                } else {
                    stars.style.animation = '';
                }
            }
        });

        // ========== ГЛОБАЛЬНОЕ ХРАНИЛИЩЕ ==========
        (function() {
            const tg = window.Telegram?.WebApp;
            const userId = tg.initDataUnsafe.user.id;
            const STORAGE_KEY = `yeter_user_${userId}`;
            
            function loadUserData() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch {
                        return createDefaultData();
                    }
                }
                return createDefaultData();
            }
            
            function createDefaultData() {
                return {
                    stars: 12500,
                    level: 1,
                    exp: 0,
                    expToNext: 1000,
                    gifts: [],
                    games: { mines: { wins: 0, losses: 0 } },
                    transactions: [],
                    lastSync: Date.now()
                };
            }
            
            let userData = loadUserData();
            
            function saveUserData() {
                userData.lastSync = Date.now();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
                localStorage.setItem('yeter_data_updated', Date.now().toString());
                setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
            }
            
            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY && e.newValue) {
                    try {
                        const newData = JSON.parse(e.newValue);
                        if (newData.lastSync > userData.lastSync) {
                            userData = newData;
                            updateUIDisplay();
                        }
                    } catch {}
                }
                if (e.key === 'yeter_data_updated') {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            const newData = JSON.parse(saved);
                            if (newData.lastSync > userData.lastSync) {
                                userData = newData;
                                updateUIDisplay();
                            }
                        } catch {}
                    }
                }
            });
            
            setInterval(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const newData = JSON.parse(saved);
                        if (newData.lastSync > userData.lastSync) {
                            userData = newData;
                            updateUIDisplay();
                        }
                    } catch {}
                }
            }, 2000);
            
            window.UserStorage = {
                getStars: function() { return userData.stars; },
                getLevel: function() { return userData.level; },
                getExp: function() { return userData.exp; },
                getExpToNext: function() { return userData.expToNext; },
                getUserData: function() { return { ...userData }; },
                
                updateStars: function(amount, reason) {
                    if (userData.stars + amount < 0) return false;
                    userData.stars += amount;
                    if (!userData.transactions) userData.transactions = [];
                    userData.transactions.push({ amount, reason, time: Date.now(), balance: userData.stars });
                    if (userData.transactions.length > 50) userData.transactions = userData.transactions.slice(-50);
                    saveUserData();
                    return true;
                },
                
                addExp: function(amount) {
                    userData.exp += amount;
                    while (userData.exp >= userData.expToNext) {
                        userData.exp -= userData.expToNext;
                        userData.level++;
                        userData.expToNext = Math.floor(userData.expToNext * 1.5);
                    }
                    saveUserData();
                },
                
                updateGameStats: function(game, won) {
                    if (!userData.games) userData.games = {};
                    if (!userData.games[game]) userData.games[game] = { wins: 0, losses: 0 };
                    if (won) {
                        userData.games[game].wins++;
                    } else {
                        userData.games[game].losses++;
                    }
                    saveUserData();
                },
                
                forceUpdate: function() {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            const newData = JSON.parse(saved);
                            userData = newData;
                            updateUIDisplay();
                        } catch {}
                    }
                }
            };
        })();

        // ========== ФОРМАТИРОВАНИЕ ЧИСЕЛ ==========
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'м';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'к';
            }
            return num.toString();
        }

        // ========== ОБНОВЛЕНИЕ UI ==========
        function updateUIDisplay() {
            const data = window.UserStorage.getUserData();
            document.getElementById('balanceDisplay').innerText = formatNumber(data.stars);
            document.getElementById('levelDisplay').innerText = data.level;
            document.getElementById('nextLevelDisplay').innerText = data.level + 1;
            
            const progress = (data.exp / data.expToNext) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // ========== TELEGRAM ПРОФИЛЬ ==========
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            
            const user = tg.initDataUnsafe?.user;
            if (user) {
                const firstName = user.first_name || '';
                const lastName = user.last_name || '';
                const fullName = (firstName + ' ' + lastName).trim() || 'Player';
                
                document.getElementById('playerName').innerText = fullName;
                
                if (user.photo_url) {
                    document.getElementById('playerAvatar').style.backgroundImage = `url('${user.photo_url}')`;
                    document.getElementById('playerAvatar').style.backgroundColor = 'transparent';
                    document.getElementById('playerAvatar').style.backgroundSize = 'cover';
                    document.getElementById('playerAvatar').innerText = '';
                } else {
                    document.getElementById('playerAvatar').innerText = (firstName.charAt(0) || 'П').toUpperCase();
                }
            }
        }

        // ========== ИГРОВАЯ ЛОГИКА ==========
        let gameState = {
            minesCount: 3,
            betAmount: 50,
            gameActive: false,
            board: [],
            revealedCount: 0,
            totalMines: 0,
            multiplier: 1.00,
            hasRevealedAtLeastOne: false,
            minePositions: [],
            canStartNewGame: true,
            lastGameEndTime: 0,
            cooldownSeconds: 2,
            cooldownInterval: null
        };

        function showMessage(message, type = 'success') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            const messageEl = document.createElement('div');
            messageEl.className = `game-message ${type}`;
            messageEl.innerHTML = `<span>${message}</span>`;
            container.appendChild(messageEl);
            
            setTimeout(() => {
                if (messageEl.parentNode) {
                    messageEl.style.animation = 'messagePop 0.3s reverse';
                    setTimeout(() => messageEl.remove(), 300);
                }
            }, 3000);
        }

        function showTwoLineMessage(topText, bottomText, type = 'error') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            const messageEl = document.createElement('div');
            messageEl.className = `game-message ${type}`;
            messageEl.style.flexDirection = 'column';
            messageEl.style.padding = '12px 16px';
            messageEl.innerHTML = `
                <span>${topText}</span>
                <div style="display: flex; align-items: center; gap: 4px; font-size: 20px;">
                    <span>${bottomText}</span>
                </div>
            `;
            container.appendChild(messageEl);
            
            setTimeout(() => {
                if (messageEl.parentNode) {
                    messageEl.style.animation = 'messagePop 0.3s reverse';
                    setTimeout(() => messageEl.remove(), 300);
                }
            }, 3000);
        }

        function showCooldownMessage(seconds) {
            const container = document.getElementById('cooldownContainer');
            container.innerHTML = '';
            const messageEl = document.createElement('div');
            messageEl.className = 'cooldown-message';
            messageEl.id = 'cooldownMessage';
            messageEl.innerHTML = `
                <i class="fas fa-hourglass-half"></i>
                <span>Упс! Попробуйте через ${seconds}с</span>
            `;
            container.appendChild(messageEl);
        }

        function updateCooldownMessage(seconds) {
            const messageEl = document.getElementById('cooldownMessage');
            if (messageEl) {
                messageEl.innerHTML = `
                    <i class="fas fa-hourglass-half"></i>
                    <span>Упс! Попробуйте через ${seconds}с</span>
                `;
            }
        }

        function removeCooldownMessage() {
            const container = document.getElementById('cooldownContainer');
            container.innerHTML = '';
            if (gameState.cooldownInterval) {
                clearInterval(gameState.cooldownInterval);
                gameState.cooldownInterval = null;
            }
        }

        function startCooldown() {
            const now = Date.now();
            const timeSinceLastGame = (now - gameState.lastGameEndTime) / 1000;
            
            if (timeSinceLastGame < gameState.cooldownSeconds) {
                const remainingSeconds = Math.ceil(gameState.cooldownSeconds - timeSinceLastGame);
                showCooldownMessage(remainingSeconds);
                
                if (gameState.cooldownInterval) clearInterval(gameState.cooldownInterval);
                
                let secondsLeft = remainingSeconds;
                gameState.cooldownInterval = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft <= 0) {
                        clearInterval(gameState.cooldownInterval);
                        gameState.cooldownInterval = null;
                        removeCooldownMessage();
                    } else {
                        updateCooldownMessage(secondsLeft);
                    }
                }, 1000);
                
                return false;
            }
            return true;
        }

        function initBoard(minesCount) {
            const board = [];
            for (let i = 0; i < 25; i++) board.push({ type: 'star', revealed: false, index: i });
            gameState.minePositions = [];
            let placed = 0;
            while (placed < minesCount) {
                const index = Math.floor(Math.random() * 25);
                if (board[index].type !== 'mine') {
                    board[index].type = 'mine';
                    gameState.minePositions.push(index);
                    placed++;
                }
            }
            return board;
        }

        function renderBoard() {
            const grid = document.getElementById('minesGrid');
            if (!grid) return;
            let html = '';
            gameState.board.forEach((cell, index) => {
                let content = '';
                let classes = 'mine-cell';
                if (cell.revealed) {
                    classes += ' revealed';
                    if (cell.type === 'star') { 
                        content = '<i class="fas fa-star"></i>'; 
                        classes += ' star'; 
                    } else { 
                        content = '<i class="fas fa-bomb"></i>'; 
                        classes += ' mine'; 
                    }
                }
                html += `<div class="${classes}" data-index="${index}">${content}</div>`;
            });
            grid.innerHTML = html;
        }

        function revealAllMines() {
            gameState.minePositions.forEach(pos => {
                if (gameState.board[pos] && !gameState.board[pos].revealed) {
                    gameState.board[pos].revealed = true;
                }
            });
            renderBoard();
        }

        function calculateExactMultiplier(revealed, totalMines) {
            if (revealed === 0) return 1.00;
            let probability = 1.0;
            let safeCells = 25 - totalMines;
            for (let i = 0; i < revealed; i++) {
                probability *= (safeCells - i) / (25 - i);
            }
            return Math.round((1 / probability) * 100) / 100;
        }

        function resetBoard() {
            gameState.board = initBoard(gameState.minesCount);
            gameState.revealedCount = 0;
            gameState.gameActive = false;
            gameState.hasRevealedAtLeastOne = false;
            renderBoard();
            const btn = document.getElementById('gameActionBtn');
            btn.innerText = 'ИГРАТЬ';
            btn.classList.remove('disabled');
        }

        function startGame() {
            if (!gameState.canStartNewGame) return;
            
            if (!startCooldown()) return;
            
            const minesInput = document.getElementById('minesCount');
            const betInput = document.getElementById('betAmount');
            gameState.minesCount = parseInt(minesInput.value);
            gameState.betAmount = parseInt(betInput.value);
            
            if (isNaN(gameState.minesCount) || gameState.minesCount < 2) { 
                showTwoLineMessage('Минимальное количество бомб', '2', 'error'); 
                return; 
            }
            if (gameState.minesCount > 24) { 
                showTwoLineMessage('Максимальное количество бомб', '24', 'error'); 
                return; 
            }
            if (isNaN(gameState.betAmount)) {
                showMessage('Введите сумму ставки', 'warning'); 
                return;
            }
            if (gameState.betAmount < 10) { 
                showTwoLineMessage('Минимальная сумма ставки', '10', 'error'); 
                return; 
            }
            if (gameState.betAmount > 100000) { 
                showTwoLineMessage('Максимальная сумма ставки', '100000', 'error'); 
                return; 
            }
            
            const currentStars = window.UserStorage.getStars();
            if (gameState.betAmount > currentStars) { 
                showMessage('Недостаточно средств', 'error'); 
                return; 
            }
            
            // Списываем ставку
            if (!window.UserStorage.updateStars(-gameState.betAmount, 'Ставка в Мины')) {
                showMessage('Ошибка транзакции', 'error');
                return;
            }
            
            gameState.gameActive = true;
            gameState.totalMines = gameState.minesCount;
            gameState.revealedCount = 0;
            gameState.hasRevealedAtLeastOne = false;
            gameState.multiplier = 1.00;
            gameState.board = initBoard(gameState.minesCount);
            gameState.canStartNewGame = false;
            renderBoard();
            
            const btn = document.getElementById('gameActionBtn');
            const winAmount = Math.floor(gameState.betAmount * gameState.multiplier);
            btn.innerText = `ЗАБРАТЬ ${gameState.multiplier.toFixed(2)}x (${formatNumber(winAmount)}🧩)`;
            btn.classList.remove('disabled');
            
            updateUIDisplay();
            
            // Отправляем сигнал об обновлении
            localStorage.setItem('yeter_data_updated', Date.now().toString());
            setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
        }

        function cashout() {
            if (!gameState.hasRevealedAtLeastOne) {
                showMessage('Нужно открыть хотя бы 1 клетку!', 'warning');
                return;
            }
            const winAmount = Math.floor(gameState.betAmount * gameState.multiplier);
            
            if (window.UserStorage.updateStars(winAmount, 'Выигрыш в Мины')) {
                window.UserStorage.addExp(Math.floor(gameState.betAmount / 10));
                window.UserStorage.updateGameStats('mines', true);
                
                showMessage(`ВЫИГРЫШ +${formatNumber(winAmount)} 🧩`, 'success');
            }
            
            gameState.lastGameEndTime = Date.now();
            gameState.gameActive = false;
            gameState.canStartNewGame = true;
            updateUIDisplay();
            resetBoard();
            
            // Отправляем сигнал об обновлении
            localStorage.setItem('yeter_data_updated', Date.now().toString());
            setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
        }

        function revealCell(index) {
            if (!gameState.gameActive) return;
            if (gameState.board[index].revealed) return;
            
            const cell = gameState.board[index];
            cell.revealed = true;
            
            if (cell.type === 'mine') {
                revealAllMines();
                showMessage(`ПРОИГРЫШ -${formatNumber(gameState.betAmount)} 🧩`, 'error');
                window.UserStorage.updateGameStats('mines', false);
                window.UserStorage.addExp(1);
                
                gameState.lastGameEndTime = Date.now();
                gameState.gameActive = false;
                gameState.canStartNewGame = true;
                
                const btn = document.getElementById('gameActionBtn');
                btn.innerText = 'ИГРАТЬ';
                btn.classList.remove('disabled');
                
                setTimeout(() => {
                    resetBoard();
                }, 1500);
            } else {
                gameState.revealedCount++;
                gameState.hasRevealedAtLeastOne = true;
                gameState.multiplier = calculateExactMultiplier(gameState.revealedCount, gameState.totalMines);
                const btn = document.getElementById('gameActionBtn');
                const winAmount = Math.floor(gameState.betAmount * gameState.multiplier);
                btn.innerText = `ЗАБРАТЬ ${gameState.multiplier.toFixed(2)}x (${formatNumber(winAmount)}🧩)`;
                btn.classList.remove('disabled');
                renderBoard();
            }
            
            updateUIDisplay();
            
            // Отправляем сигнал об обновлении
            localStorage.setItem('yeter_data_updated', Date.now().toString());
            setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        window.onload = function() {
            updateUIDisplay();
            gameState.board = initBoard(3);
            renderBoard();
            
            document.getElementById('gameActionBtn').addEventListener('click', () => {
                if (!gameState.gameActive && gameState.canStartNewGame) startGame();
                else if (gameState.gameActive) cashout();
            });
            
            document.getElementById('minesCount').addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                if (val < 2) e.target.value = 2;
                if (val > 24) e.target.value = 24;
                if (!gameState.gameActive) {
                    gameState.minesCount = parseInt(e.target.value);
                    resetBoard();
                }
            });
            
            document.getElementById('betAmount').addEventListener('input', (e) => {
                let val = e.target.value;
                if (val === '') return;
                let num = parseInt(val);
                if (!isNaN(num) && num > 100000) e.target.value = 100000;
                if (!isNaN(num) && num < 10) e.target.value = 10;
            });
            
            document.addEventListener('click', (e) => {
                const cell = e.target.closest('.mine-cell');
                if (cell && cell.closest('#minesGrid')) {
                    const index = parseInt(cell.dataset.index);
                    revealCell(index);
                }
            });
            
            setTimeout(() => {
                window.UserStorage.forceUpdate();
            }, 500);
        };
    </script>
</body>
</html>
