<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · MINES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0;
            animation: twinkle 4s infinite ease-in-out;
        }

        .star.medium {
            width: 3px;
            height: 3px;
        }

        .star.large {
            width: 4px;
            height: 4px;
        }

        @keyframes twinkle {
            0% { opacity: 0; }
            20% { opacity: 0.8; }
            40% { opacity: 0.3; }
            60% { opacity: 0.6; }
            80% { opacity: 0.2; }
            100% { opacity: 0; }
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            position: relative;
            padding-bottom: 20px;
            min-height: 100vh;
            z-index: 1;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 18px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 16px;
            background: transparent;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b87aff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            background: rgba(106, 13, 173, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            transition: 0.1s ease;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .back-button:active {
            background: rgba(106, 13, 173, 0.3);
            transform: scale(0.95);
        }

        .balance-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 14, 22, 0.8);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(138, 43, 226, 0.4);
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }

        .add-balance-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .add-balance-btn:active {
            background: rgba(106, 13, 173, 0.5);
            transform: scale(0.95);
        }

        .player-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 14, 22, 0.6);
            backdrop-filter: blur(5px);
            padding: 15px 20px;
            margin: 0 20px 20px;
            border-radius: 25px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-name {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .profile-level-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .level-number {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: white;
        }

        .progress-small {
            width: 70px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }

        .progress-fill-small {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            transition: width 0.2s ease;
        }

        .next-level {
            color: #b87aff;
            font-size: 14px;
            font-weight: 700;
        }

        .message-container {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-message {
            width: 100%;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.3);
            animation: messagePop 0.3s ease;
            min-height: 56px;
            text-align: center;
        }

        @keyframes messagePop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .game-message.success {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
            border: 1px solid rgba(46, 204, 113, 0.5);
        }

        .game-message.error {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
            border: 1px solid rgba(231, 76, 60, 0.5);
        }

        .game-message.warning {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
            border: 1px solid rgba(243, 156, 18, 0.5);
        }

        .game-container {
            padding: 0 20px;
        }

        /* === ПОЛЕ (МИНЫ) === */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0 30px 0;
            padding: 0 5px;
        }

        .mine-cell {
            aspect-ratio: 1;
            background: #2a1e3a;  /* тёмно-фиолетовый */
            border: 1px solid #4a2a7a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.1s ease, border-color 0.1s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 0 #130b1f;
        }

        .mine-cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(180, 130, 255, 0.2), transparent 70%);
            pointer-events: none;
        }

        .mine-cell:active {
            transform: scale(0.92);
        }

        .mine-cell.revealed {
            background: #5d3a8a;  /* яркий фиолет для открытых */
            border-color: #b87aff;
            cursor: default;
            transform: scale(1);
        }

        .mine-cell.mine {
            background: #4a1a2a;
            border-color: #ff4444;
        }

        .mine-cell.mine i {
            color: #ff4444;
            font-size: 22px;
        }

        .mine-cell.gem i {
            color: #ffd700;
            font-size: 22px;
        }

        /* === НОВАЯ ПАНЕЛЬ УПРАВЛЕНИЯ (СНИЗУ) === */
        .bottom-controls {
            background: rgba(20, 10, 30, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 36px;
            padding: 20px 16px;
            border: 1px solid #4a2a7a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            margin-top: 10px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #c7a5ff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-left: 5px;
        }

        .input-field {
            background: #1a1128;
            border: 1px solid #5d3a8a;
            border-radius: 30px;
            padding: 14px 18px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: 0.1s ease;
            width: 100%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .input-field:focus {
            border-color: #b87aff;
            background: #221830;
        }

        .input-field[type="number"]::-webkit-inner-spin-button,
        .input-field[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-field[type="number"] {
            -moz-appearance: textfield;
        }

        /* кнопка ИГРАТЬ / ЗАБРАТЬ */
        .action-button {
            width: 100%;
            background: linear-gradient(145deg, #8a4dff, #5a2a9a);
            color: white;
            border: none;
            padding: 18px 24px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 0 #2d0b4e;
            transition: all 0.08s linear;
            min-height: 64px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border: 1px solid #b87aff;
        }

        .action-button:active:not(:disabled) {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2d0b4e;
        }

        .action-button:disabled {
            opacity: 0.4;
            filter: grayscale(0.6);
            pointer-events: none;
            box-shadow: 0 5px 0 #1f0f30;
            transform: translateY(3px);
        }

        .cashout-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1530;
            border-radius: 60px;
            padding: 12px 20px;
            border: 1px solid #7a4dbd;
            font-weight: 700;
            font-size: 18px;
            color: #e6d0ff;
        }

        .multiplier-badge {
            background: #4a2a7a;
            padding: 6px 18px;
            border-radius: 40px;
            color: #ffd966;
            font-size: 22px;
            font-weight: 800;
        }

        .win-preview {
            color: #b87aff;
            font-size: 20px;
            font-weight: 800;
        }

        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 10px 4px;
            border-radius: 30px;
            border: 1px solid #2a1e3a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: 25px;
            flex: 1;
            text-align: center;
            text-decoration: none;
            transition: all 0.1s ease;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.2);
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 18px;
            color: #8e98a3;
        }

        .nav-item.active {
            color: #b87aff;
            background: rgba(106, 13, 173, 0.3);
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="header">
            <a href="index.html" class="back-button" onclick="window.location.href='index.html'; return false;">
                <i class="fas fa-arrow-left"></i>
                <span>Назад</span>
            </a>
            <div class="balance-wrapper">
                <div class="balance">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceDisplay">12.5k</span>
                </div>
                <div class="add-balance-btn" id="addBalanceBtn">+</div>
            </div>
        </div>

        <div class="player-profile">
            <div class="avatar-small" id="playerAvatar"></div>
            <div class="profile-info">
                <div class="profile-name" id="playerName">Загрузка...</div>
                <div class="profile-level-row">
                    <div class="level-number" id="levelDisplay">1</div>
                    <div class="progress-small">
                        <div class="progress-fill-small" id="progressFill" style="width: 0%;"></div>
                    </div>
                    <span class="next-level" id="nextLevelDisplay">2</span>
                </div>
            </div>
        </div>

        <div class="game-container">
            <!-- СЕТКА 5x5 -->
            <div class="mines-grid" id="minesGrid"></div>

            <!-- НИЖНЯЯ ПАНЕЛЬ: ставка, мины, кнопка, cashout -->
            <div class="bottom-controls">
                <div class="input-row">
                    <div class="input-group">
                        <div class="input-label">
                            <i class="fas fa-coins" style="color:#f7d354;"></i> Ставка
                        </div>
                        <input type="number" id="betAmount" class="input-field" value="10" min="10" step="1">
                    </div>
                    <div class="input-group">
                        <div class="input-label">
                            <i class="fas fa-bomb" style="color:#ff8866;"></i> Мины
                        </div>
                        <input type="number" id="minesCount" class="input-field" value="3" min="1" max="24">
                    </div>
                </div>

                <!-- Кнопка, которая меняется: ИГРАТЬ / ЗАБРАТЬ + информация снизу -->
                <button class="action-button" id="mainActionBtn" disabled>
                    <i class="fas fa-play" id="actionIcon"></i>
                    <span id="actionText">ИГРАТЬ</span>
                </button>

                <!-- Блок cashout (отображается только когда игра активна) -->
                <div id="cashoutInfoBlock" style="display: none;" class="cashout-info">
                    <span class="multiplier-badge" id="currentMultiplier">x1.00</span>
                    <span class="win-preview" id="currentWinPreview">0</span>
                </div>
            </div>

            <div class="message-container" id="messageContainer"></div>
        </div>
    </div>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            if (!starsContainer) return;
            starsContainer.innerHTML = '';
            requestAnimationFrame(() => {
                const isLowEnd = navigator.hardwareConcurrency <= 4 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                const starCount = isLowEnd ? 30 : 50;
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    const size = Math.random();
                    if (size < 0.6) star.className = 'star';
                    else if (size < 0.85) star.className = 'star medium';
                    else star.className = 'star large';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 5 + 's';
                    starsContainer.appendChild(star);
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createStars);
        } else {
            createStars();
        }

        document.addEventListener('visibilitychange', function() {
            const stars = document.getElementById('stars');
            if (stars) {
                if (document.hidden) {
                    stars.style.animation = 'none';
                } else {
                    stars.style.animation = '';
                }
            }
        });

        (function() {
            const tg = window.Telegram?.WebApp;
            if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #03050a; color: white; text-align: center; padding: 20px;">
                        <div>
                            <h2 style="margin-bottom: 20px; color: #ff4444;">❌ Доступ запрещен</h2>
                            <p style="color: #8e98a3; margin-bottom: 20px;">Приложение работает только в Telegram</p>
                        </div>
                    </div>
                `;
                throw new Error('Not in Telegram');
            }

            const userId = tg.initDataUnsafe.user.id;
            const STORAGE_KEY = `yeter_user_${userId}`;

            function loadUserData() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch {
                        return createDefaultData();
                    }
                }
                return createDefaultData();
            }

            function createDefaultData() {
                return {
                    stars: 12500,
                    level: 1,
                    exp: 0,
                    expToNext: 1000,
                    gifts: [],
                    games: {},
                    transactions: [],
                    lastSync: Date.now()
                };
            }

            let userData = loadUserData();

            function saveUserData() {
                userData.lastSync = Date.now();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
                localStorage.setItem('yeter_data_updated', Date.now().toString());
                setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
            }

            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY && e.newValue) {
                    try {
                        const newData = JSON.parse(e.newValue);
                        if (newData.lastSync > userData.lastSync) {
                            userData = newData;
                            updateUIDisplay();
                        }
                    } catch {}
                }
                if (e.key === 'yeter_data_updated') {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            const newData = JSON.parse(saved);
                            if (newData.lastSync > userData.lastSync) {
                                userData = newData;
                                updateUIDisplay();
                            }
                        } catch {}
                    }
                }
            });

            setInterval(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const newData = JSON.parse(saved);
                        if (newData.lastSync > userData.lastSync) {
                            userData = newData;
                            updateUIDisplay();
                        }
                    } catch {}
                }
            }, 2000);

            window.UserStorage = {
                getStars: function() { return userData.stars; },
                getLevel: function() { return userData.level; },
                getExp: function() { return userData.exp; },
                getExpToNext: function() { return userData.expToNext; },
                getUserData: function() { return { ...userData }; },

                updateStars: function(amount, reason) {
                    if (userData.stars + amount < 0) return false;
                    userData.stars += amount;
                    if (!userData.transactions) userData.transactions = [];
                    userData.transactions.push({ amount, reason, time: Date.now(), balance: userData.stars });
                    if (userData.transactions.length > 50) userData.transactions = userData.transactions.slice(-50);
                    saveUserData();
                    return true;
                },

                addExp: function(amount) {
                    userData.exp += amount;
                    while (userData.exp >= userData.expToNext) {
                        userData.exp -= userData.expToNext;
                        userData.level++;
                        userData.expToNext = Math.floor(userData.expToNext * 1.5);
                    }
                    saveUserData();
                },

                forceUpdate: function() {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            const newData = JSON.parse(saved);
                            userData = newData;
                            updateUIDisplay();
                        } catch {}
                    }
                }
            };
        })();

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'м';
            if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'к';
            return num.toString();
        }

        function updateUIDisplay() {
            const data = window.UserStorage.getUserData();
            document.getElementById('balanceDisplay').innerText = formatNumber(data.stars);
            document.getElementById('levelDisplay').innerText = data.level;
            document.getElementById('nextLevelDisplay').innerText = data.level + 1;
            const progress = (data.exp / data.expToNext) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                const firstName = user.first_name || '';
                const lastName = user.last_name || '';
                const fullName = (firstName + ' ' + lastName).trim() || 'Player';
                document.getElementById('playerName').innerText = fullName;
                if (user.photo_url) {
                    document.getElementById('playerAvatar').style.backgroundImage = `url('${user.photo_url}')`;
                    document.getElementById('playerAvatar').style.backgroundColor = 'transparent';
                    document.getElementById('playerAvatar').style.backgroundSize = 'cover';
                    document.getElementById('playerAvatar').innerText = '';
                } else {
                    document.getElementById('playerAvatar').innerText = (firstName.charAt(0) || 'П').toUpperCase();
                }
            }
        }

        document.getElementById('addBalanceBtn').addEventListener('click', function() {
            if (window.UserStorage.updateStars(100, 'Пополнение')) {
                updateUIDisplay();
                localStorage.setItem('yeter_data_updated', Date.now().toString());
                setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
            }
        });

        // ============================================
        // ИГРОВАЯ ЛОГИКА (MINES) — ПОЛНОСТЬЮ ПЕРЕРАБОТАНА
        // ============================================
        const GRID_SIZE = 5;
        const TOTAL_CELLS = 25;

        let gameState = {
            active: false,
            mines: [],
            revealed: [],
            bet: 0,
            minesCount: 3,
            multiplier: 1.0,
            currentWin: 0
        };

        // НОВАЯ ФОРМУЛА МНОЖИТЕЛЯ (как в запросе: blisx.6 / welvura — более агрессивная)
        function calculateMultiplier(revealedCount, minesCount) {
            // имитация "казиношных" коэффициентов: 1 + (0.2 * открыто) + (0.15 * мины)
            return 1 + (revealedCount * 0.2) + (minesCount * 0.15);
        }

        function updateUIAfterReveal() {
            if (!gameState.active) return;

            gameState.multiplier = calculateMultiplier(gameState.revealed.length, gameState.minesCount);
            gameState.currentWin = Math.floor(gameState.bet * gameState.multiplier);

            document.getElementById('currentMultiplier').innerText = `x${gameState.multiplier.toFixed(2)}`;
            document.getElementById('currentWinPreview').innerText = formatNumber(gameState.currentWin);
        }

        function createGrid() {
            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < TOTAL_CELLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                grid.appendChild(cell);
            }
        }

        // валидация полей для активации кнопки "ИГРАТЬ"
        function validatePlayButton() {
            if (gameState.active) return; // если игра активна – не трогаем, там своя логика

            const bet = parseInt(document.getElementById('betAmount').value);
            const mines = parseInt(document.getElementById('minesCount').value);
            const stars = window.UserStorage.getStars();

            const isValid = !isNaN(bet) && bet >= 10 && bet <= stars && !isNaN(mines) && mines >= 1 && mines <= 24;

            const btn = document.getElementById('mainActionBtn');
            btn.disabled = !isValid;
        }

        // НАЧАТЬ НОВУЮ ИГРУ
        function startNewGame() {
            const bet = parseInt(document.getElementById('betAmount').value);
            const minesCount = parseInt(document.getElementById('minesCount').value);
            const stars = window.UserStorage.getStars();

            if (isNaN(bet) || bet < 10) {
                showMessage('Минимальная ставка 10', 'error');
                return;
            }
            if (bet > stars) {
                showMessage('Недостаточно средств', 'error');
                return;
            }
            if (isNaN(minesCount) || minesCount < 1 || minesCount > 24) {
                showMessage('Мины от 1 до 24', 'error');
                return;
            }

            // списываем ставку
            if (!window.UserStorage.updateStars(-bet, 'Ставка')) return;

            // генерируем мины
            const mines = new Set();
            while (mines.size < minesCount) {
                mines.add(Math.floor(Math.random() * TOTAL_CELLS));
            }

            gameState = {
                active: true,
                mines: Array.from(mines),
                revealed: [],
                bet: bet,
                minesCount: minesCount,
                multiplier: 1.0,
                currentWin: bet
            };

            // отчистить поле визуально
            for (let i = 0; i < TOTAL_CELLS; i++) {
                const cell = document.querySelector(`[data-index="${i}"]`);
                if (cell) {
                    cell.className = 'mine-cell';
                    cell.innerHTML = '';
                }
            }

            // меняем кнопку на "ЗАБРАТЬ", показываем инфо-блок
            document.getElementById('actionIcon').className = 'fas fa-hand-holding-usd';
            document.getElementById('actionText').innerText = 'ЗАБРАТЬ';
            document.getElementById('cashoutInfoBlock').style.display = 'flex';
            document.getElementById('mainActionBtn').disabled = false; // активна

            // обновить множитель
            updateUIAfterReveal();
            updateUIDisplay();
        }

        // ЗАБРАТЬ ВЫИГРЫШ
        function cashoutWin() {
            if (!gameState.active) return;

            const win = gameState.currentWin;
            if (window.UserStorage.updateStars(win, 'Выигрыш')) {
                window.UserStorage.addExp(Math.floor(win / 10));
                showMessage(`Вы выиграли ${formatNumber(win)}!`, 'success');
            }

            gameState.active = false;
            resetUItoPlayMode();
            updateUIDisplay();
        }

        // обработка клика по ячейке
        function handleCellClick(index) {
            if (!gameState.active) return;
            if (gameState.revealed.includes(index)) return;

            const cell = document.querySelector(`[data-index="${index}"]`);

            if (gameState.mines.includes(index)) {
                // проигрыш
                cell.classList.add('revealed', 'mine');
                cell.innerHTML = '<i class="fas fa-bomb"></i>';

                showMessage(`МИНА! Проигрыш -${gameState.bet}`, 'error');

                gameState.active = false;

                // показываем все мины
                for (let i = 0; i < TOTAL_CELLS; i++) {
                    if (gameState.mines.includes(i)) {
                        const mineCell = document.querySelector(`[data-index="${i}"]`);
                        mineCell.classList.add('revealed', 'mine');
                        mineCell.innerHTML = '<i class="fas fa-bomb"></i>';
                    }
                }

                resetUItoPlayMode();
            } else {
                // открыта алмаз
                cell.classList.add('revealed', 'gem');
                cell.innerHTML = '<span class="puzzle-icon">🧩</span>';

                gameState.revealed.push(index);
                updateUIAfterReveal();

                // если открыты все не-мины – автоматический кэшаут
                if (gameState.revealed.length === TOTAL_CELLS - gameState.minesCount) {
                    cashoutWin();
                }
            }
        }

        function resetUItoPlayMode() {
            document.getElementById('actionIcon').className = 'fas fa-play';
            document.getElementById('actionText').innerText = 'ИГРАТЬ';
            document.getElementById('cashoutInfoBlock').style.display = 'none';

            validatePlayButton(); // проверка на доступность (ставка, мин)
        }

        function showMessage(text, type = 'success') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            const msg = document.createElement('div');
            msg.className = `game-message ${type}`;
            msg.innerHTML = `<span>${text}</span>`;
            container.appendChild(msg);
            setTimeout(() => {
                if (msg.parentNode) {
                    msg.style.animation = 'messagePop 0.3s reverse';
                    setTimeout(() => msg.remove(), 300);
                }
            }, 3000);
        }

        // главная кнопка (динамическая)
        document.getElementById('mainActionBtn').addEventListener('click', function() {
            if (gameState.active) {
                cashoutWin();        // если игра активна – ЗАБРАТЬ
            } else {
                startNewGame();      // иначе – ИГРАТЬ
            }
        });

        // Валидация при изменении полей
        document.getElementById('betAmount').addEventListener('input', validatePlayButton);
        document.getElementById('minesCount').addEventListener('input', validatePlayButton);
        document.getElementById('betAmount').addEventListener('keydown', (e) => e.key === 'ArrowUp' || e.key === 'ArrowDown' ? e.preventDefault() : null);
        document.getElementById('minesCount').addEventListener('keydown', (e) => e.key === 'ArrowUp' || e.key === 'ArrowDown' ? e.preventDefault() : null);

        window.onload = function() {
            updateUIDisplay();
            createGrid();
            validatePlayButton();   // начальное состояние кнопки
            resetUItoPlayMode();    // убедимся что режим "ИГРАТЬ"
            setTimeout(() => window.UserStorage.forceUpdate(), 500);
        };
    </script>
</body>
</html>
