        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 15px 60px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.2px 1.2px at 72px 430px, rgba(255,245,200,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 250px 120px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1.8px 1.8px at 120px 550px, rgba(210,230,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.3px 1.3px at 380px 200px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 780px, rgba(200,220,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1.6px 1.6px at 310px 640px, rgba(255,255,240,0.8), rgba(0,0,0,0)),
                radial-gradient(1.1px 1.1px at 190px 890px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 420px 350px, rgba(180,200,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.4px 1.4px at 80px 920px, rgba(255,255,255,0.8), rgba(0,0,0,0));
            background-size: 500px 1000px;
            background-repeat: repeat;
            opacity: 0.6;
            z-index: -1;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            position: relative;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        .shop-profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 7, 12, 0.5);
            margin: 10px 20px 20px;
            padding: 10px 16px;
            border-radius: 38px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(4px);
            width: auto;
            gap: 8px;
        }

        .shop-profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .shop-avatar-small {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #1e1a2a, #12101a);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #b87aff;
            border: 2px solid #9b4dff;
            flex-shrink: 0;
        }

        .shop-nick-level {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .shop-nick {
            font-size: 16px;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shop-level-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-level-badge {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: white;
            box-shadow: 0 3px 0 #2d0b4e;
            flex-shrink: 0;
        }

        .shop-progress-wrap {
            width: 60px;
            height: 6px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .shop-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            width: 0%;
        }

        .shop-next-level {
            background: rgba(42, 30, 58, 0.9);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: #b87aff;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .shop-balance-right {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 14, 22, 0.8);
            padding: 5px 12px;
            border-radius: 40px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            flex-shrink: 0;
        }

        .shop-balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 900;
            font-size: 16px;
            color: white;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 16px;
            line-height: 1;
            color: #ffd700;
            text-shadow: 0 0 6px #ffaa00;
            flex-shrink: 0;
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 20px 20px;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e98a3;
            font-size: 15px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 12px 16px 12px 42px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: white;
            outline: none;
        }

        .search-input::placeholder {
            color: #8e98a3;
            font-weight: 400;
            font-size: 14px;
        }

        .sort-icon-btn {
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 14px;
            gap: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 0 20px 30px;
        }

        .product-card {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 24px;
            padding: 16px 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .product-card:hover {
            transform: scale(1.05);
            border-color: #b87aff;
            box-shadow: 0 0 20px rgba(155, 77, 255, 0.5);
            background: rgba(20, 25, 35, 0.9);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-image {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid rgba(155, 77, 255, 0.3);
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .product-card:hover .product-image {
            border-color: #b87aff;
            box-shadow: 0 0 15px rgba(155, 77, 255, 0.6);
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: white;
            text-align: center;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 4px;
        }

        .price-frame {
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 0 #0f0a18;
            transition: all 0.2s ease;
        }

        .product-card:hover .price-frame {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .product-price {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 15px;
            font-weight: 800;
            color: #ffd700;
        }

        .price-icon {
            font-size: 14px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.5);
            border-radius: 32px;
            padding: 24px;
            width: 300px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(155, 77, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .modal-image {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            display: block;
            border-radius: 30px;
            border: 3px solid rgba(155, 77, 255, 0.5);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 12px;
        }

        .modal-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 24px;
        }

        .modal-price-icon {
            font-size: 24px;
        }

        .modal-buy-btn {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            border-radius: 60px;
            padding: 16px;
            width: 100%;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #2d0b4e;
        }

        .modal-buy-btn:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        .modal-buy-btn:hover {
            background: linear-gradient(145deg, #b87aff, #8b4dff);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: rgba(10, 14, 22, 0.9);
            display: flex;
            justify-content: space-around;
            padding: 10px 6px;
            border-radius: 40px 40px 40px 40px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            margin-bottom: 16px;
            width: calc(100% - 40px);
            left: 20px;
            right: 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8e98a3;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 30px;
            flex: 1;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 20px;
            color: #8e98a3;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: #b87aff;
            background: rgba(106, 13, 173, 0.2);
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item:hover {
            color: #b87aff;
        }

        .nav-item:hover i {
            color: #b87aff;
        }
    </style>
</head>

            { name: "Trapped Heart", price: 129, image: "nft/Trapped Heart.png" }
        ];

        // Состояние сортировки
        let sortState = null;
        let currentSearchTerm = '';

        // Функция отображения товаров
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            
            // Фильтруем по поиску
            let filtered = nftGifts.filter(item => 
                item.name.toLowerCase().includes(currentSearchTerm.toLowerCase())
            );
            
            // Сортируем
            if (sortState === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortState === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            }
            
            // Отрисовываем
            grid.innerHTML = filtered.map(item => `
                <div class="product-card" onclick="openModal('${item.name}', ${item.price}, '${item.image}')">
                    <img src="${item.image}" class="product-image" alt="${item.name}" onerror="this.src='nft/placeholder.png'">
                    <div class="product-name">${item.name}</div>
                    <div class="price-frame">
                        <div class="product-price">
                            <span class="price-icon">🧩</span>
                            ${item.price}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Открытие модального окна
        function openModal(name, price, image) {
            document.getElementById('modalImage').src = image;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalOverlay').style.display = 'flex';
            
            document.getElementById('modalBuyBtn').onclick = function() {
                buyItem(name, price);
            };
        }

        // Функция покупки
        function buyItem(name, price) {
            if (Storage.getStars() >= price) {
                if (confirm(`Купить ${name} за ${price} пазлов?`)) {
                    Storage.updateStars(-price, `Покупка: ${name}`);
                    Storage.addGift({ name: name, price: price });
                    alert('✅ Покупка совершена! Подарок в профиле');
                    document.getElementById('modalOverlay').style.display = 'none';
                    updateUIDisplay();
                }
            } else {
                alert(`❌ Не хватает пазлов! Нужно ${price}`);
            }
        }

        // Хранилище
        const Storage = (function() {
            let _data = null;
            const _key = 'yeter_user_data';
            
            function _init() {
                const saved = localStorage.getItem(_key);
                if (saved) {
                    try {
                        _data = JSON.parse(saved);
                        if (!_validate(_data)) _createNew();
                    } catch { _createNew(); }
                } else { _createNew(); }
                _save();
            }
            
            function _validate(data) {
                return data && typeof data.stars === 'number' && data.stars >= 0 && 
                       typeof data.level === 'number' && data.level >= 1;
            }
            
            function _createNew() {
                _data = {
                    stars: 12500,
                    level: 1,
                    exp: 0,
                    expToNext: 1000,
                    gifts: [],
                    games: {},
                    transactions: []
                };
            }
            
            function _save() { localStorage.setItem(_key, JSON.stringify(_data)); }
            _init();
            
            return {
                getStars: function() { return _data.stars; },
                getGifts: function() { return [..._data.gifts]; },
                
                updateStars: function(amount, reason) {
                    if (_data.stars + amount < 0) return false;
                    _data.stars += amount;
                    _data.transactions.push({
                        amount: amount,
                        reason: reason,
                        time: Date.now(),
                        balance: _data.stars
                    });
                    _save();
                    updateUIDisplay();
                    return true;
                },
                
                addGift: function(gift) {
                    _data.gifts.push(gift);
                    _save();
                },
                
                getUserData: function() { return { ..._data }; }
            };
        })();

        // Обновление интерфейса
        function updateUIDisplay() {
            const data = Storage.getUserData();
            document.getElementById('shopBalanceDisplay').innerText = data.stars.toLocaleString();
            document.getElementById('shopLevelNumber').innerText = data.level;
            document.getElementById('shopNextLevel').innerText = data.level + 1;
            const progress = (data.exp / data.expToNext) * 100;
            document.getElementById('shopProgressFill').style.width = progress + '%';
        }

        // Telegram
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                const name = user.username || (user.first_name || '').toLowerCase() || 'player';
                const firstChar = (user.first_name || 'P').charAt(0).toUpperCase();
                document.getElementById('shopAvatar').innerText = firstChar;
                document.getElementById('shopNickname').innerText = '@' + name;
            }
        } else {
            document.getElementById('shopAvatar').innerText = 'P';
            document.getElementById('shopNickname').innerText = '@player';
        }

        updateUIDisplay();

        // Закрытие модального окна
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modalOverlay').style.display = 'none';
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').style.display = 'none';
            }
        });

        // Сортировка
        document.getElementById('sortBtn').addEventListener('click', () => {
            if (sortState === null) sortState = 'desc';
            else if (sortState === 'desc') sortState = 'asc';
            else sortState = null;
            renderProducts();
        });

        // Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearchTerm = e.target.value;
            renderProducts();
        });

        // Первая отрисовка
        renderProducts();
    </script>
