<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 1px;
            height: 1px;
            opacity: 0.5;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            position: relative;
            padding-bottom: 90px;
            min-height: 100vh;
            z-index: 1;
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 22px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            max-width: 280px;
            pointer-events: none;
            text-align: center;
            line-height: 1.4;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(145deg, #00c853, #009624);
            color: white;
            box-shadow: 0 4px 0 #00691e;
        }

        .notification.error {
            background: #ff4444;
            color: white;
            box-shadow: 0 4px 0 #8b0000;
            padding: 10px 16px;
            font-size: 13px;
        }

        /* ШАПКА ПРОФИЛЯ - БЕЗ РАМКИ */
        .shop-profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 20px 20px;
            padding: 8px 16px;
            width: auto;
            gap: 8px;
            background: transparent; /* УБРАЛ РАМКУ */
            border: none; /* УБРАЛ РАМКУ */
        }

        .shop-profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .shop-avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }

        .shop-nick-level {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .shop-nick {
            font-size: 16px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* УРОВЕНЬ - КРУГЛЫЙ (НЕ ОВАЛ) */
        .shop-level-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-level-badge {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 28px;
            height: 28px;
            border-radius: 50%; /* КРУГЛЫЙ */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shop-level-badge span {
            font-size: 14px;
            font-weight: 800;
            color: white;
        }

        .shop-progress-wrap {
            width: 60px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .shop-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            width: 0%;
        }

        .shop-next-level {
            width: 28px;
            height: 28px;
            border-radius: 50%; /* КРУГЛЫЙ */
            background: rgba(42, 30, 58, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }

        .shop-next-level span {
            font-size: 14px;
            font-weight: 800;
            color: #b87aff;
        }

        /* БАЛАНС - БЕЗ РАМКИ */
        .shop-balance-right {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent; /* УБРАЛ РАМКУ */
            padding: 0;
            border: none; /* УБРАЛ РАМКУ */
            flex-shrink: 0;
        }

        .shop-balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 16px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }

        .add-balance-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.7;
            pointer-events: none; /* Не нажимается */
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 20px 20px;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e98a3;
            font-size: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 10px 16px 10px 40px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: white;
            outline: none;
        }

        .search-input::placeholder {
            color: #8e98a3;
            font-weight: 400;
            font-size: 13px;
        }

        .sort-icon-btn {
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 13px;
            gap: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .loader-container {
            grid-column: 1/3;
            text-align: center;
            padding: 40px;
            color: #b87aff;
            font-size: 16px;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(138, 43, 226, 0.2);
            border-top: 3px solid #b87aff;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 20px 30px;
        }

        .product-card {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 22px;
            padding: 14px 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .product-card:hover {
            transform: scale(1.03);
            border-color: #b87aff;
            box-shadow: 0 0 15px rgba(155, 77, 255, 0.4);
            background: rgba(20, 25, 35, 0.9);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-image {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .product-image[alt="Eternal Candle"] {
            object-fit: contain;
            transform: scale(0.9);
        }

        .product-image[alt="Spy Agaric"] {
            object-fit: contain;
            transform: scale(0.85);
        }

        .product-image[alt="Mini Oscar"] {
            object-fit: contain;
            transform: scale(0.9) translateY(2px);
        }

        .product-image[alt="Kissed Frog"] {
            object-fit: contain;
            transform: scale(1) translateX(3px);
        }

        .product-name {
            font-size: 13px;
            font-weight: 600;
            color: white;
            text-align: center;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 2px;
        }

        .price-frame {
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 1px solid rgba(155, 77, 255, 0.3);
            border-radius: 30px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 0 #0f0a18;
            transition: all 0.2s ease;
        }

        .product-card:hover .price-frame {
            border-color: #b87aff;
            box-shadow: 0 0 8px rgba(155, 77, 255, 0.3);
        }

        .product-price {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 15px;
            font-weight: 800;
            color: #b87aff;
        }

        .price-icon {
            font-size: 13px;
            color: #b87aff;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.5);
            border-radius: 32px;
            padding: 22px;
            width: 280px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(155, 77, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .modal-image {
            width: 130px;
            height: 130px;
            margin: 15px auto;
            display: block;
            border-radius: 24px;
            object-fit: cover;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 24px;
            font-weight: 800;
            color: #b87aff;
            margin-bottom: 20px;
        }

        .modal-price-icon {
            font-size: 20px;
            color: #b87aff;
        }

        .modal-buy-btn {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            border-radius: 60px;
            padding: 14px;
            width: 100%;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 6px 0 #2d0b4e;
        }

        .modal-buy-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 10px 4px;
            border-radius: 30px;
            border: 1px solid #2a1e3a;
            margin-bottom: 16px;
            width: calc(100% - 40px);
            left: 20px;
            right: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: 25px;
            flex: 1;
            text-align: center;
            text-decoration: none;
            transition: all 0.1s ease;
            background: transparent;
            border: none;
            outline: none;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.2);
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 18px;
            color: #8e98a3;
            pointer-events: none;
        }

        .nav-item.active {
            color: #b87aff;
            background: rgba(106, 13, 173, 0.3);
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="notification" id="notification"></div>

    <div class="app">
        <!-- ШАПКА - БЕЗ РАМКИ -->
        <div class="shop-profile-header">
            <div class="shop-profile-left">
                <div class="shop-avatar-small" id="shopAvatar">?</div>
                <div class="shop-nick-level">
                    <div class="shop-nick" id="shopNickname">Загрузка...</div>
                    <div class="shop-level-row">
                        <div class="shop-level-badge"><span id="shopLevelNumber">1</span></div>
                        <div class="shop-progress-wrap">
                            <div class="shop-progress-fill" id="shopProgressFill" style="width: 0%;"></div>
                        </div>
                        <div class="shop-next-level"><span id="shopNextLevel">2</span></div>
                    </div>
                </div>
            </div>
            <!-- БАЛАНС - БЕЗ РАМКИ -->
            <div class="shop-balance-right">
                <div class="shop-balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="shopBalanceDisplay">12.5k</span>
                </div>
                <div class="add-balance-btn" id="addBalanceBtn">+</div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию">
            </div>
            <div class="sort-icon-btn" id="sortBtn">
                <i class="fas fa-chevron-up"></i>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <div class="loader-container">
                <div class="loader-spinner"></div>
                <div>Загрузка магазина...</div>
            </div>
        </div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content" id="modalContent">
                <div class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </div>
                <img src="" alt="" class="modal-image" id="modalImage">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-price">
                    <span class="modal-price-icon">🧩</span>
                    <span id="modalPrice"></span>
                </div>
                <button class="modal-buy-btn" id="modalBuyBtn">Купить</button>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item" onclick="window.location.href='index.html'; return false;"><i class="fas fa-gamepad"></i><span>ИГРЫ</span></a>
            <a href="shop.html" class="nav-item active" onclick="window.location.href='shop.html'; return false;"><i class="fas fa-store"></i><span>МАГАЗИН</span></a>
            <a href="leaders.html" class="nav-item" onclick="window.location.href='leaders.html'; return false;"><i class="fas fa-trophy"></i><span>ЛИДЕРЫ</span></a>
            <a href="profle.html" class="nav-item" onclick="window.location.href='profle.html'; return false;"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
        </div>
    </div>

    <script>
        // ЗАЩИТА И ГЛОБАЛЬНОЕ ХРАНИЛИЩЕ
        (function() {
            // Проверка на запуск в Telegram WebApp
            const tg = window.Telegram?.WebApp;
            
            if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
                console.error('Доступ запрещен');
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #03050a; color: white; text-align: center; padding: 20px;">
                        <div>
                            <h2 style="margin-bottom: 20px; color: #ff4444;">❌ Доступ запрещен</h2>
                            <p style="color: #8e98a3; margin-bottom: 20px;">Приложение работает только в Telegram</p>
                        </div>
                    </div>
                `;
                throw new Error('Not in Telegram');
            }

            // Получаем ID пользователя Telegram
            const userId = tg.initDataUnsafe.user.id;
            
            // Глобальное хранилище для одного пользователя на всех устройствах
            window.UserStorage = (function() {
                const STORAGE_KEY = `yeter_user_${userId}`;
                
                function loadUserData() {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            return JSON.parse(saved);
                        } catch {
                            return createDefaultData();
                        }
                    }
                    return createDefaultData();
                }
                
                function createDefaultData() {
                    return {
                        stars: 12500,
                        level: 1,
                        exp: 0,
                        expToNext: 1000,
                        gifts: [],
                        games: {},
                        transactions: [],
                        lastSync: Date.now()
                    };
                }
                
                let userData = loadUserData();
                
                function saveUserData() {
                    userData.lastSync = Date.now();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
                }
                
                // Синхронизация между вкладками
                window.addEventListener('storage', (e) => {
                    if (e.key === STORAGE_KEY && e.newValue) {
                        try {
                            const newData = JSON.parse(e.newValue);
                            if (newData.lastSync > userData.lastSync) {
                                userData = newData;
                                updateUIDisplay();
                            }
                        } catch {}
                    }
                });
                
                return {
                    getStars: function() { return userData.stars; },
                    getLevel: function() { return userData.level; },
                    getExp: function() { return userData.exp; },
                    getExpToNext: function() { return userData.expToNext; },
                    getUserData: function() { return { ...userData }; },
                    
                    updateStars: function(amount, reason) {
                        if (userData.stars + amount < 0) return false;
                        userData.stars += amount;
                        if (!userData.transactions) userData.transactions = [];
                        userData.transactions.push({ 
                            amount, 
                            reason, 
                            time: Date.now(), 
                            balance: userData.stars
                        });
                        if (userData.transactions.length > 50) userData.transactions = userData.transactions.slice(-50);
                        saveUserData();
                        return true;
                    },
                    
                    addExp: function(amount) {
                        userData.exp += amount;
                        while (userData.exp >= userData.expToNext) {
                            userData.exp -= userData.expToNext;
                            userData.level++;
                            userData.expToNext = Math.floor(userData.expToNext * 1.5);
                        }
                        saveUserData();
                    }
                };
            })();
        })();

        // Звезды
        function createStars() {
            const starsContainer = document.getElementById('stars');
            starsContainer.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // Форматирование чисел
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'м';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'к';
            }
            return num.toString();
        }

        // Обновление UI
        function updateUIDisplay() {
            const data = window.UserStorage.getUserData();
            document.getElementById('shopBalanceDisplay').innerText = formatNumber(data.stars);
            document.getElementById('shopLevelNumber').innerText = data.level;
            document.getElementById('shopNextLevel').innerText = data.level + 1;
            const progress = (data.exp / data.expToNext) * 100;
            document.getElementById('shopProgressFill').style.width = progress + '%';
        }

        // Уведомления
        const Notification = {
            show: function(message, type) {
                const notif = document.getElementById('notification');
                notif.className = 'notification ' + type;
                notif.innerText = message;
                notif.classList.add('show');
                setTimeout(() => notif.classList.remove('show'), 3000);
            },
            success: function(message) { this.show(message, 'success'); },
            error: function(message) { this.show(message, 'error'); }
        };

        // Защита от накрутки
        const Security = (function() {
            let _requestTimestamps = [];

        // Состояние
        let currentSearchTerm = '';
        let currentSort = 'random';

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            
            let filtered = [...nftGifts];
            
            if (currentSearchTerm) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(currentSearchTerm.toLowerCase())
                );
            }
            
            if (currentSort === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            } else {
                filtered = shuffleArray(filtered);
            }
            
            grid.innerHTML = filtered.map(item => `
                <div class="product-card" onclick="openModal('${item.name}', ${item.price}, '${item.image}')">
                    <img src="${item.image}" 
                         class="product-image" 
                         alt="${item.name}"
                         loading="eager"
                         onerror="this.src='nft/placeholder.png'">
                    <div class="product-name">${item.name}</div>
                    <div class="price-frame">
                        <div class="product-price">
                            <span class="price-icon">🧩</span>
                            ${formatNumber(item.price)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(name, price, image) {
            document.getElementById('modalImage').src = image;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = formatNumber(price);
            document.getElementById('modalOverlay').classList.add('active');
            
            document.getElementById('modalBuyBtn').onclick = function() {
                buyItem(name, price, image);
            };
        }

        function buyItem(name, price, image) {
            if (!Security.validateRequest()) {
                Notification.error('Слишком много запросов');
                return;
            }

            if (window.UserStorage.getStars() >= price) {
                if (window.UserStorage.updateStars(-price, `Покупка: ${name}`)) {
                    const inventory = JSON.parse(localStorage.getItem('yeter_inventory') || '[]');
                    inventory.push({
                        name: name,
                        price: price,
                        image: image,
                        id: Date.now() + Math.random(),
                        withdrawEnd: Date.now() + 30 * 60 * 1000
                    });
                    localStorage.setItem('yeter_inventory', JSON.stringify(inventory));
                    
                    // Отправляем событие в index.html для LIVE ленты
                    localStorage.setItem('new_purchase', JSON.stringify({
                        name: name,
                        price: price,
                        image: image
                    }));
                    setTimeout(() => localStorage.removeItem('new_purchase'), 100);
                    
                    document.getElementById('modalOverlay').classList.remove('active');
                    Notification.success('Подарок успешно куплен');
                    
                    updateUIDisplay();
                }
            } else {
                document.getElementById('modalOverlay').classList.remove('active');
                Notification.error('Недостаточно средств');
            }
        }
