            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;

                radial-gradient(1.5px 1.5px at 15px 60px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.2px 1.2px at 72px 430px, rgba(255,245,200,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 250px 120px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1.8px 1.8px at 120px 550px, rgba(210,230,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.3px 1.3px at 380px 200px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 780px, rgba(200,220,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1.6px 1.6px at 310px 640px, rgba(255,255,240,0.8), rgba(0,0,0,0)),
                radial-gradient(1.1px 1.1px at 190px 890px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 420px 350px, rgba(180,200,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.4px 1.4px at 80px 920px, rgba(255,255,255,0.8), rgba(0,0,0,0));
            background-size: 500px 1000px;
            background-repeat: repeat;
            opacity: 0.6;
            z-index: -1;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            position: relative;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        /* Плашка профиля сверху */
        .shop-profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 7, 12, 0.5);
            margin: 10px 20px 20px;
            padding: 8px 16px;
            border-radius: 38px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(4px);
            width: auto;
            gap: 8px;
        }

        .shop-profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .shop-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }

        .shop-nick-level {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .shop-nick {
            font-size: 15px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shop-level-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .shop-level-badge {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 24px;
            height: 24px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: white;
            box-shadow: 0 2px 0 #2d0b4e;
            flex-shrink: 0;
        }

        .shop-progress-wrap {
            width: 55px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .shop-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            width: 0%;
        }

        .shop-next-level {
            background: rgba(42, 30, 58, 0.9);
            width: 24px;
            height: 24px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #b87aff;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .shop-balance-right {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 14, 22, 0.8);
            padding: 4px 10px;
            border-radius: 40px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            flex-shrink: 0;
        }

        .shop-balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 800;
            font-size: 16px;
            color: white;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 15px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }

        .add-balance-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 2px;
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 20px 20px;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e98a3;
            font-size: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 10px 16px 10px 40px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: white;
            outline: none;
        }

            color: #8e98a3;
            font-weight: 400;
            font-size: 13px;

            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 40px;
            height: 40px;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 13px;
            gap: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 20px 30px;
        }

        .product-card {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 22px;
            padding: 14px 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .product-card:hover {
            transform: scale(1.03);
            border-color: #b87aff;
            box-shadow: 0 0 15px rgba(155, 77, 255, 0.4);
            background: rgba(20, 25, 35, 0.9);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-image {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .product-card:hover .product-image {
            filter: brightness(1.1);
        }

            object-fit: contain;
            transform: scale(1.1) translateX(-2px);
        }

        .product-name {
            font-size: 13px;
            font-weight: 600;
            color: white;
            text-align: center;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 2px;
        }

            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 1px solid rgba(155, 77, 255, 0.3);
            border-radius: 30px;

            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 0 #0f0a18;

            box-shadow: 0 0 8px rgba(155, 77, 255, 0.3);
        }

            font-size: 15px;
            font-weight: 800;
            color: #b87aff;
        }

        .price-icon {
            font-size: 13px;
            color: #b87aff;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.5);
            border-radius: 32px;
            padding: 22px;
            width: 280px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(155, 77, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;

            height: 130px;

            display: block;
            border-radius: 24px;
            border: 2px solid rgba(155, 77, 255, 0.5);
            object-fit: cover;

            transform: scale(1.2) translateX(-3px);

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 24px;
            font-weight: 800;
            color: #b87aff;
            margin-bottom: 20px;
        }

        .modal-price-icon {
            font-size: 20px;
            color: #b87aff;
        }

        .modal-buy-btn {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            border-radius: 60px;
            padding: 14px;
            width: 100%;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;

        }

        .modal-buy-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;

            padding: 8px 6px;

            width: calc(100% - 40px);

            display: flex;

            align-items: center;

            color: #8e98a3;
        }

            color: #b87aff;
            background: rgba(106, 13, 173, 0.2);
        }

            color: #b87aff;
        }
    </style>

        // ========== ЖЕСТКАЯ ЗАЩИТА ==========
        (function() {
            const protectedMethods = ['getItem', 'setItem', 'removeItem'];
            protectedMethods.forEach(method => {
                const original = localStorage[method];
                localStorage[method] = function() {
                    if (new Error().stack.includes('debugger')) {
                        throw new Error('Access denied');
                    }
                    return original.apply(this, arguments);
                };
            });
            
            setInterval(function() {
                const before = new Date();
                debugger;
                const after = new Date();
                if (after - before > 100) {
                    window.location.reload();
                }
            }, 1000);
        })();

        // ========== ЗАЩИТА ОТ НАКРУТКИ ==========
        const Security = (function() {
            let _requestCount = 0;
            let _lastReset = Date.now();
            let _validTokens = new Set();
            
            function generateToken() {
                return 'token_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            }
            
            function checkRateLimit() {
                const now = Date.now();
                if (now - _lastReset > 60000) {
                    _requestCount = 0;
                    _lastReset = now;
                }
                _requestCount++;
                return _requestCount <= 30;
            }
            
            return {
                validateRequest: function() {
                    return checkRateLimit();
                },
                createToken: function() {
                    const token = generateToken();
                    _validTokens.add(token);
                    setTimeout(() => _validTokens.delete(token), 30000);
                    return token;
                },
                verifyToken: function(token) {
                    return _validTokens.has(token);
                }
            };
        })();

            { name: "Xmas Stocking", price: 79, image: "nft/Xmas Stocking.png" },
            { name: "Trapped Heart", price: 129, image: "nft/Trapped Heart.png" }
        ];

        // Состояние
        let currentSearchTerm = '';
        let currentSort = 'random';

        // Функция перемешивания массива (рандомный порядок)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Функция отображения товаров
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            
            // Копируем массив
            let filtered = [...nftGifts];
            
            // Фильтруем по поиску
            if (currentSearchTerm) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(currentSearchTerm.toLowerCase())
                );
            }
            
            // Сортировка
            if (currentSort === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            } else {
                // Рандомный порядок
                filtered = shuffleArray(filtered);
            }
            
            grid.innerHTML = filtered.map(item => `
                <div class="product-card" onclick="openModal('${item.name}', ${item.price}, '${item.image}')">
                    <img src="${item.image}" class="product-image" alt="${item.name}" onerror="this.src='nft/placeholder.png'">
                    <div class="product-name">${item.name}</div>
                    <div class="price-frame">
                        <div class="product-price">
                            <span class="price-icon">🧩</span>
                            ${item.price}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Открытие модального окна
        function openModal(name, price, image) {
            document.getElementById('modalImage').src = image;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalOverlay').style.display = 'flex';
            
            document.getElementById('modalBuyBtn').onclick = function() {
                buyItem(name, price, image);
            };
        }

        // Функция покупки
        function buyItem(name, price, image) {
            if (!Security.validateRequest()) {
                alert('⚠️ Слишком много запросов. Подождите минуту.');
                return;
            }

            if (Storage.getStars() >= price) {
                const token = Security.createToken();
                
                if (Storage.updateStars(-price, `Покупка: ${name}`, token)) {
                    const inventory = JSON.parse(localStorage.getItem('yeter_inventory') || '[]');
                    inventory.push({
                        name: name,
                        price: price,
                        image: image,
                        id: Date.now() + Math.random(),
                        withdrawEnd: Date.now() + 30 * 60 * 1000 // 30 минут таймер
                    });
                    localStorage.setItem('yeter_inventory', JSON.stringify(inventory));
                    
                    alert('✅ Покупка совершена! Подарок в профиле');
                    document.getElementById('modalOverlay').style.display = 'none';
                    updateUIDisplay();
                }
            } else {
                alert(`❌ Не хватает пазлов! Нужно ${price}`);
            }
        }

        // Хранилище
        const Storage = (function() {
            let _data = null;
            const _key = 'yeter_user_data';
            const _backupKey = 'yeter_user_data_backup';
            
            function _init() {
                const saved = localStorage.getItem(_key);
                if (saved) {
                    try {
                        _data = JSON.parse(saved);
                        if (!_validate(_data)) {
                            _restoreFromBackup();
                        }
                    } catch { 
                        _restoreFromBackup();
                    }
                } else {
                    _createNew();
                }
                _save();
                _createBackup();
            }
            
            function _validate(data) {
                if (!data || typeof data !== 'object') return false;
                if (typeof data.stars !== 'number' || data.stars < 0 || data.stars > 1000000) return false;
                if (typeof data.level !== 'number' || data.level < 1 || data.level > 100) return false;
                if (typeof data.exp !== 'number' || data.exp < 0) return false;
                if (typeof data.expToNext !== 'number' || data.expToNext < 100) return false;
                if (!Array.isArray(data.gifts)) return false;
                if (!data.games || typeof data.games !== 'object') return false;
                if (!Array.isArray(data.transactions)) return false;
                
                if (data.transactions.length > 0) {
                    const lastTx = data.transactions[data.transactions.length - 1];
                    if (lastTx && lastTx.amount > 10000 && lastTx.amount > data.stars) {
                        return false;
                    }
                }
                
                return true;
            }
            
            function _createNew() {
                _data = {
                    stars: 12500,
                    level: 1,
                    exp: 0,
                    expToNext: 1000,
                    gifts: [],
                    games: {},
                    transactions: []
                };
            }
            
            function _save() {
                localStorage.setItem(_key, JSON.stringify(_data));
            }
            
            function _createBackup() {
                localStorage.setItem(_backupKey, JSON.stringify(_data));
            }
            
            function _restoreFromBackup() {
                const backup = localStorage.getItem(_backupKey);
                if (backup) {
                    try {
                        _data = JSON.parse(backup);
                    } catch {
                        _createNew();
                    }
                } else {
                    _createNew();
                }
            }
            
            function _logTransaction(amount, reason, token, success) {
                if (!_data.transactions) _data.transactions = [];
                _data.transactions.push({
                    amount: amount,
                    reason: reason,
                    time: Date.now(),
                    balance: _data.stars,
                    success: success,
                    token: token
                });
                
                if (_data.transactions.length > 100) {
                    _data.transactions = _data.transactions.slice(-100);
                }
            }
            
            _init();
            
            return {
                getStars: function() { return _data.stars; },
                getGifts: function() { return [..._data.gifts]; },
                
                updateStars: function(amount, reason, token) {
                    if (!Security.validateRequest()) return false;
                    
                    if (_data.stars + amount < 0) return false;
                    
                    if (amount < -10000 && !Security.verifyToken(token)) {
                        _logTransaction(amount, reason, token, false);
                        return false;
                    }
                    
                    _data.stars += amount;
                    _logTransaction(amount, reason, token, true);
                    
                    _save();
                    _createBackup();
                    return true;
                },
                
                addGift: function(gift) {
                    _data.gifts.push(gift);
                    _save();
                    _createBackup();
                },
                
                getUserData: function() { return { ..._data }; }
            };
        })();

        // Обновление интерфейса
        function updateUIDisplay() {
            const data = Storage.getUserData();
            document.getElementById('shopBalanceDisplay').innerText = data.stars;
            document.getElementById('shopLevelNumber').innerText = data.level;
            document.getElementById('shopNextLevel').innerText = data.level + 1;
            const progress = (data.exp / data.expToNext) * 100;
            document.getElementById('shopProgressFill').style.width = progress + '%';
        }

        // Кнопка пополнения баланса
        document.getElementById('addBalanceBtn').addEventListener('click', () => {
            const token = Security.createToken();
            if (Storage.updateStars(1000, 'Пополнение', token)) {
                updateUIDisplay();
            }
        });

        // Telegram
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                const firstName = user.first_name || '';
                const lastName = user.last_name || '';
                const fullName = (firstName + ' ' + lastName).trim() || 'Player';
                
                document.getElementById('shopNickname').innerText = fullName;
                
                if (user.photo_url) {
                    document.getElementById('shopAvatar').style.backgroundImage = `url('${user.photo_url}')`;
                    document.getElementById('shopAvatar').style.backgroundColor = 'transparent';
                    document.getElementById('shopAvatar').style.backgroundSize = 'cover';
                    document.getElementById('shopAvatar').innerText = '';
                } else {
                    document.getElementById('shopAvatar').innerText = (firstName.charAt(0) || 'П').toUpperCase();
                }
            }
        }

        updateUIDisplay();

        // Закрытие модального окна
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modalOverlay').style.display = 'none';
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').style.display = 'none';
            }
        });

        // Сортировка
        document.getElementById('sortBtn').addEventListener('click', () => {
            if (currentSort === 'random') {
                currentSort = 'desc';
            } else if (currentSort === 'desc') {
                currentSort = 'asc';
            } else {
                currentSort = 'random';
            }
            renderProducts();
        });

        // Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearchTerm = e.target.value;
            renderProducts();
        });

        // Первая отрисовка (с рандомным порядком)
        renderProducts();
    </script>
