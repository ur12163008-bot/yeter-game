<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · P2P МАРКЕТ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 1px;
            height: 1px;
            opacity: 0.5;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            position: relative;
            padding-bottom: 90px;
            min-height: 100vh;
            z-index: 1;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 22px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            max-width: 280px;
            pointer-events: none;
            text-align: center;
            line-height: 1.4;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(145deg, #00c853, #009624);
            color: white;
            box-shadow: 0 4px 0 #00691e;
        }

        .notification.error {
            background: #ff4444;
            color: white;
            box-shadow: 0 4px 0 #8b0000;
            padding: 10px 16px;
            font-size: 13px;
        }

        .shop-profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 20px 20px;
            padding: 8px 16px;
            width: auto;
            gap: 8px;
            background: transparent;
            border: none;
        }

        .shop-profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .shop-avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }

        .shop-nick-level {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .shop-nick {
            font-size: 16px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shop-level-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shop-level-badge {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shop-level-badge span {
            font-size: 14px;
            font-weight: 800;
            color: white;
        }

        .shop-progress-wrap {
            width: 60px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .shop-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            width: 0%;
        }

        .shop-next-level {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(42, 30, 58, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }

        .shop-next-level span {
            font-size: 14px;
            font-weight: 800;
            color: #b87aff;
        }

        .shop-balance-right {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            padding: 0;
            border: none;
            flex-shrink: 0;
        }

        .shop-balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 16px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }

        .add-balance-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.7;
            pointer-events: none;
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 20px 20px;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e98a3;
            font-size: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 10px 16px 10px 40px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: white;
            outline: none;
        }

        .search-input::placeholder {
            color: #8e98a3;
            font-weight: 400;
            font-size: 13px;
        }

        .sort-icon-btn {
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 13px;
            gap: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            margin: 0 20px 15px;
            gap: 10px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: rgba(10, 14, 22, 0.8);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 40px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: #8e98a3;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            border-color: #b87aff;
            color: white;
            box-shadow: 0 4px 0 #2d0b4e;
        }

        .loader-container {
            grid-column: 1/3;
            text-align: center;
            padding: 40px;
            color: #b87aff;
            font-size: 16px;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(138, 43, 226, 0.2);
            border-top: 3px solid #b87aff;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 20px 30px;
        }

        .product-card {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 22px;
            padding: 14px 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        .product-card.seller-item::before {
            content: '👤';
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 12px;
            background: rgba(106, 13, 173, 0.5);
            border-radius: 12px;
            padding: 2px 6px;
            border: 1px solid #b87aff;
            color: white;
            z-index: 2;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .product-card:hover {
            transform: scale(1.03);
            border-color: #b87aff;
            box-shadow: 0 0 15px rgba(155, 77, 255, 0.4);
            background: rgba(20, 25, 35, 0.9);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-image {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            object-fit: contain;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            background: rgba(0,0,0,0.2);
        }

        .product-name {
            font-size: 13px;
            font-weight: 600;
            color: white;
            text-align: center;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 2px;
        }

        .price-frame {
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 1px solid rgba(155, 77, 255, 0.3);
            border-radius: 30px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 0 #0f0a18;
            transition: all 0.2s ease;
        }

        .product-card:hover .price-frame {
            border-color: #b87aff;
            box-shadow: 0 0 8px rgba(155, 77, 255, 0.3);
        }

        .product-price {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 15px;
            font-weight: 800;
            color: #b87aff;
        }

        .price-icon {
            font-size: 13px;
            color: #b87aff;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 20px 30px;
        }

        .inventory-item {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 22px;
            padding: 14px 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s ease;
        }

        .inventory-item img {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            object-fit: contain;
            margin-bottom: 6px;
            background: rgba(0,0,0,0.2);
        }

        .inventory-item .name {
            font-size: 12px;
            font-weight: 600;
            color: white;
            text-align: center;
            margin: 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .sell-btn {
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 1px solid rgba(155, 77, 255, 0.3);
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #b87aff;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.1s;
        }

        .sell-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f0a18;
        }

        .sell-btn:hover {
            border-color: #b87aff;
            background: #2a1e3a;
        }

        .sell-modal {
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.5);
            border-radius: 32px;
            padding: 22px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            width: 280px;
            display: none;
        }

        .sell-modal.active {
            display: block;
        }

        .sell-modal input {
            width: 100%;
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 12px 16px;
            font-size: 14px;
            color: white;
            margin: 15px 0;
            outline: none;
        }

        .sell-modal-buttons {
            display: flex;
            gap: 10px;
        }

        .sell-modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .sell-modal-btn.cancel {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .sell-modal-btn.confirm {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            color: white;
            box-shadow: 0 4px 0 #2d0b4e;
        }

        .sell-modal-btn.confirm:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.5);
            border-radius: 32px;
            padding: 22px;
            width: 280px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(155, 77, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .modal-image {
            width: 130px;
            height: 130px;
            margin: 15px auto;
            display: block;
            border-radius: 24px;
            object-fit: contain;
            background: rgba(0,0,0,0.2);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 24px;
            font-weight: 800;
            color: #b87aff;
            margin-bottom: 10px;
        }

        .modal-price-icon {
            font-size: 20px;
            color: #b87aff;
        }

        .modal-seller {
            text-align: center;
            color: #8e98a3;
            font-size: 13px;
            margin-bottom: 15px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
        }

        .modal-buy-btn {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            border-radius: 60px;
            padding: 14px;
            width: 100%;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 6px 0 #2d0b4e;
        }

        .modal-buy-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 10px 4px;
            border-radius: 30px;
            border: 1px solid #2a1e3a;
            margin-bottom: 16px;
            width: calc(100% - 40px);
            left: 20px;
            right: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: 25px;
            flex: 1;
            text-align: center;
            text-decoration: none;
            transition: all 0.1s ease;
            background: transparent;
            border: none;
            outline: none;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.2);
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 18px;
            color: #8e98a3;
            pointer-events: none;
        }

        .nav-item.active {
            color: #b87aff;
            background: rgba(106, 13, 173, 0.3);
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="notification" id="notification"></div>

    <div class="app">
        <div class="shop-profile-header">
            <div class="shop-profile-left">
                <div class="shop-avatar-small" id="shopAvatar">?</div>
                <div class="shop-nick-level">
                    <div class="shop-nick" id="shopNickname">Загрузка...</div>
                    <div class="shop-level-row">
                        <div class="shop-level-badge"><span id="shopLevelNumber">1</span></div>
                        <div class="shop-progress-wrap">
                            <div class="shop-progress-fill" id="shopProgressFill" style="width: 0%;"></div>
                        </div>
                        <div class="shop-next-level"><span id="shopNextLevel">2</span></div>
                    </div>
                </div>
            </div>
            <div class="shop-balance-right">
                <div class="shop-balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="shopBalanceDisplay">12.5k</span>
                </div>
                <div class="add-balance-btn" id="addBalanceBtn">+</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" id="tabMarket">МАРКЕТ</div>
            <div class="tab" id="tabProfile">ПРОФИЛЬ</div>
        </div>

        <!-- Маркет -->
        <div id="marketSection">
            <div class="search-section">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию">
                </div>
                <div class="sort-icon-btn" id="sortBtn">
                    <i class="fas fa-chevron-up"></i>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>

            <div class="products-grid" id="productsGrid">
                <div class="loader-container">
                    <div class="loader-spinner"></div>
                    <div>Загрузка маркета...</div>
                </div>
            </div>
        </div>

        <!-- Профиль + Инвентарь -->
        <div id="profileSection" style="display: none;">
            <div style="margin: 0 20px 20px; padding: 15px; background: rgba(106, 13, 173, 0.2); border-radius: 30px; border: 1px solid #b87aff; text-align: center;">
                <button id="sellNftBtn" style="background: linear-gradient(145deg, #9b4dff, #6a0dad); border: none; border-radius: 40px; padding: 12px 20px; color: white; font-weight: 700; font-size: 14px; width: 100%; cursor: pointer; box-shadow: 0 4px 0 #2d0b4e;">+ ВЫСТАВИТЬ NFT</button>
            </div>

            <h3 style="margin: 0 20px 15px; color: #b87aff; font-size: 16px;">МОЙ ИНВЕНТАРЬ</h3>
            <div class="inventory-grid" id="inventoryGrid">
                <div class="loader-container">
                    <div class="loader-spinner"></div>
                    <div>Загрузка...</div>
                </div>
            </div>
        </div>

        <!-- Модалка покупки -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content" id="modalContent">
                <div class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </div>
                <img src="" alt="" class="modal-image" id="modalImage">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-seller" id="modalSeller">Продавец: Пользователь</div>
                <div class="modal-price">
                    <span class="modal-price-icon">🧩</span>
                    <span id="modalPrice"></span>
                </div>
                <button class="modal-buy-btn" id="modalBuyBtn">Купить</button>
            </div>
        </div>

        <!-- Модалка выставления NFT -->
        <div class="sell-modal" id="sellModal">
            <h3 style="text-align: center; color: white;">Выставить NFT</h3>
            <select id="sellNftSelect" style="width: 100%; background: rgba(10,14,22,0.9); border: 1px solid rgba(138,43,226,0.4); border-radius: 40px; padding: 12px; color: white; margin: 15px 0;">
                <option value="">Выберите NFT</option>
            </select>
            <input type="number" id="sellPrice" placeholder="Цена в звездах" min="1">
            <div class="sell-modal-buttons">
                <div class="sell-modal-btn cancel" id="sellCancel">Отмена</div>
                <div class="sell-modal-btn confirm" id="sellConfirm">Выставить</div>
            </div>
        </div>

                setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);

                getExpToNext: function() { return userData.expToNext; },
                getUserData: function() { return { ...userData }; },
                
                updateStars: function(amount, reason) {
                    if (userData.stars + amount < 0) return false;
                    userData.stars += amount;
                    if (!userData.transactions) userData.transactions = [];
                    userData.transactions.push({ amount, reason, time: Date.now(), balance: userData.stars });
                    if (userData.transactions.length > 50) userData.transactions = userData.transactions.slice(-50);
                    saveUserData();
                    return true;
                },
                
                addExp: function(amount) {
                    userData.exp += amount;
                    while (userData.exp >= userData.expToNext) {
                        userData.exp -= userData.expToNext;
                        userData.level++;
                        userData.expToNext = Math.floor(userData.expToNext * 1.5);
                    }
                    saveUserData();
                },

                    if (saved) {
                        try {

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderMarket() {
            const grid = document.getElementById('productsGrid');
            
            let filtered = [...marketListings];
            
            if (currentSearchTerm) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(currentSearchTerm.toLowerCase())
                );
            }
            
            if (currentSort === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            } else {
                filtered = shuffleArray(filtered);
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/3; text-align:center; padding:40px; color:#8e98a3;">Нет товаров в маркете</div>';
                return;
            }
            
            grid.innerHTML = filtered.map(item => `

        function buyFromMarket(name, price, image, seller) {
            if (!Security.validateRequest()) {
                Notification.error('Слишком много запросов');
                return;
            }

            // Находим этот товар в маркете
            const listingIndex = marketListings.findIndex(l => l.name === name && l.price === price && l.seller === seller);
            if (listingIndex === -1) {
                Notification.error('Товар уже куплен');
                document.getElementById('modalOverlay').classList.remove('active');
                renderMarket();
                return;
            }

            const listing = marketListings[listingIndex];

            if (window.UserStorage.getStars() >= price) {
                // Комиссия 5%
                const commission = Math.floor(price * 0.05);
                const sellerGets = price - commission;
                
                // Списываем у покупателя
                if (window.UserStorage.updateStars(-price, `Покупка: ${name}`)) {
                    
                    // Добавляем в инвентарь покупателя
                    inventory.push({
                        name: name,
                        price: price,
                        image: image,
                        id: Date.now() + Math.random(),
                        withdrawEnd: Date.now() + 30 * 60 * 1000
                    });
                    localStorage.setItem('yeter_inventory', JSON.stringify(inventory));
                    
                    // Удаляем из маркета
                    marketListings.splice(listingIndex, 1);
                    saveMarket();
                    
                    document.getElementById('modalOverlay').classList.remove('active');
                    Notification.success(`Подарок куплен (комиссия 5%: ${commission}🧩)`);
                    
                    updateUIDisplay();
                    renderMarket();
                    
                    // Если мы на вкладке профиля, обновить инвентарь
                    if (document.getElementById('profileSection').style.display !== 'none') {
                        renderInventory();
                    }
                    
                    localStorage.setItem('yeter_data_updated', Date.now().toString());
                    setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
                }
            } else {
                document.getElementById('modalOverlay').classList.remove('active');
                Notification.error('Недостаточно средств');
            }
        }

                    document.getElementById('shopAvatar').style.backgroundImage = `url('${user.photo_url}')`;
                    document.getElementById('shopAvatar').style.backgroundColor = 'transparent';
                    document.getElementById('shopAvatar').style.backgroundSize = 'cover';
                    document.getElementById('shopAvatar').innerText = '';
                } else {
                    document.getElementById('shopAvatar').innerText = (firstName.charAt(0) || 'П').toUpperCase();
                }
            }
        }

        // ============================================
        // НАВИГАЦИЯ
        // ============================================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href) window.location.href = href;
            });
        });

        const currentPage = window.location.pathname.split('/').pop() || 'shop.html';
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('active');
            if (item.getAttribute('href') === currentPage) item.classList.add('active');
        });

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        updateUIDisplay();
        
        // Загружаем инвентарь
        inventory = JSON.parse(localStorage.getItem('yeter_inventory') || '[]');
        
        // Добавляем тестовые NFT в инвентарь если пусто
        if (inventory.length === 0) {
            inventory = [
                { name: "Eternal Candle", price: 75, image: "nft/Eternal Candle.png", id: Date.now() + 1 },
                { name: "Kissed Frog", price: 79, image: "nft/Kissed Frog.png", id: Date.now() + 2 },
                { name: "Magic Potion", price: 350, image: "nft/Magic Potion.png", id: Date.now() + 3 }
            ];
            localStorage.setItem('yeter_inventory', JSON.stringify(inventory));
        }
        
        // Добавляем тестовые листинги если пусто
        if (marketListings.length === 0) {
            marketListings = [
                { name: "Eternal Candle", price: 90, image: "nft/Eternal Candle.png", seller: "CryptoKing" },
                { name: "Kissed Frog", price: 100, image: "nft/Kissed Frog.png", seller: "NFTWhale" },
                { name: "Magic Potion", price: 400, image: "nft/Magic Potion.png", seller: "TonyMontana" }
            ];
            saveMarket();
        }
        
        setTimeout(() => {
            renderMarket();
            renderInventory();
        }, 100);
    </script>
</body>
</html>
