<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · DICE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        
        body {
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        /* ========== ОПТИМИЗИРОВАННЫЕ ЗВЕЗДЫ ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0;
            animation: twinkle 4s infinite ease-in-out;
        }

        .star.medium {
            width: 3px;
            height: 3px;
        }

        .star.large {
            width: 4px;
            height: 4px;
        }

        @keyframes twinkle {
            0% { opacity: 0; }
            20% { opacity: 0.8; }
            40% { opacity: 0.3; }
            60% { opacity: 0.6; }
            80% { opacity: 0.2; }
            100% { opacity: 0; }
        }

        .app { 
            max-width: 440px; 
            width: 100%; 
            background: transparent; 
            position: relative; 
            padding-bottom: 20px; 
            min-height: 100vh;
            z-index: 1;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 18px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 20px 16px; 
            background: transparent; 
        }
        
        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b87aff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            background: rgba(106, 13, 173, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            transition: 0.1s ease;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .back-button:active { 
            background: rgba(106, 13, 173, 0.3); 
            transform: scale(0.95);
        }
        
        .balance-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 14, 22, 0.8);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(138, 43, 226, 0.4);
        }
        
        .balance { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            font-weight: 700; 
            font-size: 16px; 
            color: white; 
        }

        .player-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 14, 22, 0.6);
            backdrop-filter: blur(5px);
            padding: 15px 20px;
            margin: 0 20px 20px;
            border-radius: 25px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        
        .avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }
        
        .profile-info { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        
        .profile-name { 
            font-size: 16px; 
            font-weight: 700; 
            color: white; 
        }
        
        .profile-level-row { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .level-number {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: white;
        }
        
        .progress-small {
            width: 70px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }
        
        .progress-fill-small { 
            height: 100%; 
            background: linear-gradient(90deg, #9b4dff, #b87aff); 
            border-radius: 20px; 
            transition: width 0.2s ease;
        }
        
        .next-level { 
            color: #b87aff; 
            font-size: 14px; 
            font-weight: 700; 
        }
        
        .message-container {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .game-message {
            width: 100%;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.3);
            animation: messagePop 0.3s ease;
            min-height: 56px;
            text-align: center;
        }
        
        @keyframes messagePop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .game-message.success {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
            border: 1px solid rgba(46, 204, 113, 0.5);
        }
        
        .game-message.error {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
            border: 1px solid rgba(231, 76, 60, 0.5);
        }
        
        .game-message.warning {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
            border: 1px solid rgba(243, 156, 18, 0.5);
        }
        
        .game-container { 
            padding: 0 20px; 
        }
        
        .controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            align-items: center;
        }
        
        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .input-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #b87aff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        
        .input-field {
            background: rgba(10, 14, 22, 0.8);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.1s ease;
            width: 100%;
        }
        
        .input-field:focus { 
            border-color: #9b4dff; 
            background: rgba(20, 25, 35, 0.9); 
        }
        
        .win-info {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .win-label {
            color: #8e98a3;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .win-amount {
            color: #b87aff;
            font-size: 48px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        
        .win-multiplier {
            color: #8e98a3;
            font-size: 18px;
            font-weight: 700;
        }
        
        .buttons-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .dice-button {
            flex: 1;
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2d0b4e;
            transition: all 0.1s ease;
            min-height: 56px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        
        .dice-button:active { 
            transform: translateY(6px); 
            box-shadow: 0 0 0 #2d0b4e; 
        }

        .dice-button:focus {
            outline: none;
        }

        .dice-button::-moz-focus-inner {
            border: 0;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="header">
            <a href="index.html" class="back-button" onclick="window.location.href='index.html'; return false;">
                <i class="fas fa-arrow-left"></i>
                <span>Назад</span>
            </a>
            <div class="balance-wrapper">
                <div class="balance">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceDisplay">12.5k</span>
                </div>
            </div>
        </div>
        
        <div class="player-profile">
            <div class="avatar-small" id="playerAvatar"></div>
            <div class="profile-info">
                <div class="profile-name" id="playerName">Загрузка...</div>
                <div class="profile-level-row">
                    <div class="level-number" id="levelDisplay">1</div>
                    <div class="progress-small">
                        <div class="progress-fill-small" id="progressFill" style="width: 0%;"></div>
                    </div>
                    <span class="next-level" id="nextLevelDisplay">2</span>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <div class="controls-row">
                <div class="input-group">
                    <div class="input-label">
                        <i class="fas fa-puzzle-piece"></i>
                        Ставка
                    </div>
                    <input type="number" id="betAmount" class="input-field" placeholder="10-100k" value="50" min="10" max="100000">
                </div>
                <div class="input-group">
                    <div class="input-label">
                        <i class="fas fa-percent"></i>
                        Шанс
                    </div>
                    <input type="number" id="chanceInput" class="input-field" placeholder="1-95%" value="50" min="1" max="95">
                </div>
            </div>
            
            <div class="win-info">
                <div class="win-label">ВОЗМОЖНЫЙ ВЫИГРЫШ</div>
                <div class="win-amount" id="winAmount">100</div>
                <div class="win-multiplier" id="winMultiplier">x2.00</div>
            </div>
            
            <div class="buttons-row">
                <button class="dice-button" id="lessBtn">
                    <i class="fas fa-arrow-down"></i>
                    МЕНЬШЕ
                </button>
                <button class="dice-button" id="moreBtn">
                    <i class="fas fa-arrow-up"></i>
                    БОЛЬШЕ
                </button>
            </div>
            
            <div class="message-container" id="messageContainer"></div>
        </div>
    </div>
    
    <script>
        // ========== ОПТИМИЗИРОВАННЫЕ ЗВЕЗДЫ ==========
        function createStars() {
            const starsContainer = document.getElementById('stars');
            if (!starsContainer) return;
            
            starsContainer.innerHTML = '';
            
            requestAnimationFrame(() => {
                const isLowEnd = navigator.hardwareConcurrency <= 4 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                const starCount = isLowEnd ? 30 : 50;
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    
                    const size = Math.random();
                    if (size < 0.6) {
                        star.className = 'star';
                    } else if (size < 0.85) {
                        star.className = 'star medium';
                    } else {
                        star.className = 'star large';
                    }
                    
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 5 + 's';
                    
                    starsContainer.appendChild(star);
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createStars);
        } else {
            createStars();
        }

        document.addEventListener('visibilitychange', function() {
            const stars = document.getElementById('stars');
            if (stars) {
                if (document.hidden) {
                    stars.style.animation = 'none';
                } else {
                    stars.style.animation = '';
                }
            }
        });

        // ============================================
        // ГЛОБАЛЬНОЕ ХРАНИЛИЩЕ
        // ============================================
        (function() {
            const tg = window.Telegram?.WebApp;
            
            if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #03050a; color: white; text-align: center; padding: 20px;">
                        <div>
                            <h2 style="margin-bottom: 20px; color: #ff4444;">❌ Доступ запрещен</h2>
                            <p style="color: #8e98a3; margin-bottom: 20px;">Приложение работает только в Telegram</p>
                        </div>
                    </div>
                `;
                throw new Error('Not in Telegram');
            }

            const userId = tg.initDataUnsafe.user.id;
            const STORAGE_KEY = `yeter_user_${userId}`;
            
            function loadUserData() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch {
                        return createDefaultData();
                    }
                }
                return createDefaultData();
            }
            
            function createDefaultData() {
                return {
                    stars: 12500,
                    level: 1,
                    exp: 0,
                    expToNext: 1000,
                    gifts: [],
                    games: { dice: { wins: 0, losses: 0 } },
                    transactions: [],
                    lastSync: Date.now()
                };
            }
            
            let userData = loadUserData();
            
            function saveUserData() {
                userData.lastSync = Date.now();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
                localStorage.setItem('yeter_data_updated', Date.now().toString());
                setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
            }
            
            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY && e.newValue) {
                    try {
                        const newData = JSON.parse(e.newValue);
                        if (newData.lastSync > userData.lastSync) {
                            userData = newData;
                            updateUIDisplay();
                        }
                    } catch {}
                }
                if (e.key === 'yeter_data_updated') {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            const newData = JSON.parse(saved);
                            if (newData.lastSync > userData.lastSync) {
                                userData = newData;
                                updateUIDisplay();
                            }
                        } catch {}
                    }
                }
            });
            
            setInterval(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const newData = JSON.parse(saved);
                        if (newData.lastSync > userData.lastSync) {
                            userData = newData;
                            updateUIDisplay();
                        }
                    } catch {}
                }
            }, 2000);
            
            window.UserStorage = {
                getStars: function() { return userData.stars; },
                getLevel: function() { return userData.level; },
                getExp: function() { return userData.exp; },
                getExpToNext: function() { return userData.expToNext; },
                getUserData: function() { return { ...userData }; },
                
                updateStars: function(amount, reason) {
                    if (userData.stars + amount < 0) return false;
                    userData.stars += amount;
                    if (!userData.transactions) userData.transactions = [];
                    userData.transactions.push({ amount, reason, time: Date.now(), balance: userData.stars });
                    if (userData.transactions.length > 50) userData.transactions = userData.transactions.slice(-50);
                    saveUserData();
                    return true;
                },
                
                addExp: function(amount) {
                    userData.exp += amount;
                    while (userData.exp >= userData.expToNext) {
                        userData.exp -= userData.expToNext;
                        userData.level++;
                        userData.expToNext = Math.floor(userData.expToNext * 1.5);
                    }
                    saveUserData();
                },
                
                forceUpdate: function() {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            const newData = JSON.parse(saved);
                            userData = newData;
                            updateUIDisplay();
                        } catch {}
                    }
                }
            };
        })();

        // ============================================
        // ФОРМАТИРОВАНИЕ ЧИСЕЛ
        // ============================================
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'м';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'к';
            }
            return num.toString();
        }

        // ============================================
        // ОБНОВЛЕНИЕ UI
        // ============================================
        function updateUIDisplay() {
            const data = window.UserStorage.getUserData();
            document.getElementById('balanceDisplay').innerText = formatNumber(data.stars);
            document.getElementById('levelDisplay').innerText = data.level;
            document.getElementById('nextLevelDisplay').innerText = data.level + 1;
            
            const progress = (data.exp / data.expToNext) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // ============================================
        // TELEGRAM ПРОФИЛЬ
        // ============================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            
            const user = tg.initDataUnsafe?.user;
            if (user) {
                const firstName = user.first_name || '';
                const lastName = user.last_name || '';
                const fullName = (firstName + ' ' + lastName).trim() || 'Player';
                
                document.getElementById('playerName').innerText = fullName;
                
                if (user.photo_url) {
                    document.getElementById('playerAvatar').style.backgroundImage = `url('${user.photo_url}')`;
                    document.getElementById('playerAvatar').style.backgroundColor = 'transparent';
                    document.getElementById('playerAvatar').style.backgroundSize = 'cover';
                    document.getElementById('playerAvatar').innerText = '';
                } else {
                    document.getElementById('playerAvatar').innerText = (firstName.charAt(0) || 'П').toUpperCase();
                }
            }
        }

        // ============================================
        // ИГРОВАЯ ЛОГИКА
        // ============================================
        function showMessage(text, type = 'success') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            
            const msg = document.createElement('div');
            msg.className = `game-message ${type}`;
            
            // Специальная обработка для сообщения о шансе
            if (text.includes('Шанс должен быть')) {
                msg.style.flexDirection = 'column';
                msg.style.padding = '12px 16px';
                msg.innerHTML = `
                    <div style="font-size: 16px;">Шанс должен быть</div>
                    <div style="font-size: 20px; display: flex; align-items: center; gap: 4px;">от 1% до 95%</div>
                `;
            } else {
                msg.innerHTML = `<span>${text}</span>`;
            }
            
            container.appendChild(msg);
            
            setTimeout(() => {
                if (msg.parentNode) {
                    msg.style.animation = 'messagePop 0.3s reverse';
                    setTimeout(() => msg.remove(), 300);
                }
            }, 3000);
        }

        function calculateMultiplier(chance) {
            if (chance <= 0) chance = 0.01;
            if (chance > 95) chance = 95;
            return Math.round((100 / chance) * 100) / 100;
        }

        function updateWinInfo() {
            const bet = parseFloat(document.getElementById('betAmount').value) || 0;
            const chance = parseFloat(document.getElementById('chanceInput').value) || 50;
            
            const validChance = Math.max(1, Math.min(95, chance));
            const mult = calculateMultiplier(validChance);
            const win = Math.floor(bet * mult);
            
            document.getElementById('winAmount').innerText = win;
            document.getElementById('winMultiplier').innerText = `x${mult.toFixed(2)}`;
        }

        function playGame(prediction) {
            const bet = parseInt(document.getElementById('betAmount').value);
            const chance = parseInt(document.getElementById('chanceInput').value);
            
            if (isNaN(bet) || bet < 10) {
                showMessage('Минимальная ставка 10 🧩', 'error');
                return;
            }
            if (bet > 100000) {
                showMessage('Максимальная ставка 100000 🧩', 'error');
                return;
            }
            if (isNaN(chance) || chance < 1 || chance > 95) {
                showMessage('Шанс должен быть от 1% до 95%', 'warning');
                return;
            }
            
            const currentStars = window.UserStorage.getStars();
            if (bet > currentStars) {
                showMessage('Недостаточно средств', 'error');
                return;
            }
            
            if (!window.UserStorage.updateStars(-bet, 'Ставка в Dice')) {
                showMessage('Ошибка транзакции', 'error');
                return;
            }
            
            const roll = Math.floor(Math.random() * 100) + 1;
            
            let win = false;
            if (prediction === 'less' && roll <= chance) {
                win = true;
            } else if (prediction === 'more' && roll > (100 - chance)) {
                win = true;
            }
            
            if (win) {
                const mult = calculateMultiplier(chance);
                const winAmount = Math.floor(bet * mult);
                
                if (window.UserStorage.updateStars(winAmount, 'Выигрыш в Dice')) {
                    window.UserStorage.addExp(Math.floor(bet / 10));
                    showMessage(`ВЫИГРЫШ +${winAmount} 🧩`, 'success');
                }
            } else {
                window.UserStorage.addExp(1);
                showMessage(`ПРОИГРЫШ -${bet} 🧩`, 'error');
            }
            
            updateUIDisplay();
            updateWinInfo();
            
            localStorage.setItem('yeter_data_updated', Date.now().toString());
            setTimeout(() => localStorage.removeItem('yeter_data_updated'), 100);
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        window.onload = function() {
            updateUIDisplay();
            updateWinInfo();
            
            document.getElementById('betAmount').addEventListener('input', updateWinInfo);
            document.getElementById('chanceInput').addEventListener('input', updateWinInfo);
            
            document.getElementById('lessBtn').addEventListener('click', () => playGame('less'));
            document.getElementById('moreBtn').addEventListener('click', () => playGame('more'));
            
            setTimeout(() => {
                window.UserStorage.forceUpdate();
            }, 500);
        };
    </script>
</body>
</html>
