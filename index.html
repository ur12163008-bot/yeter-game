<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · GAMES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.6;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            position: relative;
            padding-bottom: 100px;
            min-height: 100vh;
            z-index: 1;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 16px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }

        .content {
            padding: 8px 20px 20px;
        }

        .games-top {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(5, 7, 12, 0.2);
            border-radius: 18px;
            padding: 12px;
        }

        .games-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }

        .games-info-wrapper {
            flex: 1;
            min-width: 0;
        }

        .games-nickname {
            font-size: 16px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .games-level-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .level-number-small {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(106, 13, 173, 0.5);
            flex-shrink: 0;
        }

        .level-number-small span {
            font-size: 14px;
            font-weight: 800;
            color: white;
        }

        .games-progress-small {
            width: 60px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .games-progress-fill-small {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            transition: width 0.2s ease;
        }

        .next-level-number-games {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(42, 30, 58, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .next-level-number-games span {
            font-size: 14px;
            font-weight: 800;
            color: #b87aff;
        }

        .games-balance-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(10, 14, 22, 0.8);
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            flex-shrink: 0;
            margin-left: auto;
        }

        .games-stars {
            display: flex;
            align-items: center;
            gap: 3px;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .add-balance-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .live-banner {
            background: #1a1a1a;
            border-radius: 25px;
            height: 75px;
            width: 100%;
            display: flex;
            align-items: center;
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 0 12px;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .live-banner::-webkit-scrollbar {
            display: none;
        }

        .live-banner::before {
            content: "LIVE";
            color: white;
            font-weight: 900;
            font-size: 22px;
            margin-right: 12px;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .live-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 35, 45, 0.9);
            border: 1px solid rgba(155, 77, 255, 0.4);
            border-radius: 30px;
            padding: 4px 12px 4px 4px;
            flex-shrink: 0;
        }

        .live-item-image {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid rgba(155, 77, 255, 0.5);
            background: #2a2a2a;
        }

        .live-item-name {
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .live-item-price {
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
        }

        .games-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .game-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
            min-height: 115px;
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 1px solid rgba(138, 43, 226, 0.3);
            position: relative;
            overflow: hidden;
        }

        .game-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            z-index: 2;
        }

        .game-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-title {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .game-stats {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-count {
            font-size: 13px;
            font-weight: 600;
            color: #b87aff;
        }

        .online-text {
            font-size: 12px;
            color: #8e98a3;
        }

        .game-arrow {
            color: #b87aff;
            font-size: 20px;
            opacity: 0.8;
            flex-shrink: 0;
            z-index: 2;
        }

        .game-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 170px;
            height: 100%;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jackpot-bg {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
            background: linear-gradient(90deg, transparent, rgba(155, 77, 255, 0.25));
            width: 170px;
        }

        .jackpot-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.15);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: white;
            transform: translateX(15px);
            width: fit-content;
        }

        .jackpot-item i {
            color: #ffd700;
            font-size: 12px;
        }

        .mines-bg {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
            width: 110px;
            height: 110px;
            transform: rotate(5deg);
        }

        .mine-cell {
            width: 22px;
            height: 22px;
            background: rgba(155, 77, 255, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mine-cell i {
            color: #ff4444;
            font-size: 11px;
        }

        .puzzle-cell {
            width: 22px;
            height: 22px;
            background: rgba(255, 215, 0, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .puzzle-cell i {
            color: #ffd700;
            font-size: 11px;
        }

        .dice-bg {
            display: flex;
            gap: 10px;
            padding: 8px;
            transform: rotate(5deg);
        }

        .dice-bg i {
            font-size: 40px;
            color: #b87aff;
            filter: drop-shadow(0 0 8px #9b4dff);
        }

        .upgrade-bg {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 110px;
        }

        .upgrade-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(155, 77, 255, 0.8);
        }

        .upgrade-circle span {
            font-size: 22px;
            font-weight: 800;
            color: white;
        }

        /* НИЖНЯЯ НАВИГАЦИЯ */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-radius: 25px;
            border: 1px solid #2a1e3a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 25px;
            flex: 1;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-item i {
            font-size: 18px;
            color: #8e98a3;
        }

        .nav-item.active {
            color: #b87aff;
            background: rgba(106, 13, 173, 0.3);
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="content">
            <div class="games-top">
                <div class="games-header">
                    <div class="avatar-small" id="gamesAvatar"></div>
                    
                    <div class="games-info-wrapper">

        <!-- НИЖНЯЯ НАВИГАЦИЯ - ИСПРАВЛЕННАЯ ССЫЛКА -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active">

    <script>
        // ЗАЩИТА ОТ НАКРУТКИ И ФЕЙКОВ
        (function() {
            // Проверка на запуск в Telegram WebApp
            const tg = window.Telegram?.WebApp;
            
            // Если не в Telegram, блокируем функционал
            if (!tg || !tg.initData || !tg.initDataUnsafe?.user) {
                console.error('Доступ запрещен: приложение работает только в Telegram');
                
                // Блокируем все клики и показываем сообщение
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #03050a; color: white; text-align: center; padding: 20px;">
                        <div>
                            <h2 style="margin-bottom: 20px; color: #ff4444;">❌ Доступ запрещен</h2>
                            <p style="color: #8e98a3; margin-bottom: 20px;">Приложение работает только в Telegram WebApp</p>
                            <a href="https://t.me/your_bot" style="background: linear-gradient(145deg, #6a0dad, #4b0082); color: white; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 600;">Открыть в Telegram</a>
                        </div>
                    </div>
                `;
                throw new Error('Not in Telegram');
            }

            // Сохраняем данные пользователя для проверки
            const user = tg.initDataUnsafe.user;
            const chatId = user.id;
            const startParam = tg.initDataUnsafe.start_param || '';
            
            // Функция для проверки подписи данных
            function validateTelegramData() {
                // Здесь должна быть проверка на сервере
                // Но для клиента - хотя бы проверяем наличие данных
                return tg.initData && tg.initData.length > 0;
            }

            if (!validateTelegramData()) {
                console.error('Невалидные данные Telegram');
                tg.close();
            }

            // Защита от инспектора и консоли
            (function() {
                const devtools = {
                    open: false,
                    orientation: null
                };
                
                // Проверка на открытые инструменты разработчика
                setInterval(() => {
                    const widthThreshold = window.outerWidth - window.innerWidth > 160;
                    const heightThreshold = window.outerHeight - window.innerHeight > 160;
                    
                    if (widthThreshold || heightThreshold) {
                        // Если открыты инструменты разработчика, блокируем
                        document.body.innerHTML = '<div style="color: white; background: #03050a; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center;">🔒 Инструменты разработчика отключены</div>';
                    }
                }, 1000);
            })();

            // Защита от повторных запусков (фреймы)
            if (window.self !== window.top) {
                throw new Error('Запуск во фрейме запрещен');
            }
        })();

        // Звезды
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // Функция форматирования чисел
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'м';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'к';
            }
            return num.toString();
        }

        // Функция для добавления в LIVE ленту
        window.addToLiveBanner = function(nftName, nftPrice, nftImage) {
            const banner = document.getElementById('liveBanner');
            
            const item = document.createElement('div');
            item.className = 'live-item';
            
            let imagePath = nftImage;
            if (!imagePath.startsWith('nft/') && !imagePath.startsWith('http')) {
                imagePath = 'nft/' + imagePath;
            }
            
            item.innerHTML = `
                <img src="${imagePath}" class="live-item-image" 
                     onerror="this.src='https://via.placeholder.com/35/2a2a2a/9b4dff?text=NFT'">
                <span class="live-item-name">${nftName}</span>
                <span class="live-item-price">${formatNumber(nftPrice)} 🧩</span>
            `;
            
            banner.appendChild(item);
            
            while (banner.children.length > 9) {
                if (banner.children[1]) {
                    banner.removeChild(banner.children[1]);
                }
            }
        };

        // Слушаем покупки с проверкой источника
        window.addEventListener('storage', (e) => {
            if (e.key === 'new_purchase') {
                try {
                    // Проверяем, что событие пришло из того же домена
                    if (e.origin && e.origin !== window.location.origin) {
                        return;
                    }
                    
                    const purchase = JSON.parse(e.newValue);
                    
                    // Дополнительная проверка на валидность данных
                    if (purchase && purchase.name && purchase.price && purchase.image) {
                        window.addToLiveBanner(purchase.name, purchase.price, purchase.image);
                    }
                } catch (err) {
                    console.error('Ошибка при обработке покупки');
                }
            }
        });

        // Telegram WebApp инициализация с защитой
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
                
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    // Устанавливаем имя пользователя
                    document.getElementById('gamesNickname').innerText = user.first_name || 'Player';
                    
                    // Загружаем аватар если есть
                    if (user.photo_url) {
                        document.getElementById('gamesAvatar').style.backgroundImage = `url(${user.photo_url})`;
                        document.getElementById('gamesAvatar').style.backgroundColor = 'transparent';
                        document.getElementById('gamesAvatar').innerText = '';
                    } else {
                        document.getElementById('gamesAvatar').innerText = (user.first_name?.charAt(0) || 'П').toUpperCase();
                    }
                    
                    // Получаем баланс из secure storage (имитация)
                    // В реальности должно приходить с сервера
                    const userBalance = localStorage.getItem(`balance_${user.id}`) || '12500';
                    document.getElementById('gamesBalanceDisplay').innerText = formatNumber(parseInt(userBalance));
                }
            } catch (e) {
                console.error('Ошибка инициализации Telegram');
            }
        }

        // Защита от кликджекинга
        document.addEventListener('click', function(e) {
            // Дополнительная проверка для важных действий
            if (e.target.closest('.add-balance-btn')) {
                e.preventDefault();
                // Здесь должна быть проверка на сервере
                console.log('Попытка накрутки баланса заблокирована');
            }
        }, true);

        // Маскируем чувствительные данные в консоли
        ['log', 'info', 'warn', 'error'].forEach(method => {
            const original = console[method];
            console[method] = function() {
                if (arguments[0] && typeof arguments[0] === 'string' && 
                    (arguments[0].includes('balance') || arguments[0].includes('user'))) {
                    return;
                }
                original.apply(console, arguments);
            };
        });

        // Очищаем localStorage при выходе (опционально)
        window.addEventListener('beforeunload', function() {
            // Не очищаем, просто для совместимости
        });
    </script>
</body>
</html>
