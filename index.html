<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · GAMES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.6;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            position: relative;
            padding-bottom: 100px;
            min-height: 100vh;
            z-index: 1;
        }

        .puzzle-icon {
            display: inline-block;
            font-size: 16px;
            line-height: 1;
            color: #ffd700;
            flex-shrink: 0;
        }

        .content {
            padding: 8px 20px 20px;
        }

        .games-top {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(5, 7, 12, 0.2);
            border-radius: 18px;
            padding: 12px;
        }

        .games-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-small {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }

        .games-info-wrapper {
            flex: 1;
            min-width: 0;
        }

        .games-nickname {
            font-size: 16px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .games-level-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .level-number-small {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(106, 13, 173, 0.5);
            flex-shrink: 0;
        }

        .level-number-small span {
            font-size: 14px;
            font-weight: 800;
            color: white;
        }

        .games-progress-small {
            width: 60px;
            height: 5px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .games-progress-fill-small {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            transition: width 0.2s ease;
        }

        .next-level-number-games {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(42, 30, 58, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .next-level-number-games span {
            font-size: 14px;
            font-weight: 800;
            color: #b87aff;
        }

        /* БАЛАНС - ЧУТЬ ПОБОЛЬШЕ */
        .games-balance-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 14, 22, 0.8);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            flex-shrink: 0;
            margin-left: auto;
        }

        .games-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }

        .add-balance-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.7;
            pointer-events: none; /* Не нажимается, просто для вида */
        }

        .live-banner {
            background: #1a1a1a;
            border-radius: 25px;
            height: 75px;
            width: 100%;
            display: flex;
            align-items: center;
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 0 12px;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .live-banner::-webkit-scrollbar {
            display: none;
        }

        .live-banner::before {
            content: "LIVE";
            color: white;
            font-weight: 900;
            font-size: 22px;
            margin-right: 12px;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .live-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 35, 45, 0.9);
            border: 1px solid rgba(155, 77, 255, 0.4);
            border-radius: 30px;
            padding: 4px 12px 4px 4px;
            flex-shrink: 0;
        }

        .live-item-image {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid rgba(155, 77, 255, 0.5);
            background: #2a2a2a;
        }

        .live-item-name {
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .live-item-price {
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
        }

        .games-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .game-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
            min-height: 115px;
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 1px solid rgba(138, 43, 226, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.1s ease;
        }

        .game-card:active {
            transform: scale(0.98);
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
        }

        .game-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            z-index: 2;
        }

        .game-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-title {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .game-stats {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-count {
            font-size: 13px;
            font-weight: 600;
            color: #b87aff;
        }

        .online-text {
            font-size: 12px;
            color: #8e98a3;
        }

        .game-arrow {
            color: #b87aff;
            font-size: 20px;
            opacity: 0.8;
            flex-shrink: 0;
            z-index: 2;
        }

        .game-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 170px;
            height: 100%;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jackpot-bg {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
            background: linear-gradient(90deg, transparent, rgba(155, 77, 255, 0.25));
            width: 170px;
        }

        .jackpot-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.15);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: white;
            transform: translateX(15px);
            width: fit-content;
        }

        .jackpot-item i {
            color: #ffd700;
            font-size: 12px;
        }

        /* МИНЫ - ЗАМЕНИЛ ЗВЕЗДЫ НА ПАЗЛЫ */
        .mines-bg {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
            width: 110px;
            height: 110px;
            transform: rotate(3deg);
        }

        .mine-cell {
            width: 22px;
            height: 22px;
            background: rgba(155, 77, 255, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mine-cell i {
            color: #ff4444;
            font-size: 11px;
        }

        .puzzle-cell {
            width: 22px;
            height: 22px;
            background: rgba(255, 215, 0, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .puzzle-cell i {
            color: #ffd700;
            font-size: 11px;
        }

        /* DICE - НАКЛОНЕННЫЕ КУБИКИ */
        .dice-bg {
            display: flex;
            gap: 12px;
            padding: 8px;
            transform: rotate(0deg);
            position: relative;
        }

        .dice-bg i {
            font-size: 40px;
            color: #b87aff;
            filter: drop-shadow(0 0 8px #9b4dff);
            display: block;
        }

        .dice-bg i:nth-child(1) {
            transform: rotate(-15deg) translateY(5px);
        }
        
        .dice-bg i:nth-child(2) {
            transform: rotate(5deg) translateY(-3px);
        }
        
        .dice-bg i:nth-child(3) {
            transform: rotate(25deg) translateY(8px);
        }

        .upgrade-bg {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 110px;
        }

        .upgrade-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(155, 77, 255, 0.8);
        }

        .upgrade-circle span {
            font-size: 22px;
            font-weight: 800;
            color: white;
        }

        /* НИЖНЯЯ НАВИГАЦИЯ */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-radius: 25px;
            border: 1px solid #2a1e3a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: 25px;
            flex: 1;
            text-align: center;
            text-decoration: none;
            transition: all 0.1s ease;
            background: transparent;
            border: none;
            outline: none;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.2);
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 18px;
            color: #8e98a3;
            pointer-events: none;
        }

        .nav-item.active {
            color: #b87aff;
            background: rgba(106, 13, 173, 0.3);
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 600;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="content">
            <div class="games-top">
                <div class="games-header">
                    <div class="avatar-small" id="gamesAvatar"></div>
                    
                    <div class="games-info-wrapper">
                        <div class="games-nickname" id="gamesNickname">Загрузка...</div>
                        <div class="games-level-row">
                            <div class="level-number-small"><span id="gamesLevelNumber">1</span></div>
                            <div class="games-progress-small">
                                <div class="games-progress-fill-small" id="gamesProgressFill" style="width: 0%;"></div>
                            </div>
                            <div class="next-level-number-games"><span id="gamesNextLevel">2</span></div>
                        </div>
                    </div>
                    
                    <!-- БАЛАНС С КНОПКОЙ + (НЕ РАБОТАЕТ) -->
                    <div class="games-balance-wrapper">
                        <div class="games-stars">
                            <span class="puzzle-icon">🧩</span>
                            <span id="gamesBalanceDisplay">12.5k</span>
                        </div>
                        <div class="add-balance-btn" id="addBalanceBtn">+</div>
                    </div>
                </div>

                <div class="live-banner" id="liveBanner"></div>
            </div>

            <div class="games-container">
                <div class="game-card" onclick="window.location.href='jackpot.html'">
                    <div class="game-left">
                        <div class="game-icon"><i class="fas fa-trophy"></i></div>
                        <div class="game-info">
                            <div class="game-title">Джекпот</div>
                            <div class="game-stats">
                                <span class="online-count">3,456</span>
                                <span class="online-text">онлайн</span>
                            </div>
                        </div>
                    </div>
                    <div class="game-arrow"><i class="fas fa-chevron-right"></i></div>
                    <div class="game-bg jackpot-bg">
                        <div class="jackpot-item"><i class="fas fa-user"></i> 2.5k</div>
                        <div class="jackpot-item"><i class="fas fa-user"></i> 1.8k</div>
                        <div class="jackpot-item"><i class="fas fa-user"></i> 1.2k</div>
                    </div>
                </div>

                <!-- МИНЫ - ТЕПЕРЬ ПАЗЛЫ ВМЕСТО ЗВЕЗД -->
                <div class="game-card" onclick="window.location.href='MINES.html'">
                    <div class="game-left">
                        <div class="game-icon"><i class="fas fa-bomb"></i></div>
                        <div class="game-info">
                            <div class="game-title">Мины</div>
                            <div class="game-stats">
                                <span class="online-count">892</span>
                                <span class="online-text">онлайн</span>
                            </div>
                        </div>
                    </div>
                    <div class="game-arrow"><i class="fas fa-chevron-right"></i></div>
                    <div class="game-bg">
                        <div class="mines-bg">
                            <div class="mine-cell"><i class="fas fa-bomb"></i></div>
                            <div class="puzzle-cell"><span class="puzzle-icon">🧩</span></div>
                            <div class="mine-cell"><i class="fas fa-bomb"></i></div>
                            <div class="puzzle-cell"><span class="puzzle-icon">🧩</span></div>
                            <div class="mine-cell"><i class="fas fa-bomb"></i></div>
                            <div class="puzzle-cell"><span class="puzzle-icon">🧩</span></div>
                            <div class="mine-cell"><i class="fas fa-bomb"></i></div>
                            <div class="puzzle-cell"><span class="puzzle-icon">🧩</span></div>
                            <div class="mine-cell"><i class="fas fa-bomb"></i></div>
                        </div>
                    </div>
                </div>

                <!-- DICE - НАКЛОНЕННЫЕ КУБИКИ -->
                <div class="game-card" onclick="window.location.href='dice.html'">
                    <div class="game-left">
                        <div class="game-icon"><i class="fas fa-dice"></i></div>
                        <div class="game-info">
                            <div class="game-title">Dice</div>
                            <div class="game-stats">
                                <span class="online-count">2,013</span>
                                <span class="online-text">онлайн</span>
                            </div>
                        </div>
                    </div>
                    <div class="game-arrow"><i class="fas fa-chevron-right"></i></div>
                    <div class="game-bg">
                        <div class="dice-bg">
                            <i class="fas fa-dice-six"></i>
                            <i class="fas fa-dice-six"></i>
                            <i class="fas fa-dice-six"></i>
                        </div>
                    </div>
                </div>

                <div class="game-card" onclick="window.location.href='upgrade.html'">
                    <div class="game-left">
                        <div class="game-icon"><i class="fas fa-arrow-up"></i></div>
                        <div class="game-info">
                            <div class="game-title">Апгрейд</div>
                            <div class="game-stats">
                                <span class="online-count">2,341</span>
                                <span class="online-text">онлайн</span>
                            </div>
                        </div>
                    </div>
                    <div class="game-arrow"><i class="fas fa-chevron-right"></i></div>
                    <div class="game-bg">
                        <div class="upgrade-bg">
                            <div class="upgrade-circle">
                                <span>75%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ - ИСПРАВЛЕННАЯ ССЫЛКА НА PROFLE.HTML -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active" onclick="window.location.href='index.html'; return false;">
                <i class="fas fa-gamepad"></i>
                <span>ИГРЫ</span>
            </a>
            <a href="shop.html" class="nav-item" onclick="window.location.href='shop.html'; return false;">
                <i class="fas fa-store"></i>
                <span>МАГАЗИН</span>
            </a>
            <a href="leaders.html" class="nav-item" onclick="window.location.href='leaders.html'; return false;">
                <i class="fas fa-trophy"></i>
                <span>ЛИДЕРЫ</span>
            </a>
            <a href="profle.html" class="nav-item" onclick="window.location.href='profle.html'; return false;">  <!-- ИСПРАВЛЕНО: profile.html -> profle.html -->
                <i class="fas fa-user"></i>
                <span>ПРОФИЛЬ</span>
            </a>
        </div>
    </div>

    <script>
        // Звезды
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // Функция форматирования чисел
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'м';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'к';
            }
            return num.toString();
        }

        // Функция для добавления в LIVE ленту
        window.addToLiveBanner = function(nftName, nftPrice, nftImage) {
            const banner = document.getElementById('liveBanner');
            
            const item = document.createElement('div');
            item.className = 'live-item';
            
            let imagePath = nftImage;
            if (!imagePath.startsWith('nft/') && !imagePath.startsWith('http')) {
                imagePath = 'nft/' + imagePath;
            }
            
            item.innerHTML = `
                <img src="${imagePath}" class="live-item-image" 
                     onerror="this.src='https://via.placeholder.com/35/2a2a2a/9b4dff?text=NFT'">
                <span class="live-item-name">${nftName}</span>
                <span class="live-item-price">${formatNumber(nftPrice)} 🧩</span>
            `;
            
            banner.appendChild(item);
            
            while (banner.children.length > 9) {
                if (banner.children[1]) {
                    banner.removeChild(banner.children[1]);
                }
            }
        };

        // Слушаем покупки
        window.addEventListener('storage', (e) => {
            if (e.key === 'new_purchase') {
                try {
                    const purchase = JSON.parse(e.newValue);
                    if (purchase && purchase.name && purchase.price && purchase.image) {
                        window.addToLiveBanner(purchase.name, purchase.price, purchase.image);
                    }
                } catch (err) {}
            }
        });

        // Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('gamesNickname').innerText = user.first_name || 'Player';
                
                if (user.photo_url) {
                    document.getElementById('gamesAvatar').style.backgroundImage = `url(${user.photo_url})`;
                    document.getElementById('gamesAvatar').style.backgroundColor = 'transparent';
                    document.getElementById('gamesAvatar').innerText = '';
                } else {
                    document.getElementById('gamesAvatar').innerText = (user.first_name?.charAt(0) || 'П').toUpperCase();
                }
            }
        }

        // Принудительная установка активного пункта меню
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('active');
            if (item.getAttribute('href') === currentPage) {
                item.classList.add('active');
            }
        });

        // Обработчики для навигации (чтобы работало с первого раза)
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href) {
                    window.location.href = href;
                }
            });
        });
    </script>
</body>
</html>
