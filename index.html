<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NFT Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-color:rgba(138,43,226,.2)}
html,body{height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Inter',sans-serif;background:#03050a;color:#fff;display:flex;justify-content:center;overflow-x:hidden}

/* Stars BG — CSS radial-gradients (same as index.css) */
.stars-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 40% 50%,#0a0e1a 0%,#03050a 70%,#000103 100%);z-index:0;pointer-events:none}
.stars-bg::before,.stars-bg::after{content:'';position:absolute;inset:0}
.stars-bg::before{background-image:
  radial-gradient(1.5px 1.5px at 15% 20%,rgba(255,255,255,.32) 0%,transparent 100%),
  radial-gradient(1px 1px at 82% 10%,rgba(255,255,255,.22) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 60% 35%,rgba(255,255,255,.28) 0%,transparent 100%),
  radial-gradient(1px 1px at 30% 65%,rgba(255,255,255,.18) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 75% 55%,rgba(255,255,255,.25) 0%,transparent 100%),
  radial-gradient(1px 1px at 5% 45%,rgba(255,255,255,.18) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 50% 80%,rgba(255,255,255,.2) 0%,transparent 100%),
  radial-gradient(1px 1px at 90% 75%,rgba(255,255,255,.16) 0%,transparent 100%),
  radial-gradient(1px 1px at 25% 90%,rgba(255,255,255,.18) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 40% 5%,rgba(255,255,255,.28) 0%,transparent 100%),
  radial-gradient(1px 1px at 68% 15%,rgba(255,255,255,.2) 0%,transparent 100%),
  radial-gradient(1px 1px at 12% 78%,rgba(255,255,255,.18) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 55% 60%,rgba(255,255,255,.22) 0%,transparent 100%),
  radial-gradient(1px 1px at 88% 40%,rgba(255,255,255,.16) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 72% 88%,rgba(255,255,255,.22) 0%,transparent 100%)}
.stars-bg::after{background-image:
  radial-gradient(1px 1px at 22% 15%,rgba(255,255,255,.18) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 77% 28%,rgba(255,255,255,.24) 0%,transparent 100%),
  radial-gradient(1px 1px at 43% 42%,rgba(255,255,255,.16) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 8% 60%,rgba(255,255,255,.22) 0%,transparent 100%),
  radial-gradient(1px 1px at 58% 22%,rgba(255,255,255,.2) 0%,transparent 100%),
  radial-gradient(1px 1px at 85% 65%,rgba(255,255,255,.16) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 33% 85%,rgba(255,255,255,.26) 0%,transparent 100%),
  radial-gradient(1px 1px at 92% 12%,rgba(255,255,255,.22) 0%,transparent 100%)}

/* Ambient orbs */
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1);opacity:.12}50%{transform:translate(30px,-20px) scale(1.08);opacity:.18}}
@keyframes orb2{0%,100%{transform:translate(0,0) scale(1);opacity:.08}50%{transform:translate(-25px,30px) scale(1.05);opacity:.14}}
.ambient-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;will-change:transform,opacity}
.orb1{width:340px;height:340px;background:radial-gradient(circle,rgba(148,38,255,.22) 0%,transparent 70%);top:-60px;left:-60px;animation:orb1 8s ease-in-out infinite}
.orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(90,20,200,.18) 0%,transparent 70%);bottom:60px;right:-50px;animation:orb2 10s ease-in-out infinite}

/* App shell */
.app{max-width:440px;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1;overflow:hidden}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);padding:10px 18px;border-radius:60px;background:rgba(0,200,83,.9);color:#fff;font-weight:500;font-size:13px;z-index:9999;transition:transform .22s;pointer-events:none;white-space:nowrap;border:.5px solid rgba(255,255,255,.2)}
.toast.err{background:rgba(139,26,26,.95)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Profile header */
.phdr{display:flex;align-items:center;justify-content:space-between;margin:16px 20px 18px;gap:12px;flex-shrink:0}
.phdr-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.ava{width:50px;height:50px;border-radius:18px;background:rgba(106,13,173,.5);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;border:.5px solid rgba(184,122,255,.5);flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.phdr-name{font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phdr-un{font-size:13px;color:rgba(255,255,255,.48);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal-block{display:flex;align-items:center;gap:6px;background:rgba(18,18,34,.92);border:1px solid rgba(138,43,226,.2);border-radius:60px;padding:6px 8px 6px 14px;flex-shrink:0}
.bal-val{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px}
.plus-btn{background:rgba(255,255,255,.1);border:1px solid rgba(138,43,226,.38);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#b87aff;font-size:20px;font-weight:300;cursor:pointer;line-height:1}
.plus-btn:active{background:rgba(106,13,173,.6);transform:scale(.92)}

/* Search row */
.srow{display:flex;gap:10px;align-items:center;margin:0 20px 12px;flex-shrink:0}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:60px;padding:10px 14px}
.sbox input{background:transparent;border:none;color:#fff;font-size:14px;outline:none;width:100%;font-family:inherit}
.sbox input::placeholder{color:rgba(255,255,255,.38)}
.sbox i.fa-search{color:rgba(255,255,255,.35);font-size:13px}
.ibtn{background:rgba(255,255,255,.06);border:1px solid rgba(184,122,255,.28);border-radius:60px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#b87aff;font-size:15px;flex-shrink:0}
.ibtn:active{transform:scale(.92)}

/* Market area */
.mwrap{flex:1;overflow:hidden;position:relative}
.mscroll{height:100%;overflow-y:auto;padding:0 20px 110px;scrollbar-width:none}
.mscroll::-webkit-scrollbar{display:none}

/* Market cards */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:rgba(18,18,36,.92);border:1px solid rgba(138,43,226,.2);border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;position:relative;overflow:hidden;transition:transform .15s cubic-bezier(.34,1.56,.64,1);will-change:transform}
.mcard:active{transform:scale(.94)}
/* Card shine (same as React app) */
.mcard::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);pointer-events:none}
.mcard:hover::after{animation:cardShine .7s ease forwards}
@keyframes cardShine{0%{left:-120%}100%{left:120%}}
.mcard img{width:100px;height:100px;border-radius:16px;object-fit:cover;margin-bottom:10px;background:rgba(40,25,65,.6);display:block}
.mc-name{font-size:12px;font-weight:500;text-align:center;margin-bottom:5px;line-height:1.3;color:rgba(255,255,255,.88);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-seller{display:flex;align-items:center;gap:5px;margin-bottom:6px;width:100%;justify-content:center}
.mc-av{width:16px;height:16px;border-radius:4px;background:rgba(88,10,148,.55);border:1px solid rgba(184,122,255,.45);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}
.mc-sn{font-size:10px;color:rgba(255,255,255,.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.mc-price{font-size:13px;font-weight:700;color:#b87aff;display:flex;align-items:center;gap:4px}
.empty{text-align:center;color:rgba(255,255,255,.48);padding:60px 0;font-size:14px;grid-column:1/-1}

/* Scroll indicator */
.scroll-indicator-track{position:absolute;right:4px;top:8px;bottom:8px;width:3px;background:rgba(106,13,173,.3);border-radius:4px;pointer-events:none;opacity:0;transition:opacity .2s}
.scroll-indicator-thumb{position:absolute;right:0;width:3px;min-height:24px;background:#b87aff;border-radius:4px}

/* Bottom nav — fixed, same as React */
.bnav{position:fixed;bottom:18px;left:18px;right:18px;max-width:404px;margin:0 auto;background:rgba(12,12,22,.95);border:1px solid rgba(184,122,255,.16);border-radius:28px;display:flex;justify-content:space-around;padding:8px 16px;z-index:1000}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.48);font-size:10px;font-weight:500;cursor:pointer;padding:6px 14px;border-radius:22px;min-width:70px;text-decoration:none;background:transparent;border:none;font-family:inherit;transition:background .12s,color .12s}
.ni i{font-size:20px}
.ni.on{background:rgba(106,13,173,.2);color:#b87aff}
.ni.on i{color:#b87aff}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;display:none;align-items:center;justify-content:center}
.ov.show{display:flex}
@keyframes modalIn{from{transform:translateY(20px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(20px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* Buy modal */
.bmod{max-width:320px;width:88%;background:rgba(14,14,26,.98);border:1px solid rgba(184,122,255,.25);border-radius:28px;padding:24px 20px 22px;position:relative;text-align:center;animation:modalIn .22s cubic-bezier(.34,1.56,.64,1)}
.xbtn{position:absolute;top:10px;right:12px;width:26px;height:26px;background:rgba(255,255,255,.08);border:1px solid rgba(184,122,255,.2);border-radius:50%;color:#b87aff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:system-ui}
.xbtn:active{transform:scale(.9)}
.bm-img{width:130px;height:130px;border-radius:22px;object-fit:cover;display:block;margin:0 auto 16px;background:rgba(40,25,65,.6)}
.bm-name{font-size:18px;font-weight:700;margin-bottom:10px}
.bm-seller{display:flex;align-items:center;gap:8px;justify-content:center;padding:8px 14px;background:rgba(255,255,255,.04);border-radius:16px;margin-bottom:12px}
.bm-sav{width:28px;height:28px;border-radius:8px;background:rgba(88,10,148,.55);border:1px solid rgba(184,122,255,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tag{background:rgba(88,10,148,.25);border:1px solid rgba(184,122,255,.22);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
.bm-price{font-size:20px;font-weight:800;color:#b87aff;margin-bottom:18px}
.buybtn{background:linear-gradient(135deg,rgba(106,13,173,.9),rgba(148,38,255,.7));border:1px solid rgba(184,122,255,.4);border-radius:60px;padding:13px 24px;width:100%;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.buybtn:disabled{opacity:.55;cursor:not-allowed}
.buybtn:not(:disabled):active{transform:scale(.97)}

/* Deposit modal — exact same as React DepositModal */
.dmod{max-width:360px;width:90%;background:rgba(14,14,26,.98);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:28px 20px 22px;position:relative;animation:slideUp .22s cubic-bezier(.34,1.56,.64,1)}
.dtitle{font-size:21px;font-weight:700;text-align:center;margin-bottom:20px}
.qas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.qa{background:rgba(88,10,148,.2);border:1px solid rgba(184,122,255,.25);border-radius:30px;padding:7px 14px;font-size:13px;font-weight:600;color:#b87aff;cursor:pointer}
.qa:active{transform:scale(.94)}
.qa.sel{background:rgba(88,10,148,.5);border-color:#b87aff;color:#fff}
.dep-inp{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:13px 16px;font-size:16px;color:#fff;outline:none;margin-bottom:14px;font-family:inherit}
.dep-inp:focus{border-color:rgba(184,122,255,.6)}
.dep-confirm{background:linear-gradient(135deg,rgba(88,10,148,.85),rgba(148,38,255,.65));border:1px solid rgba(184,122,255,.35);border-radius:60px;padding:13px 20px;width:100%;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:inherit}
.dep-confirm:active{transform:scale(.97)}
.dep-confirm span:last-child{background:rgba(255,255,255,.15);padding:3px 12px;border-radius:30px;font-size:14px}

/* Filter panel */
.fp{position:fixed;inset:0;background:rgba(8,8,18,.98);z-index:1500;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);pointer-events:none}
.fp.open{transform:translateY(0);pointer-events:auto}
.fp-inner{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;overflow:hidden}
.fp-hdr{display:flex;justify-content:center;align-items:center;position:relative;padding:22px 20px 12px;flex-shrink:0}
.fp-hdr h3{font-size:18px;font-weight:700}
.fp-x{position:absolute;right:12px;top:18px;width:28px;height:28px;background:rgba(255,255,255,.08);border:1px solid rgba(184,122,255,.22);border-radius:50%;color:#b87aff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:system-ui}
/* Tabs — grid 4 equal cols (same as React: gridTemplateColumns:'repeat(4,1fr)') */
.fp-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 20px 16px;flex-shrink:0}
.fp-tab{background:rgba(255,255,255,.06);border:1px solid rgba(184,122,255,.22);border-radius:40px;padding:9px 4px;font-size:12px;font-weight:500;color:rgba(255,255,255,.48);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;width:100%;font-family:inherit}
.fp-tab.on{background:rgba(88,10,148,.5);border-color:#b87aff;color:#fff}
.fp-bdg{background:#b87aff;color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:0 5px;min-width:14px;text-align:center}
/* Search row in filter */
.fp-srow{display:flex;gap:10px;margin:0 20px 12px;flex-shrink:0}
.fp-sbox{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:60px;padding:10px 14px}
.fp-sbox input{background:transparent;border:none;color:#fff;font-size:14px;outline:none;width:100%;font-family:inherit}
.fp-sbox i.fa-times{color:rgba(255,255,255,.35);font-size:12px;cursor:pointer}
/* Reset */
.fp-reset{display:flex;align-items:center;gap:8px;margin:0 20px 12px;background:rgba(180,30,30,.12);border:1px solid rgba(220,50,50,.25);border-radius:40px;padding:8px 18px;color:rgba(255,120,120,.85);font-size:13px;font-weight:600;cursor:pointer;justify-content:center;flex-shrink:0;font-family:inherit}
/* List */
.fp-list{flex:1;overflow:hidden;position:relative}
.fp-scr{height:100%;overflow-y:auto;padding:0 20px 30px;scrollbar-width:none}
.fp-scr::-webkit-scrollbar{display:none}
/* Filter items */
.fi{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:16px;cursor:pointer;margin-bottom:8px}
.fi.sel{background:rgba(88,10,148,.25);border-color:rgba(184,122,255,.4)}
.fi img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.07);flex-shrink:0}
.fi-info{flex:1;min-width:0}
.fi-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-sub{font-size:12px;color:#b87aff;font-weight:600;margin-top:2px}
.fi-chk{width:22px;height:22px;border-radius:7px;border:1px solid rgba(184,122,255,.3);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0}
.fi-chk.on{background:#b87aff;border-color:#b87aff}
.fi-arr{color:#b87aff;font-size:12px}
.fi-back{display:flex;align-items:center;gap:8px;color:#b87aff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}
.fi-mhdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;font-weight:600}
.fi-mhdr img{width:40px;height:40px;border-radius:10px;object-fit:cover}
/* Loading spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(184,122,255,.3);border-top-color:#b87aff;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
.fp-load{text-align:center;color:rgba(255,255,255,.48);padding:36px 0;font-size:14px}
</style>
</head>
<body>
<div class="stars-bg"></div>
<div class="ambient-orb orb1"></div>
<div class="ambient-orb orb2"></div>
<div class="toast" id="toast"></div>

<!-- BUY MODAL -->
<div class="ov" id="buyOv">
  <div class="bmod">
    <div class="xbtn" id="buyX">×</div>
    <img class="bm-img" id="bImg" src="" alt="">
    <div class="bm-name" id="bName"></div>
    <div class="bm-seller" id="bSeller"></div>
    <div class="tags" id="bTags"></div>
    <div class="bm-price" id="bPrice"></div>
    <button class="buybtn" id="buyBtn">Купить</button>
  </div>
</div>

<!-- DEPOSIT MODAL — same style as React DepositModal.tsx -->
<div class="ov" id="depOv">
  <div class="dmod">
    <div class="xbtn" id="depX">×</div>
    <div class="dtitle">Пополнение</div>
    <div class="qas">
      <span class="qa" data-a="50">50 ⭐</span><span class="qa" data-a="100">100 ⭐</span>
      <span class="qa" data-a="200">200 ⭐</span><span class="qa" data-a="500">500 ⭐</span>
      <span class="qa" data-a="1000">1000 ⭐</span><span class="qa" data-a="2000">2000 ⭐</span>
    </div>
    <input class="dep-inp" id="depIn" type="text" inputmode="numeric" placeholder="Введите количество звёзд">
    <button class="dep-confirm" id="depBtn"><span>Пополнить</span><span id="depAmt">0 ⭐</span></button>
  </div>
</div>

<!-- FILTER PANEL -->
<div class="fp" id="fp">
  <div class="fp-inner">
    <div class="fp-hdr"><h3>Фильтры</h3><div class="fp-x" id="fpX">×</div></div>
    <div class="fp-tabs" id="fpTabs">
      <button class="fp-tab on" data-t="collection">Коллекция</button>
      <button class="fp-tab" data-t="model">Модель</button>
      <button class="fp-tab" data-t="background">Фон</button>
      <button class="fp-tab" data-t="pattern">Узор</button>
    </div>
    <div class="fp-srow">
      <div class="fp-sbox">
        <i class="fas fa-search"></i>
        <input id="fpSrch" placeholder="Поиск...">
        <i class="fas fa-times" id="fpSrchX" style="display:none"></i>
      </div>
      <div class="ibtn" id="fpSortBtn" style="display:none"><i class="fas fa-arrow-up" id="fpSortI"></i></div>
    </div>
    <button class="fp-reset" id="fpReset" style="display:none"><i class="fas fa-rotate-left"></i> Сбросить всё</button>
    <div class="fp-list">
      <div class="fp-scr" id="fpScr"></div>
      <div class="scroll-indicator-track" id="fpTrack"><div class="scroll-indicator-thumb" id="fpThumb"></div></div>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app">
  <!-- Profile header -->
  <div class="phdr">
    <div class="phdr-left">
      <div class="ava" id="av">И</div>
      <div style="flex:1;min-width:0">
        <div class="phdr-name" id="fn">Игрок</div>
        <div class="phdr-un" id="un">@player</div>
      </div>
    </div>
    <div class="bal-block">
      <div class="bal-val"><span>⭐</span><span id="bv">5 000</span></div>
      <div class="plus-btn" id="plus">+</div>
    </div>
  </div>

  <!-- Search row -->
  <div class="srow">
    <div class="sbox">
      <i class="fas fa-search"></i>
      <input id="srch" placeholder="Поиск NFT...">
    </div>
    <div class="ibtn" id="filtBtn"><i class="fas fa-sliders-h"></i></div>
    <div class="ibtn" id="sortBtn"><i class="fas fa-arrow-up" id="sortI"></i></div>
  </div>

  <!-- Market grid -->
  <div class="mwrap">
    <div class="mscroll" id="ms">
      <div class="mgrid" id="grid"></div>
    </div>
    <div class="scroll-indicator-track" id="mTrack" style="opacity:0"><div class="scroll-indicator-thumb" id="mThumb"></div></div>
  </div>
</div>

<!-- Bottom nav — fixed, same as React BottomNav -->
<div class="bnav">
  <a href="index.html" class="ni on"><i class="fas fa-store"></i><span>МАРКЕТ</span></a>
  <a href="profile.html" class="ni"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
</div>

<script>
(function(){
'use strict';

/* ── DATA (same as nftData.ts) ── */
const GB='https://raw.githubusercontent.com/ur12163008-bot/yeter-game/main/nft/';
const NAMES=["Artisan Brick","B-Day Candle","Berry Box","Big Year","Bling Binky","Bonded Ring","Bow Tie","Bunny Muffin","Candy Cane","Clover Pin","Cookie Heart","Crystal Ball","Cupid Charm","Desk Calendar","Diamond Ring","Easter Egg","Electric Skull","Eternal Candle","Eternal Rose","Evil Eye","Faith Amulet","Flying Broom","Fresh Socks","Gem Signet","Genie Lamp","Ginger Cookie","Hanging Star","Heroic Helmet","Hex Pot","Holiday Drink","Homemade Cake","Hypno Lollipop","Ice Cream","Input Key","Instant Ramen","Ionic Dryer","Jack-in-the-Box","Jelly Bunny","Jester Hat","Jingle Bells","Jolly Chimp","Joyful Bundle","Khabibs Papakha","Kissed Frog","Light Sword","Lol Pop","Lon Gem","Love Candle","Love Potion","Low Rider","Lunar Snake","Lush Bouquet","Mad Pumpkin","Magic Potion","Mini Oscar","Money Pot","Moon Pendant","Mousse Cake","Nail Bracelet","Neko Helmet","Perfume Bottle","Pet Snake","Pretty Posy","Rare Bird","Record Player","Restless Jar","Sakura Flower","Santa Hat","Sharp Tongue","Signet Ring","Skull Flower","Sky Stilettos","Sleigh Bell","Snake Box","Snoop Cigar","Snow Globe","Snow Mittens","Spiced Wine","Spring Basket","Spy Agaric","Star Notepad","Stellar Rocket","Swag Bag","Swiss Watch","Tama Gadget","Top Hat","Toy Bear","Trapped Heart","UFC Strike","Valentine Box","Victory Medal","Vintage Cigar","Voodoo Doll","Westside Sign","Whip Cupcake","Winter Wreath","Witch Hat","Xmas Stocking"];
const PRICES=[215,87,342,163,421,78,290,155,380,99,265,440,118,330,195,275,410,143,388,222,157,300,93,350,178,425,112,255,395,168,310,84,230,445,205,137,365,192,285,96,307,89,241,390,174,315,98,258,416,139,362,213,292,428,166,335,103,276,449,188,302,132,379,221,146,398,117,263,434,181,327,95,283,412,158,340,119,271,447,136];
const PATTERNS=["Классический","Современный","Винтажный","Неоновый"];
const BGROUNDS=["Темный","Светлый","Градиент","Звездный"];
const MODELS=["2D","3D","Pixel","Vector"];
const SELLERS=[{id:1001,name:'Алексей Смирнов',username:'a.smirnov',avatar:'А'},{id:1002,name:'Мария Иванова',username:'m.ivanova',avatar:'М'},{id:1003,name:'Дмитрий Козлов',username:'d.kozlov',avatar:'Д'},{id:1004,name:'Анна Новикова',username:'a.novikova',avatar:'А'},{id:1005,name:'Иван Попов',username:'i.popov',avatar:'И'},{id:1006,name:'Екатерина Соколова',username:'e.sokolova',avatar:'Е'},{id:1007,name:'Михаил Лебедев',username:'m.lebedev',avatar:'М'},{id:1008,name:'Ольга Морозова',username:'o.morozova',avatar:'О'},{id:1009,name:'Николай Петров',username:'n.petrov',avatar:'Н'},{id:1010,name:'Светлана Волкова',username:'s.volkova',avatar:'С'}];
const IMG_PATTERN={"Классический":"https://images.unsplash.com/photo-1519741497674-611481863552?w=80&h=80&fit=crop&auto=format","Современный":"https://images.unsplash.com/photo-1464802686167-b939a6910659?w=80&h=80&fit=crop&auto=format","Винтажный":"https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?w=80&h=80&fit=crop&auto=format","Неоновый":"https://images.unsplash.com/photo-1518235506717-e1ed3306a89b?w=80&h=80&fit=crop&auto=format"};
const IMG_BG={"Темный":"https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=80&h=80&fit=crop&auto=format","Светлый":"https://images.unsplash.com/photo-1579547621113-e4bb2a19bdd6?w=80&h=80&fit=crop&auto=format","Градиент":"https://images.unsplash.com/photo-1620121692029-d088224ddc74?w=80&h=80&fit=crop&auto=format","Звездный":"https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=80&h=80&fit=crop&auto=format"};
const IMG_MODEL={"2D":"https://images.unsplash.com/photo-1607706189992-eae578626c86?w=80&h=80&fit=crop&auto=format","3D":"https://images.unsplash.com/photo-1617791160505-6f00504e3519?w=80&h=80&fit=crop&auto=format","Pixel":"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=80&h=80&fit=crop&auto=format","Vector":"https://images.unsplash.com/photo-1461344577544-4e5dc9487184?w=80&h=80&fit=crop&auto=format"};

/* Seed random prices for filter display (same logic as FilterPanel line 88) */
const SEED_PRICES={};NAMES.forEach(n=>{SEED_PRICES[n]=Math.round(Math.random()*300+80)});

/* ── STORAGE — same keys as React ── */
const BAL_K='nft_balance', MKT_K='nft_market_listings_v2', INV_K='nft_inventory';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const lsSet=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const getBal=()=>parseInt(localStorage.getItem(BAL_K)||'')||5000;
const setBal=n=>{localStorage.setItem(BAL_K,String(n));renderBal()};
const renderBal=()=>document.getElementById('bv').textContent=getBal().toLocaleString('ru-RU');
const getMkt=()=>lsGet(MKT_K)||[];
const setMkt=d=>lsSet(MKT_K,d);
const getInv=()=>lsGet(INV_K)||[];
const setInv=d=>lsSet(INV_K,d);

/* ── SEED MARKET (same as seedMarketIfEmpty) ── */
function seed(){
  if(getMkt().length>0)return;
  setMkt(NAMES.map((name,i)=>{
    const u=SELLERS[i%SELLERS.length];
    return{id:i+1,nftName:name,price:PRICES[i%PRICES.length],image:GB+encodeURIComponent(name+'.png'),
      sellerId:u.id,sellerName:u.name,sellerUsername:'@'+u.username,sellerAvatar:u.avatar,
      pattern:PATTERNS[i%4],background:BGROUNDS[i%4],model:MODELS[i%4],listedAt:Date.now()-Math.random()*86400000};
  }));
}

/* ── HELPERS ── */
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── TOAST ── */
const toastEl=document.getElementById('toast');let tT;
const toast=(msg,err=false)=>{clearTimeout(tT);toastEl.textContent=msg;toastEl.className='toast'+(err?' err':'')+' show';tT=setTimeout(()=>toastEl.classList.remove('show'),2400)};

/* ── TELEGRAM USER ── */
const tg=window.Telegram?.WebApp;
let U={fullName:'Игрок',username:'@player',avatarChar:'И',photo:null};
if(tg?.initDataUnsafe?.user){
  const u=tg.initDataUnsafe.user;
  const fn=u.first_name||'Игрок',ln=u.last_name||'';
  U.fullName=(fn+' '+ln).trim();
  U.username=u.username?'@'+u.username:'@'+fn.toLowerCase();
  U.avatarChar=fn[0].toUpperCase();
  U.photo=u.photo_url||null;
}
document.getElementById('fn').textContent=U.fullName;
document.getElementById('un').textContent=U.username;
const avEl=document.getElementById('av');
if(U.photo){avEl.innerHTML=`<img src="${U.photo}" alt="">`}else{avEl.textContent=U.avatarChar}
renderBal();

/* ── IMAGE CACHE (same as imageCache.ts) ── */
const cache={};let allLoaded=false;
(function startCache(){
  let done=0;const total=NAMES.length;
  NAMES.forEach(n=>{const s=localStorage.getItem('img_c_'+n);if(s){cache[n]=s;done++}});
  if(done>=total){allLoaded=true;return}
  const pending=NAMES.filter(n=>!cache[n]);
  let idx=0;
  function batch(){
    if(idx>=pending.length){allLoaded=true;if(fpOpen&&curTab==='collection')renderFpContent();return}
    const sl=pending.slice(idx,idx+5);idx+=5;
    Promise.all(sl.map(n=>fetch(GB+encodeURIComponent(n+'.png')).then(r=>r.blob()).then(b=>new Promise(res=>{
      const fr=new FileReader();
      fr.onloadend=()=>{cache[n]=fr.result;try{localStorage.setItem('img_c_'+n,fr.result)}catch{}done++;if(done>=total){allLoaded=true;if(fpOpen&&curTab==='collection')renderFpContent()}res()};
      fr.onerror=()=>{done++;res()};
      fr.readAsDataURL(b);
    })).catch(()=>{done++;}))).then(()=>setTimeout(batch,60));
  }
  batch();
})();
const imgUrl=n=>cache[n]||GB+encodeURIComponent(n+'.png');

/* ── DEPOSIT ── */
const depOv=document.getElementById('depOv'),depIn=document.getElementById('depIn'),depAmt=document.getElementById('depAmt');
let depSel=0;
document.getElementById('plus').onclick=()=>{depIn.value='';depAmt.textContent='0 ⭐';depSel=0;document.querySelectorAll('.qa').forEach(q=>q.classList.remove('sel'));depOv.classList.add('show')};
document.getElementById('depX').onclick=()=>depOv.classList.remove('show');
depOv.onclick=e=>{if(e.target===depOv)depOv.classList.remove('show')};
document.querySelectorAll('.qa').forEach(q=>{q.onclick=()=>{depSel=+q.dataset.a;document.querySelectorAll('.qa').forEach(x=>x.classList.remove('sel'));q.classList.add('sel');depIn.value=q.dataset.a;depAmt.textContent=q.dataset.a+' ⭐'}});
depIn.oninput=e=>{const v=e.target.value.replace(/\D/g,'');e.target.value=v;depSel=0;depAmt.textContent=(v||'0')+' ⭐';document.querySelectorAll('.qa').forEach(q=>q.classList.remove('sel'))};
document.getElementById('depBtn').onclick=()=>{
  const a=Math.min(100000,Math.max(0,parseInt(depIn.value)||0));
  if(!a)return;setBal(getBal()+a);toast('✅ Баланс пополнен на '+a+' ⭐');depOv.classList.remove('show');
};

/* ── FILTER STATE ── */
let fSel={collection:[],model:[],background:[],pattern:[]};
let srchVal='',sortDir='asc';
let fpOpen=false,curTab='collection',fpSortDir='asc',fpSrch='',modelNft=null;

/* ── MARKET RENDER ── */
function applyFilt(lst){
  let r=[...lst];
  if(fSel.collection.length)r=r.filter(x=>fSel.collection.includes(x.nftName));
  if(fSel.model.length)r=r.filter(x=>fSel.model.includes(x.model));
  if(fSel.background.length)r=r.filter(x=>fSel.background.includes(x.background));
  if(fSel.pattern.length)r=r.filter(x=>fSel.pattern.includes(x.pattern));
  if(srchVal)r=r.filter(x=>x.nftName.toLowerCase().includes(srchVal.toLowerCase()));
  r.sort((a,b)=>sortDir==='asc'?a.price-b.price:b.price-a.price);
  return r;
}

function renderMkt(){
  const items=applyFilt(getMkt());
  const g=document.getElementById('grid');
  if(!items.length){
    g.innerHTML=`<div class="empty"><i class="fas fa-store" style="font-size:28px;display:block;margin-bottom:10px;opacity:.5"></i>Товаров не найдено</div>`;
    updateMS();return;
  }
  g.innerHTML=items.map(it=>`
    <div class="mcard" onclick="openBuy(${it.id})">
      <img src="${imgUrl(it.nftName)}" alt="${esc(it.nftName)}" loading="lazy" onerror="this.style.opacity='.25'">
      <div class="mc-name">${esc(it.nftName)}</div>
      <div class="mc-seller"><div class="mc-av">${esc(it.sellerAvatar)}</div><span class="mc-sn">${esc(it.sellerName)}</span></div>
      <div class="mc-price">⭐ ${it.price}</div>
    </div>`).join('');
  updateMS();
}

seed();renderMkt();

/* ── MARKET SCROLLBAR ── */
const msEl=document.getElementById('ms'),mTrack=document.getElementById('mTrack'),mThumb=document.getElementById('mThumb');
function updateMS(){requestAnimationFrame(()=>{
  const r=msEl.clientHeight/msEl.scrollHeight;
  if(r>=1){mTrack.style.opacity='0';return}
  mTrack.style.opacity='1';
  const tH=msEl.clientHeight-16;const h=Math.max(24,tH*r);
  const t=8+(msEl.scrollTop/(msEl.scrollHeight-msEl.clientHeight))*(tH-h);
  mThumb.style.height=h+'px';mThumb.style.top=t+'px';
})}
msEl.addEventListener('scroll',updateMS,{passive:true});new ResizeObserver(updateMS).observe(msEl);

/* ── SEARCH / SORT ── */
document.getElementById('srch').oninput=e=>{srchVal=e.target.value;renderMkt()};
document.getElementById('sortBtn').onclick=()=>{
  sortDir=sortDir==='asc'?'desc':'asc';
  document.getElementById('sortI').className='fas fa-arrow-'+(sortDir==='asc'?'up':'down');
  renderMkt();
};

/* ── BUY MODAL ── */
const buyOv=document.getElementById('buyOv');let curItem=null;
window.openBuy=id=>{
  const it=getMkt().find(x=>x.id===id);if(!it)return;curItem=it;
  document.getElementById('bImg').src=imgUrl(it.nftName);
  document.getElementById('bName').textContent=it.nftName;
  document.getElementById('bSeller').innerHTML=`<div class="bm-sav">${esc(it.sellerAvatar)}</div><span style="font-size:13px;font-weight:600">${esc(it.sellerName)}</span>`;
  document.getElementById('bTags').innerHTML=[it.model,it.background,it.pattern].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  document.getElementById('bPrice').textContent='⭐ '+it.price;
  const btn=document.getElementById('buyBtn');const bal=getBal();
  if(bal<it.price){btn.textContent='Не хватает '+(it.price-bal)+' ⭐';btn.disabled=true}
  else{btn.textContent='Купить';btn.disabled=false}
  buyOv.classList.add('show');
};
document.getElementById('buyX').onclick=()=>buyOv.classList.remove('show');
buyOv.onclick=e=>{if(e.target===buyOv)buyOv.classList.remove('show')};
document.getElementById('buyBtn').onclick=()=>{
  if(!curItem)return;
  const bal=getBal();
  if(bal<curItem.price){toast('❌ Недостаточно звёзд! Нужно '+curItem.price+' ⭐',true);return}
  setBal(bal-curItem.price);
  setMkt(getMkt().filter(x=>x.id!==curItem.id));
  const inv=getInv();
  inv.push({id:Date.now()+Math.random(),name:curItem.nftName,price:curItem.price,image:curItem.image,purchaseTime:Date.now()});
  setInv(inv);
  toast('✅ Вы купили «'+curItem.nftName+'» за '+curItem.price+' ⭐');
  buyOv.classList.remove('show');renderMkt();curItem=null;
};

/* ── FILTER PANEL ── */
const fpEl=document.getElementById('fp');
function updateFiltBtn(){
  const h=Object.values(fSel).some(a=>a.length>0);
  const b=document.getElementById('filtBtn');
  b.style.borderColor=h?'#b87aff':'rgba(184,122,255,.28)';
  b.style.boxShadow=h?'0 0 10px rgba(184,122,255,.25)':'none';
}
function updateBadges(){
  document.querySelectorAll('.fp-tab').forEach(t=>{
    const k=t.dataset.t;const c=fSel[k].length;
    let bd=t.querySelector('.fp-bdg');
    if(c>0){if(!bd){bd=document.createElement('span');bd.className='fp-bdg';t.appendChild(bd)}bd.textContent=c}
    else if(bd)bd.remove();
  });
  const tot=Object.values(fSel).reduce((s,a)=>s+a.length,0);
  document.getElementById('fpReset').style.display=tot>0?'flex':'none';
}
function toggle(key,val){
  const a=fSel[key];const i=a.indexOf(val);
  if(i>=0)a.splice(i,1);else a.push(val);
  updateFiltBtn();updateBadges();renderFpContent();renderMkt();
}
window.toggle=toggle;
window.setMNft=n=>{modelNft=n;if(!n){document.getElementById('fpSrch').value='';fpSrch='';document.getElementById('fpSrchX').style.display='none'}renderFpContent()};

document.getElementById('filtBtn').onclick=()=>{fpOpen=true;fpEl.classList.add('open');renderFpContent()};
document.getElementById('fpX').onclick=()=>{fpOpen=false;fpEl.classList.remove('open')};
document.querySelectorAll('.fp-tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.fp-tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');curTab=t.dataset.t;modelNft=null;
    document.getElementById('fpSrch').value='';fpSrch='';
    document.getElementById('fpSrchX').style.display='none';
    document.getElementById('fpSortBtn').style.display=curTab==='collection'?'flex':'none';
    renderFpContent();
  };
});
document.getElementById('fpSortBtn').onclick=()=>{
  fpSortDir=fpSortDir==='asc'?'desc':'asc';
  document.getElementById('fpSortI').className='fas fa-arrow-'+(fpSortDir==='asc'?'up':'down');
  renderFpContent();
};
document.getElementById('fpSrch').oninput=e=>{
  fpSrch=e.target.value;
  document.getElementById('fpSrchX').style.display=fpSrch?'inline':'none';
  renderFpContent();
};
document.getElementById('fpSrchX').onclick=()=>{
  document.getElementById('fpSrch').value='';fpSrch='';
  document.getElementById('fpSrchX').style.display='none';
  renderFpContent();
};
document.getElementById('fpReset').onclick=()=>{
  fSel={collection:[],model:[],background:[],pattern:[]};
  updateFiltBtn();updateBadges();renderFpContent();renderMkt();
};

function chkHtml(sel){return`<div class="fi-chk${sel?' on':''}${sel?'"><i class="fas fa-check"></i>':">"}</div>`}

function renderFpContent(){
  const sc=document.getElementById('fpScr');
  if(curTab==='collection'){
    if(!allLoaded){sc.innerHTML='<div class="fp-load"><span class="loading-spinner"></span>Загрузка коллекции...</div>';return}
    let opts=[...NAMES];
    if(fpSrch)opts=opts.filter(o=>o.toLowerCase().includes(fpSrch.toLowerCase()));
    opts=fpSortDir==='asc'?[...opts].sort():[...opts].sort().reverse();
    sc.innerHTML=opts.map(n=>{
      const s=fSel.collection.includes(n);
      return`<div class="fi${s?' sel':''}" onclick="toggle('collection','${esc(n)}')">
        <img src="${imgUrl(n)}" loading="lazy" onerror="this.style.opacity='.2'">
        <div class="fi-info"><div class="fi-name">${esc(n)}</div><div class="fi-sub">⭐ ${SEED_PRICES[n]}</div></div>
        ${chkHtml(s)}
      </div>`;
    }).join('');
  } else if(curTab==='model'){
    if(!modelNft){
      const items=fSel.collection.length?NAMES.filter(n=>fSel.collection.includes(n)):NAMES;
      const filt=fpSrch?items.filter(n=>n.toLowerCase().includes(fpSrch.toLowerCase())):items;
      sc.innerHTML=filt.map(n=>`
        <div class="fi" onclick="setMNft('${esc(n)}')">
          <img src="${imgUrl(n)}" loading="lazy" onerror="this.style.opacity='.2'">
          <div class="fi-info"><div class="fi-name">${esc(n)}</div></div>
          <i class="fas fa-chevron-right fi-arr"></i>
        </div>`).join('');
    } else {
      sc.innerHTML=`<div class="fi-back" onclick="setMNft(null)"><i class="fas fa-arrow-left"></i> Назад</div>
        <div class="fi-mhdr"><img src="${imgUrl(modelNft)}" onerror="this.style.opacity='.2'"><span>${esc(modelNft)}</span></div>`+
        MODELS.map(m=>{const s=fSel.model.includes(m);return`
          <div class="fi${s?' sel':''}" onclick="toggle('model','${m}')">
            <img src="${IMG_MODEL[m]}" loading="lazy">
            <div class="fi-info"><div class="fi-name">${m}</div><div class="fi-sub" style="color:rgba(255,255,255,.4)">Модель</div></div>
            ${chkHtml(s)}
          </div>`;}).join('');
    }
  } else if(curTab==='background'){
    const opts=fpSrch?BGROUNDS.filter(o=>o.toLowerCase().includes(fpSrch.toLowerCase())):BGROUNDS;
    sc.innerHTML=opts.map(b=>{const s=fSel.background.includes(b);return`
      <div class="fi${s?' sel':''}" onclick="toggle('background','${esc(b)}')">
        <img src="${IMG_BG[b]}" loading="lazy">
        <div class="fi-info"><div class="fi-name">${esc(b)}</div></div>
        ${chkHtml(s)}
      </div>`;}).join('');
  } else {
    const opts=fpSrch?PATTERNS.filter(o=>o.toLowerCase().includes(fpSrch.toLowerCase())):PATTERNS;
    sc.innerHTML=opts.map(p=>{const s=fSel.pattern.includes(p);return`
      <div class="fi${s?' sel':''}" onclick="toggle('pattern','${esc(p)}')">
        <img src="${IMG_PATTERN[p]}" loading="lazy">
        <div class="fi-info"><div class="fi-name">${esc(p)}</div></div>
        ${chkHtml(s)}
      </div>`;}).join('');
  }
  updateFpSB();
}

/* fp scrollbar */
const fpScr=document.getElementById('fpScr'),fpTrack=document.getElementById('fpTrack'),fpThumb=document.getElementById('fpThumb');
function updateFpSB(){requestAnimationFrame(()=>{
  const r=fpScr.clientHeight/fpScr.scrollHeight;
  if(r>=1){fpTrack.style.opacity='0';return}
  fpTrack.style.opacity='1';
  const tH=fpScr.clientHeight-16;const h=Math.max(24,tH*r);
  const t=8+(fpScr.scrollTop/(fpScr.scrollHeight-fpScr.clientHeight))*(tH-h);
  fpThumb.style.height=h+'px';fpThumb.style.top=t+'px';
})}
fpScr.addEventListener('scroll',updateFpSB,{passive:true});new ResizeObserver(updateFpSB).observe(fpScr);

})();
</script>
</body>
