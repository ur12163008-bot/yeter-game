<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Market · NFT Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.5;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            padding-bottom: 100px;
            min-height: 100vh;
            z-index: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .nft-modal {
            max-width: 320px;
            width: 85%;
            background: #1a1a24;
            border-radius: 30px;
            padding: 30px 20px 25px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            animation: modalAppear 0.15s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .nft-modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            color: #b87aff;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            z-index: 10;
            line-height: 1;
            background: none;
            border: none;
            padding: 8px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nft-modal-close:active {
            color: #d0a0ff;
            transform: scale(0.95);
        }

        .nft-modal-image {
            width: 140px;
            height: 140px;
            border-radius: 25px;
            margin: 5px auto 15px;
            display: block;
            object-fit: cover;
            background: #2a2a3a;
            border: 2px solid rgba(184, 122, 255, 0.2);
        }

        .nft-modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #a0a0b0;
            text-align: center;
            margin-bottom: 8px;
        }

        .nft-modal-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .nft-modal-price .price-icon {
            font-size: 22px;
            color: #ffd700;
        }

        .nft-modal-buy {
            background: #6a0dad;
            border: none;
            border-radius: 60px;
            padding: 16px;
            width: 100%;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.05s ease, transform 0.05s ease;
            text-align: center;
        }

        .nft-modal-buy:active {
            background: #7b1db5;
            transform: scale(0.97);
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 20px 20px;
            gap: 12px;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #6a0dad;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            text-transform: uppercase;
        }

        .name-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1;
        }

        .fullname {
            font-size: 18px;
            font-weight: 700;
            color: white;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .username {
            font-size: 15px;
            color: #8e98a3;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .balance-block {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 30px;
            padding: 4px 12px 4px 14px;
            flex-shrink: 0;
        }

        .balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .puzzle-icon {
            font-size: 14px;
            color: #ffd700;
        }

        .plus-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.05s ease;
            line-height: 1;
            min-width: 28px;
            min-height: 28px;
        }

        .plus-btn:active {
            background: rgba(106, 13, 173, 0.6);
            transform: scale(0.95);
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 20px 20px;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e98a3;
            font-size: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 10px 16px 10px 40px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: white;
            outline: none;
        }

        .search-input::placeholder {
            color: #8e98a3;
            font-weight: 400;
        }

        .filter-btn {
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            min-width: 44px;
            min-height: 44px;
        }

        .filter-btn:active {
            background: rgba(106, 13, 173, 0.3);
            transform: scale(0.95);
        }

        .nft-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 0 20px 30px;
        }

        .nft-card {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 24px;
            padding: 15px 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: border 0.05s ease, background 0.05s ease;
        }

        .nft-card:active {
            transform: scale(0.97);
            border-color: #b87aff;
            background: rgba(20, 25, 35, 0.9);
        }

        .nft-image {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 10px;
            background: #2a1e3a;
            border: 1px solid rgba(184, 122, 255, 0.2);
        }

        .nft-name {
            font-size: 14px;
            font-weight: 600;
            color: #f0f0f0;
            text-align: center;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 4px;
        }

        .price-frame {
            background: linear-gradient(145deg, #2a1e3a, #1a1028);
            border: 1px solid rgba(155, 77, 255, 0.3);
            border-radius: 30px;
            padding: 6px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 0 #0f0a18;
        }

        .nft-price {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            font-weight: 700;
            color: #b87aff;
        }

        .price-icon {
            font-size: 14px;
            color: #ffd700;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-radius: 35px;
            border: 1px solid #2a1e3a;
            margin-bottom: 16px;
            width: calc(100% - 40px);
            left: 20px;
            right: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            background: transparent;
            border: none;
            min-width: 80px;
            min-height: 44px;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.3);
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 20px;
            color: #8e98a3;
            margin-bottom: 2px;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .nav-item.active {
            background: rgba(106, 13, 173, 0.25);
            color: #b87aff;
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item.active span {
            color: #b87aff;
        }

        @media (max-width: 440px) {
            .app {
                max-width: 100%;
            }
            
            .nft-image {
                width: 85px;
                height: 85px;
            }
            
            .nft-modal {
                width: 90%;
            }
            
            .nft-modal-image {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="modal-overlay" id="nftModal">
        <div class="nft-modal">
            <div class="nft-modal-close" id="closeNftModal">✕</div>
            <img src="" alt="" class="nft-modal-image" id="modalNftImage">
            <div class="nft-modal-title" id="modalNftTitle"></div>
            <div class="nft-modal-price">
                <span class="price-icon">🧩</span>
                <span id="modalNftPriceValue"></span>
            </div>
            <button class="nft-modal-buy" id="buyNftBtn">Купить</button>
        </div>
    </div>

    <div class="app">
        <div class="profile-header">
            <div class="profile-left">
                <div class="avatar" id="avatar">A</div>
                <div class="name-box">
                    <span class="fullname" id="fullName">Алексей Иванов</span>
                    <span class="username" id="username">@alexey</span>
                </div>
            </div>
            <div class="balance-block">
                <div class="balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceValue">0</span>
                </div>
                <div class="plus-btn" id="plusBtn">+</div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Поиск по названию" id="searchInput">
            </div>
            <div class="filter-btn" id="filterBtn">
                <i class="fas fa-sliders-h"></i>
            </div>
        </div>

        <div class="nft-grid" id="nftGrid">
            <div class="nft-card" data-name="Neko Helmet" data-price="259" data-image="nft/Neko Helmet.png">
                <img src="nft/Neko Helmet.png" alt="Neko Helmet" class="nft-image" onerror="this.src='https://via.placeholder.com/100/6a0dad/ffffff?text=Neko'">
                <div class="nft-name">Neko Helmet</div>
                <div class="price-frame">
                    <div class="nft-price">
                        <span class="price-icon">🧩</span>
                        <span>259</span>
                    </div>
                </div>
            </div>

            <div class="nft-card" data-name="Jingle Bells" data-price="69" data-image="nft/Jingle Bells.png">
                <img src="nft/Jingle Bells.png" alt="Jingle Bells" class="nft-image" onerror="this.src='https://via.placeholder.com/100/6a0dad/ffffff?text=Jingle'">
                <div class="nft-name">Jingle Bells</div>
                <div class="price-frame">
                    <div class="nft-price">
                        <span class="price-icon">🧩</span>
                        <span>69</span>
                    </div>
                </div>
            </div>

            <div class="nft-card" data-name="Lol Pop" data-price="45" data-image="nft/Lol Pop.png">
                <img src="nft/Lol Pop.png" alt="Lol Pop" class="nft-image" onerror="this.src='https://via.placeholder.com/100/6a0dad/ffffff?text=Lol+Pop'">
                <div class="nft-name">Lol Pop</div>
                <div class="price-frame">
                    <div class="nft-price">
                        <span class="price-icon">🧩</span>
                        <span>45</span>
                    </div>
                </div>
            </div>

            <div class="nft-card" data-name="Tam Gadget" data-price="189" data-image="nft/Tam Gadget.png">
                <img src="nft/Tam Gadget.png" alt="Tam Gadget" class="nft-image" onerror="this.src='https://via.placeholder.com/100/6a0dad/ffffff?text=Tam+Gadget'">
                <div class="nft-name">Tam Gadget</div>
                <div class="price-frame">
                    <div class="nft-price">
                        <span class="price-icon">🧩</span>
                        <span>189</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="#" class="nav-item active" id="navMarket"><i class="fas fa-store"></i><span>МАРКЕТ</span></a>
            <a href="profle.html" class="nav-item" id="navProfile"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'nft_balance';
            const INVENTORY_KEY = 'nft_inventory';

            function getBalance() {
                const balance = localStorage.getItem(STORAGE_KEY);
                return balance ? parseInt(balance, 10) : 500;
            }

            function updateBalanceDisplay() {
                const balanceSpan = document.getElementById('balanceValue');
                if (balanceSpan) {
                    balanceSpan.innerText = getBalance();
                }
            }

            function deductBalance(amount) {
                const currentBalance = getBalance();
                if (currentBalance >= amount) {
                    const newBalance = currentBalance - amount;
                    localStorage.setItem(STORAGE_KEY, newBalance);
                    updateBalanceDisplay();
                    localStorage.setItem('balance_updated', Date.now().toString());
                    setTimeout(() => localStorage.removeItem('balance_updated'), 100);
                    return true;
                }
                return false;
            }

            function addToInventory(name, price, image) {
                const inventory = JSON.parse(localStorage.getItem(INVENTORY_KEY) || '[]');
                inventory.push({
                    name: name,
                    price: price,
                    image: image,
                    id: Date.now() + Math.random()
                });
                localStorage.setItem(INVENTORY_KEY, JSON.stringify(inventory));
                localStorage.setItem('inventory_updated', Date.now().toString());
                setTimeout(() => localStorage.removeItem('inventory_updated'), 100);
            }

            function initStars() {
                const starsContainer = document.getElementById('stars');
                if (!starsContainer) return;
                starsContainer.innerHTML = '';
                for (let i = 0; i < 20; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.opacity = (0.2 + Math.random() * 0.3).toString();
                    starsContainer.appendChild(star);
                }
            }

            function getTelegramData() {
                const tg = window.Telegram?.WebApp;
                const cachedData = sessionStorage.getItem('tg_user_data');
                if (cachedData) {
                    return JSON.parse(cachedData);
                }
                let firstName = 'Игрок';
                let lastName = '';
                let tgUsername = '';
                if (tg && tg.initDataUnsafe?.user) {
                    const user = tg.initDataUnsafe.user;
                    firstName = user.first_name || 'Игрок';
                    lastName = user.last_name || '';
                    tgUsername = user.username ? '@' + user.username : '';
                    const userData = { firstName, lastName, tgUsername };
                    sessionStorage.setItem('tg_user_data', JSON.stringify(userData));
                    return userData;
                }
                return { firstName, lastName, tgUsername };
            }

            function init() {
                initStars();
                const userData = getTelegramData();
                const fullName = (userData.firstName + ' ' + userData.lastName).trim();
                document.getElementById('fullName').innerText = fullName;
                const usernameEl = document.getElementById('username');
                if (userData.tgUsername) {
                    usernameEl.innerText = userData.tgUsername;
                } else {
                    usernameEl.innerText = '@' + userData.firstName.toLowerCase().replace(/\s+/g, '');
                }
                const avatarDiv = document.getElementById('avatar');
                const tg = window.Telegram?.WebApp;
                if (tg && tg.initDataUnsafe?.user?.photo_url) {
                    const photoUrl = tg.initDataUnsafe.user.photo_url;
                    avatarDiv.style.backgroundImage = `url('${photoUrl}')`;
                    avatarDiv.style.backgroundSize = 'cover';
                    avatarDiv.innerText = '';
                } else {
                    avatarDiv.innerText = userData.firstName.charAt(0).toUpperCase();
                }
                updateBalanceDisplay();
                initEventHandlers();
            }

            function initEventHandlers() {
                document.getElementById('plusBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                });

                document.getElementById('filterBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('Фильтры NFT подарков (скоро)');
                });

                const searchInput = document.getElementById('searchInput');
                let searchTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        const searchTerm = e.target.value.toLowerCase();
                        const cards = document.querySelectorAll('.nft-card');
                        cards.forEach(card => {
                            const name = card.querySelector('.nft-name').innerText.toLowerCase();
                            if (name.includes(searchTerm)) {
                                card.style.display = 'flex';
                            } else {
                                card.style.display = 'none';
                            }
                        });
                    }, 50);
                });

                const modalOverlay = document.getElementById('nftModal');
                const closeModal = document.getElementById('closeNftModal');
                const modalImage = document.getElementById('modalNftImage');
                const modalTitle = document.getElementById('modalNftTitle');
                const modalPrice = document.getElementById('modalNftPriceValue');
                const buyBtn = document.getElementById('buyNftBtn');

                document.querySelectorAll('.nft-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        e.preventDefault();
                        const name = card.dataset.name;
                        const price = card.dataset.price;
                        const image = card.dataset.image;
                        modalImage.src = image;
                        modalImage.alt = name;
                        modalTitle.innerText = name;
                        modalPrice.innerText = price;
                        modalOverlay.classList.add('active');
                    });
                });

                closeModal.addEventListener('click', () => {
                    modalOverlay.classList.remove('active');
                });

                modalOverlay.addEventListener('click', (e) => {
                    if (e.target === modalOverlay) {
                        modalOverlay.classList.remove('active');
                    }
                });

                buyBtn.addEventListener('click', () => {
                    const name = modalTitle.innerText;
                    const price = parseInt(modalPrice.innerText, 10);
                    const image = modalImage.src;
                    if (getBalance() >= price) {
                        deductBalance(price);
                        addToInventory(name, price, image);
                        alert(`✅ Подарок "${name}" куплен!`);
                        modalOverlay.classList.remove('active');
                    } else {
                        alert('❌ Недостаточно средств!');
                    }
                });

                const navMarket = document.getElementById('navMarket');
                const navProfile = document.getElementById('navProfile');

                navMarket.addEventListener('click', (e) => {
                    e.preventDefault();
                    navMarket.classList.add('active');
                    navProfile.classList.remove('active');
                });

                navProfile.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = 'profle.html';
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
