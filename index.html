<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Market · NFT Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.3;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            padding-bottom: 100px;
            min-height: 100vh;
            z-index: 1;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(0, 200, 83, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            transform: translateX(150%);
            transition: transform 0.2s ease;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
        .notification.show {
            transform: translateX(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .deposit-modal {
            max-width: 360px;
            width: 90%;
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(40px);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            padding: 28px 20px 24px;
            position: relative;
            animation: slideUp 0.25s ease;
        }

        .modal-close {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #b87aff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: all 0.1s ease;
        }

        .modal-close:active {
            background: rgba(184, 122, 255, 0.2);
            transform: scale(0.92);
        }

        .deposit-title {
            font-size: 24px;
            font-weight: 600;
            color: white;
            text-align: center;
            margin-bottom: 24px;
        }

        .amount-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 14px 18px;
            font-size: 18px;
            color: white;
            outline: none;
            margin-bottom: 18px;
        }

        .amount-input:focus {
            border-color: rgba(184, 122, 255, 0.6);
        }

        .deposit-button {
            background: rgba(106, 13, 173, 0.7);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(184, 122, 255, 0.4);
            border-radius: 60px;
            padding: 14px 22px;
            width: 100%;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .deposit-button:active {
            transform: scale(0.97);
        }

        .deposit-button span:last-child {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 30px;
        }

        .quick-amounts {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .quick-amount {
            background: rgba(106, 13, 173, 0.2);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(184, 122, 255, 0.3);
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #b87aff;
            cursor: pointer;
            transition: all 0.1s ease;
            min-width: 70px;
            text-align: center;
        }

        .quick-amount:active {
            background: rgba(106, 13, 173, 0.4);
            transform: scale(0.95);
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 20px 20px;
            gap: 12px;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            background: rgba(106, 13, 173, 0.5);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            color: white;
            border: 0.5px solid rgba(184, 122, 255, 0.5);
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .name-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1;
        }

        .fullname {
            font-size: 18px;
            font-weight: 600;
            color: white;
            line-height: 1.3;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .username {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .balance-block {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(138, 43, 226, 0.3);
            border-radius: 40px;
            padding: 6px 10px 6px 16px;
            flex-shrink: 0;
        }

        .balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            font-size: 15px;
            color: white;
        }

        .puzzle-icon {
            font-size: 14px;
            color: #ffd700;
        }

        .plus-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(138, 43, 226, 0.5);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .plus-btn:active {
            background: rgba(106, 13, 173, 0.6);
            transform: scale(0.92);
        }

        .market-frame {
            margin: 0 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            border: 0.5px solid rgba(138, 43, 226, 0.2);
            border-radius: 32px;
            padding: 18px;
        }

        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 12px 16px;
        }

        .search-box i {
            color: rgba(255, 255, 255, 0.5);
            margin-right: 10px;
            font-size: 16px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(184, 122, 255, 0.3);
            border-radius: 30px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #b87aff;
            font-size: 18px;
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        .sort-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(184, 122, 255, 0.3);
            border-radius: 30px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #b87aff;
            font-size: 18px;
        }

        .sort-btn:active {
            transform: scale(0.95);
        }

        .filter-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(40px);
            border-radius: 32px 32px 0 0;
            padding: 20px 20px 30px;
            z-index: 1500;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-top: 0.5px solid rgba(184, 122, 255, 0.3);
        }

        .filter-modal.active {
            transform: translateY(0);
        }

        .filter-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .filter-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: white;
        }

        .filter-close {
            position: absolute;
            right: 0;
            color: #b87aff;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .filter-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-tab {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(184, 122, 255, 0.3);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .filter-tab:active {
            transform: scale(0.96);
        }

        .filter-tab.active {
            background: rgba(106, 13, 173, 0.5);
            border-color: #b87aff;
            color: white;
        }

        .filter-search {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .filter-search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 12px 16px;
        }

        .filter-search-box i {
            color: rgba(255, 255, 255, 0.5);
            margin-right: 10px;
        }

        .filter-search-box input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        .filter-sort-arrow {
            background: rgba(255, 255, 255, 0.08);
            border: 0.5px solid rgba(184, 122, 255, 0.3);
            border-radius: 30px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #b87aff;
        }

        .filter-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .filter-list::-webkit-scrollbar {
            width: 3px;
        }

        .filter-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .filter-list::-webkit-scrollbar-thumb {
            background: #b87aff;
            border-radius: 10px;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .filter-option:active {
            background: rgba(106, 13, 173, 0.2);
        }

        .filter-option.selected {
            background: rgba(106, 13, 173, 0.3);
            border: 0.5px solid rgba(184, 122, 255, 0.5);
        }

        .filter-option-image {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .filter-option-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: white;
        }

        .filter-option-check {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(184, 122, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 14px;
            flex-shrink: 0;
        }

        .filter-option.selected .filter-option-check {
            background: #b87aff;
            border-color: #b87aff;
            color: white;
        }

        .market-scroll {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .market-scroll::-webkit-scrollbar {
            width: 3px;
        }

        .market-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .market-scroll::-webkit-scrollbar-thumb {
            background: #b87aff;
            border-radius: 10px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .market-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 0.5px solid rgba(138, 43, 226, 0.25);
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.08s ease;
        }

        .market-item:active {
            transform: scale(0.97);
        }

        .market-item-image {
            width: 100px;
            height: 100px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 10px;
            background: rgba(42, 30, 58, 0.5);
        }

        .market-item-name {
            font-size: 13px;
            font-weight: 500;
            color: white;
            text-align: center;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .market-item-price {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #b87aff;
            margin-bottom: 10px;
        }

        .buy-btn {
            background: rgba(106, 13, 173, 0.6);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(184, 122, 255, 0.3);
            border-radius: 40px;
            padding: 8px 20px;
            width: 100%;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
        }

        .buy-btn:active {
            transform: scale(0.96);
        }

        .empty-market {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 40px 0;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(28px);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            border-radius: 36px;
            border: 0.5px solid rgba(184, 122, 255, 0.2);
            margin-bottom: 18px;
            width: calc(100% - 36px);
            left: 18px;
            right: 18px;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 28px;
            text-decoration: none;
            transition: all 0.1s ease;
            background: transparent;
            border: none;
            min-width: 70px;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.25);
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 1px;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 500;
        }

        .nav-item.active {
            background: rgba(106, 13, 173, 0.25);
            color: #b87aff;
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1400;
            display: none;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="notification" id="notification"></div>
    <div class="overlay" id="overlay"></div>

    <div class="modal-overlay" id="depositModal">
        <div class="deposit-modal">
            <div class="modal-close" id="closeDepositModal">✕</div>
            <div class="deposit-title">Пополнение</div>
            <div class="quick-amounts">
                <span class="quick-amount" data-amount="50">50 ⭐</span>
                <span class="quick-amount" data-amount="100">100 ⭐</span>
                <span class="quick-amount" data-amount="200">200 ⭐</span>
                <span class="quick-amount" data-amount="500">500 ⭐</span>
                <span class="quick-amount" data-amount="1000">1000 ⭐</span>
                <span class="quick-amount" data-amount="2000">2000 ⭐</span>
            </div>
            <input type="text" class="amount-input" id="amountInput" placeholder="Введите количество звезд" inputmode="numeric">
            <button class="deposit-button" id="depositButton">
                <span>Пополнить</span>
                <span id="selectedAmount">0</span>
            </button>
        </div>
    </div>

    <div class="filter-modal" id="filterModal">
        <div class="filter-header">
            <h3>Фильтр</h3>
            <div class="filter-close" id="filterClose">✕</div>
        </div>
        <div class="filter-tabs">
            <div class="filter-tab active" data-tab="collection">Коллекция</div>
            <div class="filter-tab" data-tab="model">Модель</div>
            <div class="filter-tab" data-tab="background">Фон</div>
            <div class="filter-tab" data-tab="pattern">Узор</div>
        </div>
        <div class="filter-search">
            <div class="filter-search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="filterSearchInput" placeholder="Поиск...">
            </div>
            <div class="filter-sort-arrow" id="filterSortArrow">
                <i class="fas fa-arrow-up"></i>
            </div>
        </div>
        <div class="filter-list" id="filterList"></div>
    </div>

    <div class="app">
        <div class="profile-header">
            <div class="profile-left">
                <div class="avatar" id="avatar">A</div>
                <div class="name-box">
                    <span class="fullname" id="fullName">Алексей Иванов</span>
                    <span class="username" id="username">@alexey</span>
                </div>
            </div>
            <div class="balance-block">
                <div class="balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceValue">5000</span>
                </div>
                <div class="plus-btn" id="plusBtn">+</div>
            </div>
        </div>

        <div class="market-frame">
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Поиск NFT...">
                </div>
                <div class="filter-btn" id="filterBtn">
                    <i class="fas fa-sliders-h"></i>
                </div>
                <div class="sort-btn" id="sortBtn">
                    <i class="fas fa-random"></i>
                </div>
            </div>

            <div class="market-scroll" id="marketScroll">
                <div id="marketContainer"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="#" class="nav-item active" id="navMarket"><i class="fas fa-store"></i><span>МАРКЕТ</span></a>
            <a href="profle.html" class="nav-item" id="navProfile"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'nft_balance';
            const PURCHASED_KEY = 'nft_purchased_items';
            const BOT_USERNAME = 'yeter16_bot';

            const COLLECTION_NAMES = [
                "Artisan Brick", "B-Day Candle", "Berry Box", "Big Year", "Bling Binky",
                "Bonded Ring", "Bow Tie", "Bunny Muffin", "Candy Cane", "Clover Pin",
                "Cookie Heart", "Crystal Ball", "Cupid Charm", "Desk Calendar", "Diamond Ring",
                "Easter Egg", "Electric Skull", "Eternal Candle", "Eternal Rose", "Evil Eye",
                "Faith Amulet", "Flying Broom", "Fresh Socks", "Gem Signet", "Genie Lamp",
                "Ginger Cookie", "Hanging Star", "Heroic Helmet", "Hex Pot", "Holiday Drink",
                "Homemade Cake", "Hypno Lollipop", "Ice Cream", "Input Key", "Instant Ramen",
                "Ionic Dryer", "Jack-in-the-Box", "Jelly Bunny", "Jester Hat", "Jingle Bells",
                "Jolly Chimp", "Joyful Bundle", "Khabibs Papakha", "Kissed Frog", "Light Sword",
                "Lol Pop", "Lon Gem", "Love Candle", "Love Potion", "Low Rider", "Lunar Snake",
                "Lush Bouquet", "Mad Pumpkin", "Magic Potion", "Mini Oscar", "Money Pot",
                "Moon Pendant", "Mousse Cake", "Nail Bracelet", "Neko Helmet", "Perfume Bottle",
                "Pet Snake", "Pretty Posy", "Rare Bird", "Record Player", "Restless Jar",
                "Sakura Flower", "Santa Hat", "Sharp Tongue", "Signet Ring", "Skull Flower",
                "Sky Stilettos", "Sleigh Bell", "Snake Box", "Snoop Cigar", "Snow Globe",
                "Snow Mittens", "Spiced Wine", "Spring Basket", "Spy Agaric", "Star Notepad",
                "Stellar Rocket", "Swag Bag", "Swiss Watch", "Tama Gadget", "Top Hat",
                "Toy Bear", "Trapped Heart", "UFC Strike", "Valentine Box", "Victory Medal",
                "Vintage Cigar", "Voodoo Doll", "Westside Sign", "Whip Cupcake", "Winter Wreath",
                "Witch Hat", "Xmas Stocking"
            ];

            let NFT_ITEMS = [];
            
            for (let i = 0; i < COLLECTION_NAMES.length; i++) {
                NFT_ITEMS.push({
                    id: i + 1,
                    name: COLLECTION_NAMES[i],
                    price: Math.floor(Math.random() * 400) + 50,
                    image: `https://picsum.photos/id/${(i % 100) + 1}/200/200`,
                    collection: COLLECTION_NAMES[i],
                    pattern: ["Классический", "Современный", "Винтажный", "Неоновый"][i % 4],
                    background: ["Темный", "Светлый", "Градиент", "Звездный"][i % 4],
                    model: ["2D", "3D", "Pixel", "Vector"][i % 4]
                });
            }

            let currentItems = [...NFT_ITEMS];
            let currentSort = 'random';
            let currentTab = 'collection';
            let filterSelections = {
                collection: [],
                model: [],
                background: [],
                pattern: []
            };
            let filterSearchTerm = '';
            let collectionSortDirection = 'asc';

            function getBalance() {
                try {
                    return parseInt(localStorage.getItem(STORAGE_KEY)) || 5000;
                } catch {
                    return 5000;
                }
            }

            function setBalance(newBalance) {
                localStorage.setItem(STORAGE_KEY, newBalance);
                updateBalanceDisplay();
                localStorage.setItem('balance_updated', Date.now().toString());
            }

            function updateBalanceDisplay() {
                const el = document.getElementById('balanceValue');
                if (el) el.innerText = getBalance();
            }

            function showNotification(message) {
                const notif = document.getElementById('notification');
                notif.innerText = message;
                notif.classList.add('show');
                setTimeout(() => notif.classList.remove('show'), 2000);
            }

            function applyFilters() {
                let filtered = [...NFT_ITEMS];
                
                if (filterSelections.collection.length > 0) {
                    filtered = filtered.filter(item => filterSelections.collection.includes(item.collection));
                }
                if (filterSelections.model.length > 0) {
                    filtered = filtered.filter(item => filterSelections.model.includes(item.model));
                }
                if (filterSelections.background.length > 0) {
                    filtered = filtered.filter(item => filterSelections.background.includes(item.background));
                }
                if (filterSelections.pattern.length > 0) {
                    filtered = filtered.filter(item => filterSelections.pattern.includes(item.pattern));
                }
                
                currentItems = filtered;
                renderMarket();
            }

            function renderMarket() {
                const container = document.getElementById('marketContainer');
                let itemsToShow = [...currentItems];
                const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';

                if (searchTerm) {
                    itemsToShow = itemsToShow.filter(item => 
                        item.name.toLowerCase().includes(searchTerm)
                    );
                }

                if (currentSort === 'asc') {
                    itemsToShow.sort((a, b) => a.price - b.price);
                } else if (currentSort === 'desc') {
                    itemsToShow.sort((a, b) => b.price - a.price);
                } else {
                    itemsToShow = [...itemsToShow].sort(() => Math.random() - 0.5);
                }

                if (!itemsToShow.length) {
                    container.innerHTML = '<div class="empty-market"><i class="fas fa-store"></i><p>Товаров не найдено</p></div>';
                    return;
                }

                let html = '<div class="market-grid">';
                for (let i = 0; i < itemsToShow.length; i++) {
                    const item = itemsToShow[i];
                    html += `<div class="market-item">
                        <img src="${item.image}" alt="${escapeHtml(item.name)}" class="market-item-image" loading="lazy">
                        <div class="market-item-name">${escapeHtml(item.name)}</div>
                        <div class="market-item-price"><span class="price-icon">🧩</span> ${item.price}</div>
                        <div class="buy-btn" data-price="${item.price}" data-name="${escapeHtml(item.name)}" data-image="${item.image}">Купить</div>
                    </div>`;
                }
                html += '</div>';
                container.innerHTML = html;

                document.querySelectorAll('.buy-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const price = parseInt(btn.dataset.price);
                        const name = btn.dataset.name;
                        const image = btn.dataset.image;
                        buyItem(price, name, image);
                    });
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function buyItem(price, name, image) {
                const currentBalance = getBalance();
                if (currentBalance >= price) {
                    const newBalance = currentBalance - price;
                    setBalance(newBalance);
                    
                    const purchasedItems = JSON.parse(localStorage.getItem(PURCHASED_KEY)) || [];
                    purchasedItems.push({ name, price, image, purchaseTime: Date.now() });
                    localStorage.setItem(PURCHASED_KEY, JSON.stringify(purchasedItems));
                    
                    showNotification(`✅ Куплено: ${name} за ${price} ⭐`);
                    renderMarket();
                } else {
                    showNotification(`❌ Недостаточно звезд! Нужно ${price} ⭐`);
                }
            }

            function updateFilterOptions() {
                let options = [];
                const currentSelections = filterSelections[currentTab];
                
                if (currentTab === 'collection') {
                    options = [...COLLECTION_NAMES];
                } else if (currentTab === 'model') {
                    options = [...new Set(NFT_ITEMS.map(item => item.model))];
                } else if (currentTab === 'background') {
                    options = [...new Set(NFT_ITEMS.map(item => item.background))];
                } else if (currentTab === 'pattern') {
                    options = [...new Set(NFT_ITEMS.map(item => item.pattern))];
                }
                
                if (filterSearchTerm) {
                    options = options.filter(opt => opt.toLowerCase().includes(filterSearchTerm.toLowerCase()));
                }
                
                if (currentTab === 'collection') {
                    if (collectionSortDirection === 'asc') {
                        options.sort();
                    } else {
                        options.sort().reverse();
                    }
                } else {
                    options.sort();
                    if (collectionSortDirection === 'desc') {
                        options.reverse();
                    }
                }
                
                renderFilterList(options, currentSelections);
            }

            function renderFilterList(options, selections) {
                const container = document.getElementById('filterList');
                if (!options.length) {
                    container.innerHTML = '<div class="empty-market">Ничего не найдено</div>';
                    return;
                }
                
                let html = '';
                for (let i = 0; i < options.length; i++) {
                    const opt = options[i];
                    const isSelected = selections.includes(opt);
                    if (currentTab === 'collection') {
                        html += `<div class="filter-option ${isSelected ? 'selected' : ''}" data-value="${escapeHtml(opt)}">
                            <img src="https://picsum.photos/id/${(i % 100) + 1}/100/100" class="filter-option-image" loading="lazy">
                            <div class="filter-option-name">${escapeHtml(opt)}</div>
                            <div class="filter-option-check">
                                ${isSelected ? '<i class="fas fa-check"></i>' : ''}
                            </div>
                        </div>`;
                    } else {
                        html += `<div class="filter-option ${isSelected ? 'selected' : ''}" data-value="${escapeHtml(opt)}">
                            <div class="filter-option-image" style="background: rgba(184,122,255,0.2); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-cube"></i>
                            </div>
                            <div class="filter-option-name">${escapeHtml(opt)}</div>
                            <div class="filter-option-check">
                                ${isSelected ? '<i class="fas fa-check"></i>' : ''}
                            </div>
                        </div>`;
                    }
                }
                container.innerHTML = html;
                
                document.querySelectorAll('.filter-option').forEach(opt => {
                    opt.addEventListener('click', () => {
                        const value = opt.dataset.value;
                        const currentSelections = filterSelections[currentTab];
                        const index = currentSelections.indexOf(value);
                        
                        if (index === -1) {
                            currentSelections.push(value);
                        } else {
                            currentSelections.splice(index, 1);
                        }
                        
                        filterSelections[currentTab] = currentSelections;
                        updateFilterOptions();
                        applyFilters();
                    });
                });
            }

            function validateAndFormatAmount(value) {
                let cleaned = value.replace(/[^\d.]/g, '');
                let num = parseFloat(cleaned);
                if (isNaN(num)) return 1;
                num = Math.floor(num);
                if (num < 1) return 1;
                if (num > 100000) return 100000;
                return num;
            }

            function openTelegramPayment(amount) {
                const tg = window.Telegram?.WebApp;
                if (!tg) {
                    alert('Это приложение работает только в Telegram');
                    return;
                }
                window.location.href = `https://t.me/${BOT_USERNAME}?start=pay_${amount}`;
                showNotification(`⏳ Открываю оплату на ${amount} ⭐...`);
                document.getElementById('depositModal').classList.remove('active');
                
                setTimeout(() => {
                    const confirmed = confirm(`Подтверди тестовую оплату ${amount} ⭐?`);
                    if (confirmed) {
                        setBalance(getBalance() + amount);
                        showNotification(`✅ Успешное пополнение на ${amount} ⭐`);
                    }
                }, 3000);
            }

            function init() {
                const starsContainer = document.getElementById('stars');
                if (starsContainer && starsContainer.children.length === 0) {
                    for (let i = 0; i < 40; i++) {
                        const star = document.createElement('div');
                        star.className = 'star';
                        star.style.left = Math.random() * 100 + '%';
                        star.style.top = Math.random() * 100 + '%';
                        starsContainer.appendChild(star);
                    }
                }

                const tg = window.Telegram?.WebApp;
                let firstName = 'Игрок', lastName = '', tgUsername = '';
                
                if (tg?.initDataUnsafe?.user) {
                    const user = tg.initDataUnsafe.user;
                    firstName = user.first_name || 'Игрок';
                    lastName = user.last_name || '';
                    tgUsername = user.username ? '@' + user.username : '';
                }

                const fullName = (firstName + ' ' + lastName).trim();
                document.getElementById('fullName').innerText = fullName || 'Игрок';
                document.getElementById('username').innerText = tgUsername || '@' + firstName.toLowerCase().replace(/\s+/g, '');

                const avatarDiv = document.getElementById('avatar');
                if (tg?.initDataUnsafe?.user?.photo_url) {
                    avatarDiv.style.backgroundImage = `url('${tg.initDataUnsafe.user.photo_url}')`;
                    avatarDiv.style.backgroundSize = 'cover';
                    avatarDiv.innerText = '';
                } else {
                    avatarDiv.innerText = firstName.charAt(0).toUpperCase();
                }

                updateBalanceDisplay();
                renderMarket();

                window.addEventListener('storage', (e) => {
                    if (e.key === STORAGE_KEY || e.key === 'balance_updated') {
                        updateBalanceDisplay();
                    }
                });

                const depositModal = document.getElementById('depositModal');
                const plusBtn = document.getElementById('plusBtn');
                const amountInput = document.getElementById('amountInput');
                const depositButton = document.getElementById('depositButton');
                const selectedAmountSpan = document.getElementById('selectedAmount');
                const quickAmounts = document.querySelectorAll('.quick-amount');

                if (plusBtn) {
                    plusBtn.addEventListener('click', () => {
                        if (amountInput) amountInput.value = '';
                        if (selectedAmountSpan) selectedAmountSpan.innerText = '0';
                        depositModal.classList.add('active');
                    });
                }

                quickAmounts.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const amount = btn.dataset.amount;
                        if (amountInput) amountInput.value = amount;
                        if (selectedAmountSpan) selectedAmountSpan.innerText = amount;
                    });
                });

                document.getElementById('closeDepositModal')?.addEventListener('click', () => depositModal.classList.remove('active'));
                depositModal?.addEventListener('click', (e) => { if (e.target === depositModal) depositModal.classList.remove('active'); });

                if (amountInput) {
                    amountInput.addEventListener('input', (e) => {
                        let value = e.target.value.replace(/[^\d.]/g, '');
                        e.target.value = value;
                        if (selectedAmountSpan) selectedAmountSpan.innerText = (value && value !== '.') ? value : '0';
                    });
                    amountInput.addEventListener('blur', (e) => {
                        const formatted = validateAndFormatAmount(e.target.value);
                        e.target.value = formatted;
                        if (selectedAmountSpan) selectedAmountSpan.innerText = formatted;
                    });
                }

                if (depositButton) {
                    depositButton.addEventListener('click', () => {
                        const amount = validateAndFormatAmount(amountInput?.value || '0');
                        if (amount > 0) openTelegramPayment(amount);
                    });
                }

                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', () => renderMarket());
                }

                const sortBtn = document.getElementById('sortBtn');
                let sortState = 0;
                if (sortBtn) {
                    sortBtn.addEventListener('click', () => {
                        sortState = (sortState + 1) % 3;
                        if (sortState === 0) {
                            currentSort = 'random';
                            sortBtn.innerHTML = '<i class="fas fa-random"></i>';
                        } else if (sortState === 1) {
                            currentSort = 'asc';
                            sortBtn.innerHTML = '<i class="fas fa-arrow-up"></i>';
                        } else {
                            currentSort = 'desc';
                            sortBtn.innerHTML = '<i class="fas fa-arrow-down"></i>';
                        }
                        renderMarket();
                    });
                }

                const filterBtn = document.getElementById('filterBtn');
                const filterModal = document.getElementById('filterModal');
                const filterClose = document.getElementById('filterClose');
                const overlay = document.getElementById('overlay');
                const filterTabs = document.querySelectorAll('.filter-tab');
                const filterSearchInput = document.getElementById('filterSearchInput');
                const filterSortArrow = document.getElementById('filterSortArrow');

                if (filterBtn) {
                    filterBtn.addEventListener('click', () => {
                        filterModal.classList.add('active');
                        overlay.classList.add('active');
                        filterSearchTerm = '';
                        if (filterSearchInput) filterSearchInput.value = '';
                        updateFilterOptions();
                    });
                }

                function closeFilter() {
                    filterModal.classList.remove('active');
                    overlay.classList.remove('active');
                }

                if (filterClose) filterClose.addEventListener('click', closeFilter);
                if (overlay) overlay.addEventListener('click', closeFilter);

                filterTabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        filterTabs.forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        currentTab = tab.dataset.tab;
                        filterSearchTerm = '';
                        if (filterSearchInput) filterSearchInput.value = '';
                        
                        if (currentTab === 'collection') {
                            filterSortArrow.style.display = 'flex';
                        } else {
                            filterSortArrow.style.display = 'none';
                        }
                        
                        updateFilterOptions();
                    });
                });

                if (filterSortArrow) {
                    filterSortArrow.addEventListener('click', () => {
                        collectionSortDirection = collectionSortDirection === 'asc' ? 'desc' : 'asc';
                        filterSortArrow.innerHTML = collectionSortDirection === 'asc' ? '<i class="fas fa-arrow-up"></i>' : '<i class="fas fa-arrow-down"></i>';
                        updateFilterOptions();
                    });
                }

                if (filterSearchInput) {
                    filterSearchInput.addEventListener('input', (e) => {
                        filterSearchTerm = e.target.value;
                        updateFilterOptions();
                    });
                }

                const navMarket = document.getElementById('navMarket');
                const navProfile = document.getElementById('navProfile');
                if (navProfile) {
                    navProfile.addEventListener('click', (e) => {
                        e.preventDefault();
                        window.location.href = 'profle.html';
                    });
                }
                if (navMarket) {
                    navMarket.addEventListener('click', (e) => e.preventDefault());
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
