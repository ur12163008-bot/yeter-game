<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NFT Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#03050a;color:#fff;display:flex;justify-content:center}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 40% 50%,#0a0e1a 0%,#03050a 70%,#000103 100%);z-index:-2}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;width:2px;height:2px;opacity:.3}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.orb1{width:340px;height:340px;background:radial-gradient(circle,rgba(148,38,255,.22) 0%,transparent 70%);top:-60px;left:-60px;animation:orb1 8s ease-in-out infinite}
.orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(90,20,200,.18) 0%,transparent 70%);bottom:60px;right:-50px;animation:orb2 10s ease-in-out infinite}
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1);opacity:.12}50%{transform:translate(30px,-20px) scale(1.08);opacity:.18}}
@keyframes orb2{0%,100%{transform:translate(0,0) scale(1);opacity:.08}50%{transform:translate(-25px,30px) scale(1.05);opacity:.14}}

.app{max-width:440px;width:100%;height:100%;display:flex;flex-direction:column;position:relative;z-index:1;overflow:hidden}

/* ─── Notification ─── */
.notif{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);padding:10px 18px;border-radius:60px;background:rgba(0,200,83,.9);color:#fff;font-weight:500;font-size:13px;z-index:9999;transition:transform .22s;border:.5px solid rgba(255,255,255,.2);pointer-events:none;white-space:nowrap}
.notif.err{background:#8b1a1a}
.notif.show{transform:translateX(-50%) translateY(0)}

/* ─── Header ─── */
.profile-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px;gap:12px;flex-shrink:0}
.profile-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.avatar{width:52px;height:52px;border-radius:18px;background:rgba(106,13,173,.5);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;border:.5px solid rgba(184,122,255,.5);flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.fullname{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.username-txt{font-size:13px;color:rgba(255,255,255,.5)}
.balance-block{display:flex;align-items:center;gap:8px;background:rgba(18,18,34,.92);border:.5px solid rgba(138,43,226,.2);border-radius:40px;padding:6px 8px 6px 14px;flex-shrink:0}
.balance-val{font-weight:600;font-size:15px}
.plus-btn{background:rgba(255,255,255,.1);border:.5px solid rgba(138,43,226,.38);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#b87aff;font-size:20px;cursor:pointer;line-height:1}
.plus-btn:active{background:rgba(106,13,173,.6);transform:scale(.92)}

/* ─── Search row ─── */
.search-row{display:flex;gap:10px;padding:0 20px 12px;flex-shrink:0}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:60px;padding:10px 14px}
.search-box input{background:transparent;border:none;color:#fff;font-size:14px;outline:none;width:100%;font-family:inherit}
.search-box input::placeholder{color:rgba(255,255,255,.38)}
.search-box i{color:rgba(255,255,255,.35);font-size:13px}
.icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(184,122,255,.28);border-radius:60px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#b87aff;font-size:15px;flex-shrink:0}
.icon-btn:active{transform:scale(.92)}
.icon-btn.fil-active{border-color:#b87aff;box-shadow:0 0 10px rgba(184,122,255,.25)}

/* ─── Market scroll area ─── */
.market-scroll-wrap{flex:1;overflow:hidden;position:relative;margin:0 20px}
.market-scroll{height:100%;overflow-y:auto;padding-bottom:20px;scrollbar-width:none}
.market-scroll::-webkit-scrollbar{display:none}
.market-wrap{background:rgba(13,14,24,.9);border:1px solid rgba(138,43,226,.2);border-radius:28px;padding:16px}
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:rgba(18,18,36,.92);border:1px solid rgba(138,43,226,.2);border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.mcard:active{transform:scale(.94)}
.mcard img{width:100px;height:100px;border-radius:16px;object-fit:cover;margin-bottom:10px;background:rgba(40,25,65,.6);display:block}
.mcard-name{font-size:12px;font-weight:500;text-align:center;margin-bottom:5px;color:rgba(255,255,255,.88);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard-seller{display:flex;align-items:center;gap:5px;margin-bottom:6px;width:100%;justify-content:center}
.mcard-av{width:16px;height:16px;border-radius:4px;background:rgba(88,10,148,.55);border:1px solid rgba(184,122,255,.45);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}
.mcard-sname{font-size:10px;color:rgba(255,255,255,.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.mcard-price{font-size:13px;font-weight:700;color:#b87aff}
.empty-msg{grid-column:1/-1;text-align:center;color:rgba(255,255,255,.48);padding:48px 0;font-size:14px}

/* ─── Scroll indicator ─── */
.scroll-ind{position:absolute;right:4px;top:16px;bottom:16px;width:3px;background:rgba(106,13,173,.3);border-radius:4px;pointer-events:none}
.scroll-thumb{position:absolute;right:0;width:3px;min-height:24px;background:#b87aff;border-radius:4px;transition:opacity .2s}

/* ─── Bottom nav ─── */
.bottom-nav{flex-shrink:0;padding:8px 20px 18px;display:flex;justify-content:center}
.bnav{background:rgba(12,12,22,.95);border:1px solid rgba(184,122,255,.16);border-radius:28px;display:flex;width:100%;max-width:400px;overflow:hidden}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.48);font-size:10px;font-weight:500;cursor:pointer;padding:9px 8px 7px;text-decoration:none;border:none;background:transparent;font-family:inherit}
.nav-item i{font-size:19px}
.nav-item.active{background:rgba(106,13,173,.2);color:#b87aff}
.nav-item.active i{color:#b87aff}

/* ─── Overlay + modals ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:rgba(14,14,26,.98);border:1px solid rgba(184,122,255,.25);border-radius:28px;padding:24px 20px 22px;position:relative;text-align:center;animation:popIn .22s ease;max-width:320px;width:90%}
.modal-close{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(255,255,255,.08);border:.5px solid rgba(184,122,255,.2);border-radius:50%;color:#b87aff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:system-ui}
.modal-close:active{transform:scale(.9)}
@keyframes popIn{from{transform:scale(.94) translateY(16px);opacity:0}to{transform:none;opacity:1}}

/* buy modal */
.buy-img{width:130px;height:130px;border-radius:22px;object-fit:cover;display:block;margin:0 auto 14px;background:rgba(40,25,65,.6)}
.buy-title{font-size:18px;font-weight:700;margin-bottom:10px}
.buy-seller{display:flex;align-items:center;gap:8px;justify-content:center;padding:8px 14px;background:rgba(255,255,255,.04);border-radius:16px;margin-bottom:10px}
.buy-seller-av{width:28px;height:28px;border-radius:8px;background:rgba(88,10,148,.55);border:1px solid rgba(184,122,255,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.tag{background:rgba(88,10,148,.25);border:1px solid rgba(184,122,255,.22);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
.buy-price{font-size:20px;font-weight:800;color:#b87aff;margin-bottom:16px}
.buy-btn{background:linear-gradient(135deg,rgba(106,13,173,.9),rgba(148,38,255,.7));border:1px solid rgba(184,122,255,.4);border-radius:60px;padding:13px 24px;width:100%;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.buy-btn:disabled{opacity:.55;cursor:not-allowed}
.buy-btn:not(:disabled):active{transform:scale(.97)}

/* deposit modal */
.dep-modal{background:rgba(20,20,35,.9);backdrop-filter:blur(40px);border:.5px solid rgba(255,255,255,.2);border-radius:32px;padding:28px 20px 24px;position:relative;animation:popIn .25s ease;max-width:360px;width:92%}
.dep-title{font-size:22px;font-weight:600;text-align:center;margin-bottom:20px}
.quick-amounts{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.qa{background:rgba(106,13,173,.2);border:.5px solid rgba(184,122,255,.3);border-radius:30px;padding:7px 14px;font-size:13px;font-weight:600;color:#b87aff;cursor:pointer;min-width:68px;text-align:center}
.qa:active{transform:scale(.94)}
.qa.sel{background:rgba(88,10,148,.5);border-color:#b87aff;color:#fff}
.amount-input{width:100%;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 16px;font-size:17px;color:#fff;outline:none;margin-bottom:16px;font-family:inherit}
.amount-input:focus{border-color:rgba(184,122,255,.6)}
.dep-btn{background:rgba(106,13,173,.7);border:.5px solid rgba(184,122,255,.4);border-radius:60px;padding:13px 20px;width:100%;color:#fff;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:inherit}
.dep-btn:active{transform:scale(.97)}
.dep-btn span:last-child{background:rgba(255,255,255,.15);padding:3px 12px;border-radius:30px;font-size:14px}

/* ─── Filter panel ─── */
.filter-panel{position:fixed;inset:0;background:rgba(8,8,18,.99);z-index:1500;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);pointer-events:none;overflow:hidden}
.filter-panel.open{transform:translateY(0);pointer-events:auto}
.fp-inner{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}
.fp-hdr{display:flex;align-items:center;justify-content:center;position:relative;padding:20px 20px 12px;flex-shrink:0}
.fp-hdr h3{font-size:18px;font-weight:700}
.fp-close{position:absolute;right:12px;top:16px;width:28px;height:28px;background:rgba(255,255,255,.08);border:1px solid rgba(184,122,255,.22);border-radius:50%;color:#b87aff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:system-ui}
.fp-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 20px 12px;flex-shrink:0}
.fp-tab{background:rgba(255,255,255,.06);border:1px solid rgba(184,122,255,.22);border-radius:40px;padding:8px 4px;font-size:12px;font-weight:500;color:rgba(255,255,255,.48);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;font-family:inherit}
.fp-tab.active{background:rgba(88,10,148,.5);border-color:#b87aff;color:#fff}
.fp-badge{background:#b87aff;color:#fff;font-size:9px;font-weight:700;border-radius:20px;padding:0 5px;min-width:14px;text-align:center}
.fp-search{display:flex;gap:8px;margin:0 20px 10px;flex-shrink:0}
.fp-reset{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 20px 10px;background:rgba(180,30,30,.12);border:1px solid rgba(220,50,50,.25);border-radius:40px;padding:8px;color:rgba(255,120,120,.85);font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit}
.fp-list{flex:1;overflow:hidden;position:relative}
.fp-scroll{height:100%;overflow-y:auto;padding:0 20px 30px;scrollbar-width:none}
.fp-scroll::-webkit-scrollbar{display:none}
.fi{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:16px;cursor:pointer;margin-bottom:8px}
.fi.sel{background:rgba(88,10,148,.25);border-color:rgba(184,122,255,.4)}
.fi img{width:44px;height:44px;border-radius:11px;object-fit:cover;background:rgba(40,25,65,.6);flex-shrink:0}
.fi-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-sub{font-size:11px;color:#b87aff;font-weight:600;margin-top:2px}
.fi-chk{width:22px;height:22px;border-radius:7px;border:1px solid rgba(184,122,255,.3);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0}
.fi-chk.on{background:#b87aff;border-color:#b87aff}
.fi-arrow{color:#b87aff;font-size:12px}
.back-btn{display:flex;align-items:center;gap:8px;color:#b87aff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px}
.model-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;font-weight:600}
.model-hdr img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.fp-load{text-align:center;color:rgba(255,255,255,.48);padding:36px 0;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(184,122,255,.3);border-top-color:#b87aff;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="orb orb1"></div><div class="orb orb2"></div>
<div class="notif" id="notif"></div>

<!-- BUY MODAL -->
<div class="overlay" id="buyOv">
  <div class="modal">
    <div class="modal-close" id="buyX">✕</div>
    <img class="buy-img" id="buyImg" src="" alt="">
    <div class="buy-title" id="buyName"></div>
    <div class="buy-seller" id="buySeller"></div>
    <div class="tags" id="buyTags"></div>
    <div class="buy-price" id="buyPrice"></div>
    <button class="buy-btn" id="buyBtn">Купить</button>
  </div>
</div>

<!-- DEPOSIT MODAL -->
<div class="overlay" id="depOv">
  <div class="dep-modal">
    <div class="modal-close" id="depX">✕</div>
    <div class="dep-title">Пополнение</div>
    <div class="quick-amounts" id="qas">
      <span class="qa" data-a="50">50 ⭐</span><span class="qa" data-a="100">100 ⭐</span>
      <span class="qa" data-a="200">200 ⭐</span><span class="qa" data-a="500">500 ⭐</span>
      <span class="qa" data-a="1000">1000 ⭐</span><span class="qa" data-a="2000">2000 ⭐</span>
    </div>
    <input class="amount-input" id="depIn" type="text" inputmode="numeric" placeholder="Количество звёзд">
    <button class="dep-btn" id="depBtn"><span>Пополнить</span><span id="depAmt">0 ⭐</span></button>
  </div>
</div>

<!-- FILTER PANEL -->
<div class="filter-panel" id="fp">
  <div class="fp-inner">
    <div class="fp-hdr"><h3>Фильтры</h3><div class="fp-close" id="fpX">×</div></div>
    <div class="fp-tabs" id="fpTabs">
      <button class="fp-tab active" data-t="collection">Коллекция</button>
      <button class="fp-tab" data-t="model">Модель</button>
      <button class="fp-tab" data-t="background">Фон</button>
      <button class="fp-tab" data-t="pattern">Узор</button>
    </div>
    <div class="fp-search">
      <div class="search-box" style="flex:1"><i class="fas fa-search"></i><input id="fpSrch" placeholder="Поиск..."></div>
      <div class="icon-btn" id="fpSort" style="display:none"><i class="fas fa-arrow-up" id="fpSortI"></i></div>
    </div>
    <button class="fp-reset" id="fpReset" style="display:none"><i class="fas fa-rotate-left"></i> Сбросить всё</button>
    <div class="fp-list">
      <div class="fp-scroll" id="fpScr"></div>
      <div class="scroll-ind" id="fpTrack"><div class="scroll-thumb" id="fpThumb"></div></div>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app">
  <div class="profile-header">
    <div class="profile-left">
      <div class="avatar" id="av">И</div>
      <div>
        <div class="fullname" id="fname">Игрок</div>
        <div class="username-txt" id="uname">@player</div>
      </div>
    </div>
    <div class="balance-block">
      <div class="balance-val">⭐ <span id="balVal">5 000</span></div>
      <div class="plus-btn" id="plusBtn">+</div>
    </div>
  </div>

  <div class="search-row">
    <div class="search-box"><i class="fas fa-search"></i><input id="srch" placeholder="Поиск NFT..."></div>
    <div class="icon-btn" id="filterBtn"><i class="fas fa-sliders-h"></i></div>
    <div class="icon-btn" id="sortBtn"><i class="fas fa-arrow-up" id="sortI"></i></div>
  </div>

  <div class="market-scroll-wrap">
    <div class="market-scroll" id="mScroll">
      <div class="market-wrap"><div class="market-grid" id="grid"></div></div>
    </div>
    <div class="scroll-ind" id="mTrack"><div class="scroll-thumb" id="mThumb"></div></div>
  </div>

  <div class="bottom-nav">
    <div class="bnav">
      <a href="index.html" class="nav-item active"><i class="fas fa-store"></i><span>МАРКЕТ</span></a>
      <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
    </div>
  </div>
</div>

const MODELS=["2D","3D","Pixel","Vector"];
const SELLERS=[{id:1,n:'Алексей Смирнов',a:'А'},{id:2,n:'Мария Иванова',a:'М'},{id:3,n:'Дмитрий Козлов',a:'Д'},{id:4,n:'Анна Новикова',a:'А'},{id:5,n:'Иван Попов',a:'И'},{id:6,n:'Екатерина Соколова',a:'Е'},{id:7,n:'Михаил Лебедев',a:'М'},{id:8,n:'Ольга Морозова',a:'О'},{id:9,n:'Николай Петров',a:'Н'},{id:10,n:'Светлана Волкова',a:'С'}];
const IMG={pattern:{"Классический":"https://images.unsplash.com/photo-1519741497674-611481863552?w=80&h=80&fit=crop","Современный":"https://images.unsplash.com/photo-1464802686167-b939a6910659?w=80&h=80&fit=crop","Винтажный":"https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?w=80&h=80&fit=crop","Неоновый":"https://images.unsplash.com/photo-1518235506717-e1ed3306a89b?w=80&h=80&fit=crop"},bg:{"Темный":"https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=80&h=80&fit=crop","Светлый":"https://images.unsplash.com/photo-1579547621113-e4bb2a19bdd6?w=80&h=80&fit=crop","Градиент":"https://images.unsplash.com/photo-1620121692029-d088224ddc74?w=80&h=80&fit=crop","Звездный":"https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=80&h=80&fit=crop"},model:{"2D":"https://images.unsplash.com/photo-1607706189992-eae578626c86?w=80&h=80&fit=crop","3D":"https://images.unsplash.com/photo-1617791160505-6f00504e3519?w=80&h=80&fit=crop","Pixel":"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=80&h=80&fit=crop","Vector":"https://images.unsplash.com/photo-1461344577544-4e5dc9487184?w=80&h=80&fit=crop"}};

const BAL_K='nft_balance', MKT_K='nft_market_v3', INV_K='nft_inventory';
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};

function getBal(){return parseInt(localStorage.getItem(BAL_K))||5000}
function setBal(n){localStorage.setItem(BAL_K,n);renderBal()}
function renderBal(){document.getElementById('balVal').textContent=getBal().toLocaleString('ru-RU')}

function getMkt(){return LS.get(MKT_K)||[]}
function setMkt(d){LS.set(MKT_K,d)}
function getInv(){return LS.get(INV_K)||[]}
function setInv(d){LS.set(INV_K,d)}

function seed(){
  if(getMkt().length>0)return;
  setMkt(NAMES.map((name,i)=>{const s=SELLERS[i%SELLERS.length];return{id:i+1,name,price:PRICES[i%PRICES.length],sId:s.id,sName:s.n,sAv:s.a,pattern:PATTERNS[i%4],background:BACKGROUNDS[i%4],model:MODELS[i%4]}}));
}

// stars
const stEl=document.getElementById('stars');
for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';stEl.appendChild(s)}

// notif
const notifEl=document.getElementById('notif');let nT;
function toast(msg,err=false){clearTimeout(nT);notifEl.textContent=msg;notifEl.className='notif'+(err?' err':'')+' show';nT=setTimeout(()=>notifEl.classList.remove('show'),2400)}

// Telegram user
const tg=window.Telegram?.WebApp;
let tgU={fn:'Игрок',ln:'',un:'@player',char:'И',photo:null};
if(tg?.initDataUnsafe?.user){const u=tg.initDataUnsafe.user;tgU.fn=u.first_name||'Игрок';tgU.ln=u.last_name||'';tgU.un=u.username?'@'+u.username:'@'+tgU.fn.toLowerCase();tgU.char=tgU.fn[0].toUpperCase();tgU.photo=u.photo_url||null}
document.getElementById('fname').textContent=(tgU.fn+' '+tgU.ln).trim();
document.getElementById('uname').textContent=tgU.un;
const avEl=document.getElementById('av');
if(tgU.photo){avEl.innerHTML=`<img src="${tgU.photo}" alt="">`}else{avEl.textContent=tgU.char}
renderBal();

// image cache
const cache={};let cacheReady=false;
(function startCache(){
  let done=0;const total=NAMES.length;
  NAMES.forEach(n=>{
    const k='img_c_'+n;const s=localStorage.getItem(k);
    if(s){cache[n]=s;done++;if(done>=total){cacheReady=true}}
  });
  if(cacheReady)return;
  const pending=NAMES.filter(n=>!cache[n]);
  let idx=0;
  function batch(){
    if(idx>=pending.length){cacheReady=true;if(fpOpen&&curTab==='collection')renderFpList();return}
    const sl=pending.slice(idx,idx+5);idx+=5;
    Promise.all(sl.map(n=>fetch(GB+encodeURIComponent(n+'.png')).then(r=>r.blob()).then(b=>new Promise(res=>{const fr=new FileReader();fr.onloadend=()=>{cache[n]=fr.result;try{localStorage.setItem('img_c_'+n,fr.result)}catch{}res()};fr.onerror=()=>res();fr.readAsDataURL(b)})).catch(()=>{}))).then(()=>setTimeout(batch,60));
  }
  batch();
})();
function imgUrl(n){return cache[n]||GB+encodeURIComponent(n+'.png')}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// deposit
const depOv=document.getElementById('depOv'),depIn=document.getElementById('depIn'),depAmt=document.getElementById('depAmt');
document.getElementById('plusBtn').onclick=()=>{depIn.value='';depAmt.textContent='0 ⭐';document.querySelectorAll('.qa').forEach(q=>q.classList.remove('sel'));depOv.classList.add('show')};
document.getElementById('depX').onclick=()=>depOv.classList.remove('show');
depOv.addEventListener('click',e=>{if(e.target===depOv)depOv.classList.remove('show')});
document.querySelectorAll('.qa').forEach(q=>{q.onclick=()=>{document.querySelectorAll('.qa').forEach(x=>x.classList.remove('sel'));q.classList.add('sel');depIn.value=q.dataset.a;depAmt.textContent=q.dataset.a+' ⭐'}});
depIn.oninput=e=>{const v=e.target.value.replace(/\D/g,'');e.target.value=v;depAmt.textContent=(v||'0')+' ⭐';document.querySelectorAll('.qa').forEach(q=>q.classList.remove('sel'))};
document.getElementById('depBtn').onclick=()=>{const a=Math.min(1e6,parseInt(depIn.value)||0);if(!a)return;setBal(getBal()+a);toast('✅ Баланс пополнен на '+a+' ⭐');depOv.classList.remove('show')};

// filter state
let fSel={collection:[],model:[],background:[],pattern:[]};
let curTab='collection',fpSortDir='asc',fpSrchVal='',modelNft=null,fpOpen=false;
let srchVal='',sortDir='asc';

// market render
function applyFilt(lst){
  let r=[...lst];
  if(fSel.collection.length)r=r.filter(x=>fSel.collection.includes(x.name));
  if(fSel.model.length)r=r.filter(x=>fSel.model.includes(x.model));
  if(fSel.background.length)r=r.filter(x=>fSel.background.includes(x.background));
  if(fSel.pattern.length)r=r.filter(x=>fSel.pattern.includes(x.pattern));
  if(srchVal)r=r.filter(x=>x.name.toLowerCase().includes(srchVal.toLowerCase()));
  r.sort((a,b)=>sortDir==='asc'?a.price-b.price:b.price-a.price);
  return r;
}

function renderMkt(){
  const items=applyFilt(getMkt());
  const g=document.getElementById('grid');
  if(!items.length){g.innerHTML='<div class="empty-msg"><i class="fas fa-store" style="font-size:28px;display:block;margin-bottom:10px;opacity:.5"></i>Ничего не найдено</div>';return}
  g.innerHTML=items.map(it=>`<div class="mcard" onclick="openBuy(${it.id})">
    <img src="${imgUrl(it.name)}" alt="${esc(it.name)}" loading="lazy" onerror="this.style.opacity='.25'">
    <div class="mcard-name">${esc(it.name)}</div>
    <div class="mcard-seller"><div class="mcard-av">${esc(it.sAv)}</div><span class="mcard-sname">${esc(it.sName)}</span></div>
    <div class="mcard-price">⭐ ${it.price}</div>
  </div>`).join('');
  updateMScroll();
}

seed();renderMkt();

// scrollbar market
const mScroll=document.getElementById('mScroll'),mThumb=document.getElementById('mThumb'),mTrack=document.getElementById('mTrack');
function updateMScroll(){requestAnimationFrame(()=>{const r=mScroll.clientHeight/mScroll.scrollHeight;if(r>=1){mTrack.style.opacity='0';return}mTrack.style.opacity='1';const tH=mScroll.clientHeight-16;const h=Math.max(24,tH*r);const t=8+(mScroll.scrollTop/(mScroll.scrollHeight-mScroll.clientHeight))*(tH-h);mThumb.style.height=h+'px';mThumb.style.top=t+'px'})}
mScroll.addEventListener('scroll',updateMScroll);new ResizeObserver(updateMScroll).observe(mScroll);

// search/sort
document.getElementById('srch').oninput=e=>{srchVal=e.target.value;renderMkt()};
document.getElementById('sortBtn').onclick=()=>{sortDir=sortDir==='asc'?'desc':'asc';document.getElementById('sortI').className='fas fa-arrow-'+(sortDir==='asc'?'up':'down');renderMkt()};

// buy
const buyOv=document.getElementById('buyOv');let curItem=null;
window.openBuy=function(id){
  const it=getMkt().find(x=>x.id===id);if(!it)return;curItem=it;
  document.getElementById('buyImg').src=imgUrl(it.name);
  document.getElementById('buyName').textContent=it.name;
  document.getElementById('buySeller').innerHTML=`<div class="buy-seller-av">${esc(it.sAv)}</div><span style="font-size:13px;font-weight:600">${esc(it.sName)}</span>`;
  document.getElementById('buyTags').innerHTML=[it.model,it.background,it.pattern].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  document.getElementById('buyPrice').textContent='⭐ '+it.price;
  const btn=document.getElementById('buyBtn');
  if(getBal()<it.price){btn.textContent='Не хватает '+(it.price-getBal())+' ⭐';btn.disabled=true}
  else{btn.textContent='Купить';btn.disabled=false}
  buyOv.classList.add('show');
};
document.getElementById('buyX').onclick=()=>buyOv.classList.remove('show');
buyOv.addEventListener('click',e=>{if(e.target===buyOv)buyOv.classList.remove('show')});
document.getElementById('buyBtn').onclick=()=>{
  if(!curItem)return;
  if(getBal()<curItem.price){toast('❌ Недостаточно звёзд',true);return}
  setBal(getBal()-curItem.price);
  setMkt(getMkt().filter(x=>x.id!==curItem.id));
  const inv=getInv();inv.push({id:Date.now(),name:curItem.name,price:curItem.price,purchaseTime:Date.now()});setInv(inv);
  toast('✅ Куплено «'+curItem.name+'» за '+curItem.price+' ⭐');
  buyOv.classList.remove('show');renderMkt();curItem=null;
};

// filter panel
const fp=document.getElementById('fp');
document.getElementById('filterBtn').onclick=()=>{fpOpen=true;fp.classList.add('open');renderFpList()};
document.getElementById('fpX').onclick=()=>{fpOpen=false;fp.classList.remove('open')};
document.querySelectorAll('.fp-tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.fp-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');curTab=t.dataset.t;modelNft=null;document.getElementById('fpSrch').value='';fpSrchVal='';document.getElementById('fpSort').style.display=curTab==='collection'?'flex':'none';renderFpList()}});
document.getElementById('fpSort').onclick=()=>{fpSortDir=fpSortDir==='asc'?'desc':'asc';document.getElementById('fpSortI').className='fas fa-arrow-'+(fpSortDir==='asc'?'up':'down');renderFpList()};
document.getElementById('fpSrch').oninput=e=>{fpSrchVal=e.target.value;renderFpList()};
document.getElementById('fpReset').onclick=()=>{fSel={collection:[],model:[],background:[],pattern:[]};updateFB();updateBadges();renderFpList();renderMkt();document.getElementById('fpReset').style.display='none'};

function updateFB(){const h=Object.values(fSel).some(a=>a.length>0);const b=document.getElementById('filterBtn');b.style.borderColor=h?'#b87aff':'rgba(184,122,255,.28)';b.style.boxShadow=h?'0 0 10px rgba(184,122,255,.25)':'none'}
function updateBadges(){document.querySelectorAll('.fp-tab').forEach(t=>{const k=t.dataset.t;const c=fSel[k].length;let badge=t.querySelector('.fp-badge');if(c>0){if(!badge){badge=document.createElement('span');badge.className='fp-badge';t.appendChild(badge)}badge.textContent=c}else if(badge)badge.remove()});const tot=Object.values(fSel).reduce((s,a)=>s+a.length,0);document.getElementById('fpReset').style.display=tot>0?'flex':'none'}

function toggle(key,val){const a=fSel[key];const i=a.indexOf(val);if(i>=0)a.splice(i,1);else a.push(val);updateFB();updateBadges();renderFpList();renderMkt()}
window.toggle=toggle;
window.setMNft=function(n){modelNft=n;if(!n){document.getElementById('fpSrch').value='';fpSrchVal=''}renderFpList()};

function renderFpList(){
  const sc=document.getElementById('fpScr');
  if(curTab==='collection'){
    if(!cacheReady){sc.innerHTML='<div class="fp-load"><span class="spin"></span>Загрузка...</div>';return}
    let opts=[...NAMES];
    if(fpSrchVal)opts=opts.filter(o=>o.toLowerCase().includes(fpSrchVal.toLowerCase()));
    opts=fpSortDir==='asc'?[...opts].sort():([...opts].sort().reverse());
    sc.innerHTML=opts.map(n=>{const s=fSel.collection.includes(n);return`<div class="fi${s?' sel':''}" onclick="toggle('collection','${esc(n)}')"><img src="${imgUrl(n)}" loading="lazy" onerror="this.style.opacity='.2'"><div class="fi-name">${esc(n)}</div><div class="fi-chk${s?' on':''}">${s?'<i class="fas fa-check"></i>':''}</div></div>`}).join('');
  }else if(curTab==='model'){
    if(!modelNft){
      const items=fSel.collection.length?NAMES.filter(n=>fSel.collection.includes(n)):NAMES;
      const filt=fpSrchVal?items.filter(n=>n.toLowerCase().includes(fpSrchVal.toLowerCase())):items;
      sc.innerHTML=filt.map(n=>`<div class="fi" onclick="setMNft('${esc(n)}')"><img src="${imgUrl(n)}" loading="lazy" onerror="this.style.opacity='.2'"><div class="fi-name">${esc(n)}</div><i class="fas fa-chevron-right fi-arrow"></i></div>`).join('');
    }else{
      sc.innerHTML=`<div class="back-btn" onclick="setMNft(null)"><i class="fas fa-arrow-left"></i> Назад</div><div class="model-hdr"><img src="${imgUrl(modelNft)}" onerror="this.style.opacity='.2'"><span>${esc(modelNft)}</span></div>`+MODELS.map(m=>{const s=fSel.model.includes(m);return`<div class="fi${s?' sel':''}" onclick="toggle('model','${m}')"><img src="${IMG.model[m]}" loading="lazy"><div style="flex:1"><div class="fi-name">${m}</div><div class="fi-sub">Модель</div></div><div class="fi-chk${s?' on':''}">${s?'<i class="fas fa-check"></i>':''}</div></div>`}).join('');
    }
  }else if(curTab==='background'){
    const opts=fpSrchVal?BACKGROUNDS.filter(o=>o.toLowerCase().includes(fpSrchVal.toLowerCase())):BACKGROUNDS;
    sc.innerHTML=opts.map(b=>{const s=fSel.background.includes(b);return`<div class="fi${s?' sel':''}" onclick="toggle('background','${esc(b)}')"><img src="${IMG.bg[b]}" loading="lazy"><div class="fi-name">${esc(b)}</div><div class="fi-chk${s?' on':''}">${s?'<i class="fas fa-check"></i>':''}</div></div>`}).join('');
  }else{
    const opts=fpSrchVal?PATTERNS.filter(o=>o.toLowerCase().includes(fpSrchVal.toLowerCase())):PATTERNS;
    sc.innerHTML=opts.map(p=>{const s=fSel.pattern.includes(p);return`<div class="fi${s?' sel':''}" onclick="toggle('pattern','${esc(p)}')"><img src="${IMG.pattern[p]}" loading="lazy"><div class="fi-name">${esc(p)}</div><div class="fi-chk${s?' on':''}">${s?'<i class="fas fa-check"></i>':''}</div></div>`}).join('');
  }
  updateFpSB();
}

// fp scrollbar
const fpScr=document.getElementById('fpScr'),fpTrack=document.getElementById('fpTrack'),fpThumb=document.getElementById('fpThumb');
function updateFpSB(){requestAnimationFrame(()=>{const r=fpScr.clientHeight/fpScr.scrollHeight;if(r>=1){fpTrack.style.opacity='0';return}fpTrack.style.opacity='1';const tH=fpScr.clientHeight-16;const h=Math.max(24,tH*r);const t=8+(fpScr.scrollTop/(fpScr.scrollHeight-fpScr.clientHeight))*(tH-h);fpThumb.style.height=h+'px';fpThumb.style.top=t+'px'})}
fpScr.addEventListener('scroll',updateFpSB);new ResizeObserver(updateFpSB).observe(fpScr);

})();
</script>
</body>
</html>
