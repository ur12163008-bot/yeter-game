<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>NFT Market</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#03050a;color:#fff;display:flex;justify-content:center;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 40% 50%,#0a0e1a 0%,#03050a 70%,#000103 100%);z-index:-2}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.star{position:absolute;background:white;border-radius:50%;width:2px;height:2px;opacity:.3}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.orb1{width:340px;height:340px;background:radial-gradient(circle,rgba(148,38,255,.22) 0%,transparent 70%);top:-60px;left:-60px;animation:orb1 8s ease-in-out infinite}
.orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(90,20,200,.18) 0%,transparent 70%);bottom:60px;right:-50px;animation:orb2 10s ease-in-out infinite}
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1);opacity:.12}50%{transform:translate(30px,-20px) scale(1.08);opacity:.18}}
@keyframes orb2{0%,100%{transform:translate(0,0) scale(1);opacity:.08}50%{transform:translate(-25px,30px) scale(1.05);opacity:.14}}
.app{max-width:440px;width:100%;padding-bottom:110px;min-height:100vh;position:relative;z-index:1}
.notif{position:fixed;top:20px;right:20px;padding:11px 18px;border-radius:60px;background:rgba(0,200,83,.9);color:#fff;font-weight:500;font-size:13px;z-index:3000;transform:translateX(160%);transition:transform .22s;border:.5px solid rgba(255,255,255,.2);pointer-events:none;max-width:280px}
.notif.err{background:#8b1a1a}
.notif.show{transform:translateX(0)}
.profile-header{display:flex;align-items:center;justify-content:space-between;margin:16px 20px 20px;gap:12px}
.profile-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.avatar{width:52px;height:52px;border-radius:18px;background:rgba(106,13,173,.5);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;border:.5px solid rgba(184,122,255,.5);flex-shrink:0;background-size:cover;background-position:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.fullname{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.username-txt{font-size:13px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balance-block{display:flex;align-items:center;gap:8px;background:rgba(18,18,34,.92);border:.5px solid rgba(138,43,226,.2);border-radius:40px;padding:6px 8px 6px 14px;flex-shrink:0}
.balance-val{font-weight:600;font-size:15px;display:flex;align-items:center;gap:4px}
.plus-btn{background:rgba(255,255,255,.1);border:.5px solid rgba(138,43,226,.38);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#b87aff;font-size:20px;font-weight:300;cursor:pointer}
.plus-btn:active{background:rgba(106,13,173,.6);transform:scale(.92)}
.search-row{display:flex;gap:10px;margin:0 20px 14px;align-items:center}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:60px;padding:10px 14px}
.search-box input{background:transparent;border:none;color:#fff;font-size:14px;outline:none;width:100%;font-family:inherit}
.search-box i{color:rgba(255,255,255,.35);font-size:13px}
.icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(184,122,255,.28);border-radius:60px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#b87aff;font-size:15px;flex-shrink:0}
.icon-btn:active{transform:scale(.92)}
.icon-btn.active{border-color:#b87aff;box-shadow:0 0 10px rgba(184,122,255,.25)}
.market-wrap{margin:0 20px;background:rgba(13,14,24,.9);border:1px solid rgba(138,43,226,.2);border-radius:28px;padding:16px;position:relative}
.market-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:rgba(18,18,36,.92);border:1px solid rgba(138,43,226,.2);border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.mcard:active{transform:scale(.94)}
.mcard img{width:100px;height:100px;border-radius:16px;object-fit:cover;margin-bottom:10px;background:rgba(40,25,65,.6)}
.mcard-name{font-size:12px;font-weight:500;text-align:center;margin-bottom:5px;color:rgba(255,255,255,.88);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard-seller{display:flex;align-items:center;gap:5px;margin-bottom:6px;width:100%;justify-content:center}
.mcard-avatar{width:16px;height:16px;border-radius:4px;background:rgba(88,10,148,.55);border:1px solid rgba(184,122,255,.45);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}
.mcard-sellername{font-size:10px;color:rgba(255,255,255,.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.mcard-price{font-size:13px;font-weight:700;color:#b87aff}
.empty-msg{text-align:center;color:rgba(255,255,255,.48);padding:48px 0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;display:none;justify-content:center;align-items:center}
.overlay.show{display:flex}
.modal-box{max-width:320px;width:88%;background:rgba(14,14,26,.98);border:1px solid rgba(184,122,255,.25);border-radius:28px;padding:24px 20px 22px;position:relative;text-align:center}
.modal-close{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(255,255,255,.08);border:.5px solid rgba(184,122,255,.2);border-radius:50%;color:#b87aff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close:active{background:rgba(184,122,255,.2);transform:scale(.92)}
.modal-nft-img{width:130px;height:130px;border-radius:22px;object-fit:cover;margin:0 auto 16px;display:block}
.modal-title{font-size:18px;font-weight:700;margin-bottom:10px}
.modal-seller{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:12px;padding:8px 14px;background:rgba(255,255,255,.04);border-radius:16px}
.modal-seller-av{width:28px;height:28px;border-radius:8px;background:rgba(88,10,148,.55);border:1px solid rgba(184,122,255,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tag{background:rgba(88,10,148,.25);border:1px solid rgba(184,122,255,.22);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
.modal-price{font-size:20px;font-weight:800;color:#b87aff;margin-bottom:18px}
.buy-btn{background:linear-gradient(135deg,rgba(106,13,173,.9),rgba(148,38,255,.7));border:1px solid rgba(184,122,255,.4);border-radius:60px;padding:13px 24px;width:100%;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.buy-btn:disabled{opacity:.6;cursor:not-allowed}
.buy-btn:not(:disabled):active{transform:scale(.97)}
.dep-modal{max-width:360px;width:90%;background:rgba(20,20,35,.85);backdrop-filter:blur(40px);border:.5px solid rgba(255,255,255,.2);border-radius:32px;padding:28px 20px 24px;position:relative}
.dep-title{font-size:24px;font-weight:600;text-align:center;margin-bottom:24px}
.quick-amounts{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.qa{background:rgba(106,13,173,.2);border:.5px solid rgba(184,122,255,.3);border-radius:30px;padding:8px 14px;font-size:13px;font-weight:600;color:#b87aff;cursor:pointer;min-width:70px;text-align:center}
.qa:active{background:rgba(106,13,173,.4);transform:scale(.95)}
.qa.selected{background:rgba(88,10,148,.5);border-color:#b87aff;color:#fff}
.amount-input{width:100%;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.15);border-radius:20px;padding:14px 18px;font-size:18px;color:#fff;outline:none;margin-bottom:18px;font-family:inherit}
.amount-input:focus{border-color:rgba(184,122,255,.6)}
.dep-btn{background:rgba(106,13,173,.7);border:.5px solid rgba(184,122,255,.4);border-radius:60px;padding:14px 22px;width:100%;color:#fff;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.dep-btn:active{transform:scale(.97)}
.dep-btn span:last-child{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:30px;font-size:15px}
.filter-panel{position:fixed;inset:0;background:rgba(8,8,18,.98);z-index:1500;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);pointer-events:none}
.filter-panel.open{transform:translateY(0);pointer-events:auto}
.fp-inner{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;overflow:hidden}
.fp-header{display:flex;justify-content:center;align-items:center;position:relative;padding:22px 20px 12px;flex-shrink:0}
.fp-header h3{font-size:18px;font-weight:700}
.fp-close{position:absolute;right:12px;top:18px;width:28px;height:28px;background:rgba(255,255,255,.08);border:1px solid rgba(184,122,255,.22);border-radius:50%;color:#b87aff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fp-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 20px 16px;flex-shrink:0}
.fp-tab{background:rgba(255,255,255,.06);border:1px solid rgba(184,122,255,.22);border-radius:40px;padding:9px 4px;font-size:12px;font-weight:500;color:rgba(255,255,255,.48);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.fp-tab.active{background:rgba(88,10,148,.5);border-color:#b87aff;color:#fff}
.fp-badge{background:#b87aff;color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:0 5px;min-width:14px;text-align:center}
.fp-search{display:flex;gap:10px;margin:0 20px 12px;flex-shrink:0}
.fp-search .search-box{flex:1}
.fp-reset{display:flex;align-items:center;gap:8px;margin:0 20px 12px;background:rgba(180,30,30,.12);border:1px solid rgba(220,50,50,.25);border-radius:40px;padding:8px 18px;color:rgba(255,120,120,.85);font-size:13px;font-weight:600;cursor:pointer;justify-content:center}
.fp-list{flex:1;overflow-y:auto;padding:0 20px 30px}
.fi{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:16px;cursor:pointer;margin-bottom:8px}
.fi.sel{background:rgba(88,10,148,.25);border-color:rgba(184,122,255,.4)}
.fi img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:rgba(40,25,65,.6);flex-shrink:0}
.fi-name{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-sub{font-size:12px;color:#b87aff;font-weight:600;margin-top:2px}
.fi-check{width:22px;height:22px;border-radius:7px;border:1px solid rgba(184,122,255,.3);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0}
.fi-check.chk{background:#b87aff;border-color:#b87aff}
.fi-arrow{color:#b87aff;font-size:12px}
.back-btn{display:flex;align-items:center;gap:8px;color:#b87aff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}
.model-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;font-weight:600}
.model-header img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.fp-loading{text-align:center;color:rgba(255,255,255,.48);padding:36px 0;font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(184,122,255,.3);border-top-color:#b87aff;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-nav{position:fixed;bottom:18px;left:18px;right:18px;max-width:404px;margin:0 auto;background:rgba(12,12,22,.95);border:1px solid rgba(184,122,255,.16);border-radius:28px;display:flex;justify-content:space-around;padding:8px 16px;z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.48);font-size:10px;font-weight:500;cursor:pointer;padding:6px 14px;border-radius:22px;min-width:70px;text-decoration:none;background:transparent;border:none;font-family:inherit}
.nav-item i{font-size:20px;color:rgba(255,255,255,.48)}
.nav-item.active{background:rgba(106,13,173,.2);color:#b87aff}
.nav-item.active i{color:#b87aff}
.nav-item:active{background:rgba(106,13,173,.2)}
</style>
</head>
<body>
<div id="stars"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="notif" id="notif"></div>

<div class="app">
  <div class="profile-header">
    <div class="profile-left">
      <div class="avatar" id="avatar">И</div>
      <div>
        <div class="fullname" id="fullname">Игрок</div>
        <div class="username-txt" id="usernametxt">@player</div>
      </div>
    </div>
    <div class="balance-block">
      <div class="balance-val">⭐ <span id="balVal">5000</span></div>
      <div class="plus-btn" id="plusBtn">+</div>
    </div>
  </div>

  <div class="search-row">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Поиск NFT...">
    </div>
    <div class="icon-btn" id="filterBtn"><i class="fas fa-sliders-h"></i></div>
    <div class="icon-btn" id="sortBtn"><i class="fas fa-arrow-up" id="sortIcon"></i></div>
  </div>

  <div class="market-wrap">
    <div class="market-grid" id="marketGrid"></div>
  </div>

  <div class="bottom-nav">
    <a href="market.html" class="nav-item active"><i class="fas fa-store"></i><span>МАРКЕТ</span></a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
  </div>
</div>

<div class="overlay" id="buyOverlay">
  <div class="modal-box">
    <div class="modal-close" id="buyClose">✕</div>
    <img src="" alt="" class="modal-nft-img" id="buyImg">
    <div class="modal-title" id="buyName"></div>
    <div class="modal-seller" id="buySeller"></div>
    <div class="tags" id="buyTags"></div>
    <div class="modal-price" id="buyPrice"></div>
    <button class="buy-btn" id="buyBtn">Купить</button>
  </div>
</div>

<div class="overlay" id="depOverlay">
  <div class="dep-modal">
    <div class="modal-close" id="depClose">✕</div>
    <div class="dep-title">Пополнение</div>
    <div class="quick-amounts" id="quickAmounts"></div>
    <input type="text" class="amount-input" id="depInput" placeholder="Введите количество звёзд" inputmode="numeric">
    <button class="dep-btn" id="depBtn"><span>Пополнить</span><span id="depAmt">0 ⭐</span></button>
  </div>
</div>

<div class="filter-panel" id="filterPanel">
  <div class="fp-inner">
    <div class="fp-header">
      <h3>Фильтры</h3>
      <div class="fp-close" id="fpClose">×</div>
    </div>
    <div class="fp-tabs" id="fpTabs"></div>
    <div class="fp-search">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="fpSearch" placeholder="Поиск...">
      </div>
      <div class="icon-btn" id="fpSortBtn" style="display:none"><i class="fas fa-arrow-up" id="fpSortIcon"></i></div>
    </div>
    <button class="fp-reset" id="fpReset" style="display:none"><i class="fas fa-rotate-left"></i> Сбросить всё</button>
    <div class="fp-list" id="fpList"></div>
  </div>
</div>

const BAL_KEY = 'nft_balance';
const MARKET_KEY = 'nft_market_listings';

function getBalance(){ try{ return parseInt(localStorage.getItem(BAL_KEY))||5000; }catch{ return 5000; } }

function saveInv(d){ localStorage.setItem(INV_KEY, JSON.stringify(d)); }

function seedMarket(){
  if(getMarket().length > 0) return;
  const listings = COLLECTION_NAMES.map((name,i)=>{
    const s = FAKE_SELLERS[i % FAKE_SELLERS.length];
    return {id:i+1,nftName:name,price:BASE_PRICES[i%BASE_PRICES.length],
      sellerId:s.id,sellerName:s.name,sellerAvatar:s.av,
      pattern:PATTERNS[i%4],background:BACKGROUNDS[i%4],model:MODELS[i%4],
      listedAt:Date.now()};
  });
  saveMarket(listings);
}

for(let i=0;i<40;i++){ let s=document.createElement('div'); s.className='star'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; document.getElementById('stars').appendChild(s); }

const notifEl = document.getElementById('notif');
let notifTimer;
function showNotif(msg, isErr=false){
  clearTimeout(notifTimer);
  notifEl.textContent = msg;
  notifEl.className = 'notif' + (isErr?' err':'') + ' show';
  notifTimer = setTimeout(()=>notifEl.classList.remove('show'), 2400);
}

const tg = window.Telegram?.WebApp;
let tgUser = {firstName:'Игрок',lastName:'',username:'@player',avatarChar:'И',fullName:'Игрок',photoUrl:null};
if(tg?.initDataUnsafe?.user){
  const u = tg.initDataUnsafe.user;
  tgUser.firstName = u.first_name||'Игрок';
  tgUser.lastName = u.last_name||'';
  tgUser.fullName = (tgUser.firstName+' '+tgUser.lastName).trim();
  tgUser.username = u.username ? '@'+u.username : '@'+tgUser.firstName.toLowerCase();
  tgUser.avatarChar = tgUser.firstName.charAt(0).toUpperCase();
  tgUser.photoUrl = u.photo_url||null;
}
document.getElementById('fullname').textContent = tgUser.fullName;
document.getElementById('usernametxt').textContent = tgUser.username;
const avEl = document.getElementById('avatar');
if(tgUser.photoUrl){ avEl.innerHTML=`<img src="${tgUser.photoUrl}" alt="">`; }
else{ avEl.textContent = tgUser.avatarChar; }

function updateBalUI(){ document.getElementById('balVal').textContent = getBalance(); }
updateBalUI();

const depOverlay = document.getElementById('depOverlay');
const depInput = document.getElementById('depInput');
const depAmt = document.getElementById('depAmt');
document.getElementById('plusBtn').addEventListener('click',()=>{
  depInput.value=''; depAmt.textContent='0 ⭐';
  document.querySelectorAll('.qa').forEach(q=>q.classList.remove('selected'));
  depOverlay.classList.add('show');
});
document.getElementById('depClose').addEventListener('click',()=>depOverlay.classList.remove('show'));
depOverlay.addEventListener('click',e=>{ if(e.target===depOverlay) depOverlay.classList.remove('show'); });
const qaDiv = document.getElementById('quickAmounts');
[50,100,200,500,1000,2000].forEach(a=>{
  let btn=document.createElement('span'); btn.className='qa'; btn.textContent=a+' ⭐'; btn.dataset.a=a;
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.qa').forEach(x=>x.classList.remove('selected'));
    btn.classList.add('selected');
    depInput.value = a;
    depAmt.textContent = a+' ⭐';
  });
  qaDiv.appendChild(btn);
});
depInput.addEventListener('input',e=>{
  let v = e.target.value.replace(/\D/g,'');
  e.target.value = v;
  depAmt.textContent = (v||'0')+' ⭐';
  document.querySelectorAll('.qa').forEach(q=>q.classList.remove('selected'));
});
document.getElementById('depBtn').addEventListener('click',()=>{
  let amt = Math.min(100000, Math.max(0, parseInt(depInput.value)||0));
  if(!amt) return;
  setBalance(getBalance()+amt);
  showNotif(`✅ Баланс пополнен на ${amt} ⭐`);
  depOverlay.classList.remove('show');
});

let imgCache = {};
let imagesReady = false;
let loadedCount = 0;
COLLECTION_NAMES.forEach(name=>{
  let cached = localStorage.getItem('img_'+name);
  if(cached){ imgCache[name]=cached; loadedCount++; }
});
if(loadedCount === COLLECTION_NAMES.length) imagesReady=true;
COLLECTION_NAMES.forEach(name=>{
  if(imgCache[name]) return;
  fetch(nftImg(name)).then(r=>r.blob()).then(blob=>{
    let reader=new FileReader();
    reader.onloadend=()=>{
      imgCache[name]=reader.result;
      localStorage.setItem('img_'+name,reader.result);
      loadedCount++;
      if(loadedCount===COLLECTION_NAMES.length) imagesReady=true;
    };
    reader.readAsDataURL(blob);
  }).catch(()=>{ loadedCount++; });
});
function getImgUrl(name){ return imgCache[name] || nftImg(name); }

let filterSel = {collection:[],model:[],background:[],pattern:[]};
let curTab = 'collection';
let fpSortDir = 'asc';
let fpSearch = '';
let modelNft = null;
let searchVal = '';
let sortDir = 'asc';
let currentListing = null;

function renderMarket(){
  let items = [...getMarket()];
  if(filterSel.collection.length) items=items.filter(x=>filterSel.collection.includes(x.nftName));
  if(filterSel.model.length) items=items.filter(x=>filterSel.model.includes(x.model));
  if(filterSel.background.length) items=items.filter(x=>filterSel.background.includes(x.background));
  if(filterSel.pattern.length) items=items.filter(x=>filterSel.pattern.includes(x.pattern));
  if(searchVal) items=items.filter(x=>x.nftName.toLowerCase().includes(searchVal.toLowerCase()));
  items.sort((a,b)=>sortDir==='asc'?a.price-b.price:b.price-a.price);
  const grid = document.getElementById('marketGrid');
  if(!items.length){
    grid.innerHTML='<div class="empty-msg"><i class="fas fa-store" style="font-size:28px;margin-bottom:10px;display:block;opacity:.5"></i>Товаров не найдено</div>';
    return;
  }
  grid.innerHTML = items.map(item=>`
    <div class="mcard" data-id="${item.id}" onclick="openBuyModal(${item.id})">
      <img src="${getImgUrl(item.nftName)}" alt="${item.nftName}" loading="lazy" onerror="this.style.opacity='.3'">
      <div class="mcard-name">${item.nftName}</div>
      <div class="mcard-seller">
        <div class="mcard-avatar">${item.sellerAvatar}</div>
        <span class="mcard-sellername">${item.sellerName}</span>
      </div>
      <div class="mcard-price">⭐ ${item.price}</div>
    </div>
  `).join('');
}
window.openBuyModal = function(id){
  let item = getMarket().find(l=>l.id===id);
  if(!item) return;
  currentListing = item;
  document.getElementById('buyImg').src = getImgUrl(item.nftName);
  document.getElementById('buyName').textContent = item.nftName;
  document.getElementById('buySeller').innerHTML = `<div class="modal-seller-av">${item.sellerAvatar}</div><span style="font-size:13px;font-weight:600">${item.sellerName}</span>`;
  document.getElementById('buyTags').innerHTML = [item.model,item.background,item.pattern].filter(Boolean).map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('buyPrice').textContent = '⭐ '+item.price;
  let btn = document.getElementById('buyBtn');
  if(getBalance() < item.price){
    btn.textContent = `Не хватает ${item.price-getBalance()} ⭐`;
    btn.disabled = true;
  } else {
    btn.textContent = 'Купить';
    btn.disabled = false;
  }
  document.getElementById('buyOverlay').classList.add('show');
};
document.getElementById('buyClose').addEventListener('click',()=>document.getElementById('buyOverlay').classList.remove('show'));
document.getElementById('buyOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) document.getElementById('buyOverlay').classList.remove('show'); });
document.getElementById('buyBtn').addEventListener('click',()=>{
  if(!currentListing) return;
  let bal = getBalance();
  if(bal < currentListing.price){ showNotif('❌ Недостаточно звёзд!', true); return; }
  setBalance(bal - currentListing.price);
  let listings = getMarket().filter(l=>l.id!==currentListing.id);
  saveMarket(listings);
  let inv = getInv();
  inv.push({id:Date.now()+Math.random(),name:currentListing.nftName,price:currentListing.price,image:nftImg(currentListing.nftName),purchaseTime:Date.now()});
  saveInv(inv);
  showNotif(`✅ Куплено «${currentListing.nftName}» за ${currentListing.price} ⭐`);
  document.getElementById('buyOverlay').classList.remove('show');
  renderMarket();
  currentListing = null;
});

document.getElementById('searchInput').addEventListener('input',e=>{ searchVal=e.target.value; renderMarket(); });
document.getElementById('sortBtn').addEventListener('click',()=>{
  sortDir = sortDir==='asc'?'desc':'asc';
  document.getElementById('sortIcon').className = 'fas fa-arrow-'+(sortDir==='asc'?'up':'down');
  renderMarket();
});

const filterPanel = document.getElementById('filterPanel');
document.getElementById('filterBtn').addEventListener('click',()=>{ filterPanel.classList.add('open'); renderFilterContent(); });
document.getElementById('fpClose').addEventListener('click',()=>{ filterPanel.classList.remove('open'); });

function renderFilterTabs(){
  const tabs = [{key:'collection',label:'Коллекция'},{key:'model',label:'Модель'},{key:'background',label:'Фон'},{key:'pattern',label:'Узор'}];
  document.getElementById('fpTabs').innerHTML = tabs.map(t=>`
    <button class="fp-tab ${curTab===t.key?'active':''}" data-tab="${t.key}" onclick="setFilterTab('${t.key}')">
      ${t.label}${filterSel[t.key].length?`<span class="fp-badge">${filterSel[t.key].length}</span>`:''}
    </button>
  `).join('');
  let total = Object.values(filterSel).reduce((s,a)=>s+a.length,0);
  document.getElementById('fpReset').style.display = total?'flex':'none';
  document.getElementById('fpSortBtn').style.display = curTab==='collection'?'flex':'none';
}
window.setFilterTab = function(tab){ curTab=tab; modelNft=null; document.getElementById('fpSearch').value=''; fpSearch=''; renderFilterContent(); };
document.getElementById('fpSearch').addEventListener('input',e=>{ fpSearch=e.target.value; renderFilterContent(); });
document.getElementById('fpSortBtn').addEventListener('click',()=>{
  fpSortDir = fpSortDir==='asc'?'desc':'asc';
  document.getElementById('fpSortIcon').className = 'fas fa-arrow-'+(fpSortDir==='asc'?'up':'down');
  renderFilterContent();
});
document.getElementById('fpReset').addEventListener('click',()=>{
  filterSel={collection:[],model:[],background:[],pattern:[]};
  renderFilterTabs(); renderFilterContent(); renderMarket();
});

function renderFilterContent(){
  const listDiv = document.getElementById('fpList');
  if(curTab==='collection'){
    if(!imagesReady){
      listDiv.innerHTML='<div class="fp-loading"><span class="spinner"></span>Загрузка коллекции...</div>';
      return;
    }
    let opts = [...COLLECTION_NAMES];
    if(fpSearch) opts=opts.filter(o=>o.toLowerCase().includes(fpSearch.toLowerCase()));
    opts = fpSortDir==='asc'?opts.sort():opts.sort().reverse();
    listDiv.innerHTML = opts.map(name=>{
      let sel = filterSel.collection.includes(name);
      return `<div class="fi ${sel?'sel':''}" onclick="toggleFilter('collection','${name.replace(/'/g,"\\'")}')">
        <img src="${getImgUrl(name)}" loading="lazy" onerror="this.style.opacity='.3'">
        <div class="fi-name">${name}</div>
        <div class="fi-check ${sel?'chk':''}">${sel?'<i class="fas fa-check"></i>':''}</div>
      </div>`;
    }).join('');
  } else if(curTab==='model'){
    if(!modelNft){
      let items = filterSel.collection.length ? COLLECTION_NAMES.filter(n=>filterSel.collection.includes(n)) : COLLECTION_NAMES;
      if(fpSearch) items=items.filter(n=>n.toLowerCase().includes(fpSearch.toLowerCase()));
      listDiv.innerHTML = items.map(name=>`
        <div class="fi" onclick="setModelNft('${name.replace(/'/g,"\\'")}')">
          <img src="${getImgUrl(name)}" loading="lazy" onerror="this.style.opacity='.3'">
          <div class="fi-name">${name}</div>
          <i class="fas fa-chevron-right fi-arrow"></i>
        </div>
      `).join('');
    } else {
      listDiv.innerHTML = `<div class="back-btn" onclick="setModelNft(null)"><i class="fas fa-arrow-left"></i> Назад</div>
        <div class="model-header"><img src="${getImgUrl(modelNft)}" onerror="this.style.opacity='.3'"><span>${modelNft}</span></div>` +
        MODELS.map(m=>{
          let sel = filterSel.model.includes(m);
          return `<div class="fi ${sel?'sel':''}" onclick="toggleFilter('model','${m}')">
            <img src="${MODEL_IMG[m]}" loading="lazy">
            <div class="fi-name">${m}</div>
            <div class="fi-check ${sel?'chk':''}">${sel?'<i class="fas fa-check"></i>':''}</div>
          </div>`;
        }).join('');
    }
  } else if(curTab==='background'){
    let opts = fpSearch?BACKGROUNDS.filter(o=>o.toLowerCase().includes(fpSearch.toLowerCase())):BACKGROUNDS;
    listDiv.innerHTML = opts.map(bg=>{
      let sel = filterSel.background.includes(bg);
      return `<div class="fi ${sel?'sel':''}" onclick="toggleFilter('background','${bg}')">
        <img src="${BG_IMG[bg]}" loading="lazy">
        <div class="fi-name">${bg}</div>
        <div class="fi-check ${sel?'chk':''}">${sel?'<i class="fas fa-check"></i>':''}</div>
      </div>`;
    }).join('');
  } else if(curTab==='pattern'){
    let opts = fpSearch?PATTERNS.filter(o=>o.toLowerCase().includes(fpSearch.toLowerCase())):PATTERNS;
    listDiv.innerHTML = opts.map(pt=>{
      let sel = filterSel.pattern.includes(pt);
      return `<div class="fi ${sel?'sel':''}" onclick="toggleFilter('pattern','${pt}')">
        <img src="${PATTERN_IMG[pt]}" loading="lazy">
        <div class="fi-name">${pt}</div>
        <div class="fi-check ${sel?'chk':''}">${sel?'<i class="fas fa-check"></i>':''}</div>
      </div>`;
    }).join('');
  }
}
window.toggleFilter = function(tab,val){
  let arr = filterSel[tab];
  let idx = arr.indexOf(val);
  if(idx>=0) arr.splice(idx,1); else arr.push(val);
  renderFilterTabs(); renderFilterContent(); renderMarket();
};
window.setModelNft = function(name){ modelNft=name; if(!name){ document.getElementById('fpSearch').value=''; fpSearch=''; } renderFilterContent(); };

seedMarket();
renderMarket();
renderFilterTabs();
})();
</script>
</body>
</html>
