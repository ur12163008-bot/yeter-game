<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YETER · PROFILE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #03050a;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .app {
            max-width: 440px;
            width: 100%;
            padding-bottom: 90px;
            position: relative;
        }

        /* Верхняя плашка с балансом */
        .top-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 20px 10px;
        }

        .balance-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 14, 22, 0.8);
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(138, 43, 226, 0.4);
        }

        .balance-stars {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 18px;
            color: white;
        }

        .puzzle-icon {
            color: #ffd700;
            font-size: 18px;
        }

        .add-balance-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Профиль */
        .profile-full {
            background: rgba(10, 14, 22, 0.6);
            margin: 5px 20px 0;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border: 1px solid rgba(138, 43, 226, 0.2);
        }

        .sticky-profile {
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(138, 43, 226, 0.2);
        }

        .avatar-profile {
            width: 100px;
            height: 100px;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            margin-bottom: 16px;
            background-size: cover;
            background-position: center;
            background-color: #6a0dad;
        }

        .profile-name-center {
            font-size: 26px;
            font-weight: 800;
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        .profile-level-section {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .level-badge-profile {
            background: linear-gradient(145deg, #6a0dad, #4b0082);
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: white;
            box-shadow: 0 4px 0 #2d0b4e;
            flex-shrink: 0;
        }

        .progress-bar-full {
            flex: 1;
            height: 12px;
            background: rgba(30, 38, 48, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }

        .progress-fill-full {
            height: 100%;
            background: linear-gradient(90deg, #9b4dff, #b87aff);
            border-radius: 20px;
            transition: width 0.2s ease;
        }

        .next-level-number-profile {
            background: rgba(42, 30, 58, 0.9);
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #b87aff;
            border: 1px solid rgba(155, 77, 255, 0.3);
            flex-shrink: 0;
        }

        .profile-content {
            padding: 20px 20px 40px;
        }

        /* Секция подарков */
        .gifts-section {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 28px;
            padding: 20px;
        }

        .gifts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .gifts-title {
            color: #8e98a3;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .view-all-btn {
            background: rgba(106, 13, 173, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 40px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-gifts {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
        }

        .empty-gifts p {
            color: #8e98a3;
            font-size: 14px;
        }

        .add-gift-btn {
            width: 100%;
            background: rgba(106, 13, 173, 0.1);
            border: 2px dashed rgba(138, 43, 226, 0.3);
            border-radius: 40px;
            padding: 14px;
            color: #b87aff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .gift-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .gift-image {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(155, 77, 255, 0.3);
        }

        .gift-name {
            font-size: 12px;
            font-weight: 600;
            color: white;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .gift-price {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 13px;
            font-weight: 700;
            color: #b87aff;
        }

        .gift-price .puzzle-icon {
            font-size: 11px;
            color: #b87aff;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .gift-modal {
            width: 300px;
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.5);
            border-radius: 32px;
            padding: 24px 20px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(155, 77, 255, 0.3);
            color: #b87aff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .modal-image {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            margin: 10px auto 15px;
            display: block;
            border: 2px solid rgba(155, 77, 255, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 700;
            color: #b87aff;
            margin-bottom: 20px;
        }

        .modal-price .puzzle-icon {
            font-size: 18px;
            color: #b87aff;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .withdraw-btn {
            width: 100%;
            background: #2a2a2a;
            border: none;
            border-radius: 40px;
            padding: 14px;
            color: #8e98a3;
            font-size: 15px;
            font-weight: 600;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .withdraw-btn.active {
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #2d0b4e;
        }

        .lock-icon {
            color: #8e98a3;
            font-size: 14px;
        }

        .timer-text {
            color: #8e98a3;
            font-size: 14px;
            font-weight: 500;
        }

        .minutes {
            color: #8e98a3;
            font-size: 12px;
            margin-left: 2px;
        }

        .withdraw-text-below {
            text-align: center;
            font-size: 12px;
            color: #8e98a3;
            margin-top: -5px;
        }

        .upgrade-btn {
            width: 100%;
            background: linear-gradient(145deg, #9b4dff, #6a0dad);
            border: none;
            border-radius: 40px;
            padding: 14px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #2d0b4e;
        }

        /* Модальное окно инвентаря */
        .inventory-modal {
            width: 92%;
            max-width: 380px;
            max-height: 70vh;
            background: linear-gradient(145deg, #1a1028, #0f0a18);
            border: 2px solid rgba(155, 77, 255, 0.5);
            border-radius: 32px;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        .inventory-modal .modal-close {
            top: 12px;
            right: 12px;
        }

        .inventory-title {
            color: #8e98a3;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: rgba(10, 14, 22, 0.9);
            display: flex;
            justify-content: space-around;
            padding: 10px 6px;
            border-radius: 40px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            margin-bottom: 16px;
            width: calc(100% - 40px);
            left: 20px;
            right: 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8e98a3;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 30px;
            flex: 1;
            text-align: center;
            text-decoration: none;
        }

        .nav-item i {
            font-size: 20px;
            color: #8e98a3;
        }

        .nav-item.active {
            color: #b87aff;
            background: rgba(106, 13, 173, 0.2);
        }

        .nav-item.active i {
            color: #b87aff;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Верхний баланс -->
        <div class="top-header">
            <div class="balance-wrapper">
                <div class="balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceDisplay">0</span>
                </div>
                <div class="add-balance-btn" id="addBalanceBtn">+</div>
            </div>
        </div>

        <!-- Профиль -->
        <div class="profile-full">
            <div class="sticky-profile">
                <div class="avatar-profile" id="profileAvatar"></div>
                <div class="profile-name-center" id="profileName">Загрузка...</div>

                <div class="profile-level-section">
                    <div class="level-badge-profile" id="profileLevelNumber">1</div>
                    <div class="progress-bar-full">
                        <div class="progress-fill-full" id="profileProgressFill" style="width: 0%;"></div>
                    </div>
                    <div class="next-level-number-profile" id="profileNextLevel">2</div>
                </div>
            </div>

            <div class="profile-content">
                <!-- Секция подарков -->
                <div class="gifts-section">
                    <div class="gifts-header">
                        <span class="gifts-title">ВАШИ ПОДАРКИ</span>
                        <div class="view-all-btn" id="viewAllBtn">›</div>
                    </div>
                    <div id="giftsContainer"></div>
                </div>
            </div>
        </div>

        <!-- Модальное окно всех подарков -->
        <div class="modal-overlay" id="inventoryModal">
            <div class="inventory-modal">
                <div class="modal-close" id="closeInventoryModal">✖</div>
                <div class="inventory-title">ВСЕ ПОДАРКИ</div>
                <div class="inventory-grid" id="inventoryGrid"></div>
            </div>
        </div>

        <!-- Модальное окно подарка -->
        <div class="modal-overlay" id="giftModal">
            <div class="gift-modal">
                <div class="modal-close" id="closeGiftModal">✖</div>
                <img src="" alt="" class="modal-image" id="modalImage">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-price" id="modalPrice"></div>
                <div class="modal-buttons">
                    <button class="withdraw-btn" id="withdrawBtn"></button>
                    <div class="withdraw-text-below" id="withdrawText"></div>
                    <button class="upgrade-btn" id="upgradeBtn">УЛУЧШИТЬ</button>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-gamepad"></i><span>ИГРЫ</span></a>
            <a href="shop.html" class="nav-item"><i class="fas fa-store"></i><span>МАГАЗИН</span></a>
            <a href="leaders.html" class="nav-item"><i class="fas fa-trophy"></i><span>ЛИДЕРЫ</span></a>
            <a href="profle.html" class="nav-item active"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        
        // Данные пользователя
        let userData = {
            id: null,
            firstName: '',
            lastName: '',
            avatarUrl: null,
            balance: 1250,
            level: 1,
            exp: 0,
            expToNext: 1000
        };

        // Инвентарь подарков
        let inventory = [];

        // Таймеры
        let withdrawTimers = {};

        // Загрузка данных
        function loadData() {
            try {
                const savedInventory = localStorage.getItem('yeter_inventory');
                if (savedInventory) {
                    inventory = JSON.parse(savedInventory);
                    
                    // Проверяем таймеры
                    let updated = false;
                    inventory = inventory.map(gift => {
                        if (gift.withdrawEnd && gift.withdrawEnd <= Date.now()) {
                            gift.withdrawEnd = null;
                            updated = true;
                        }
                        return gift;
                    });
                    if (updated) saveInventory();
                }

                const savedData = localStorage.getItem('yeter_user_data');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    userData.balance = data.stars || 1250;
                    userData.level = data.level || 1;
                    userData.exp = data.exp || 0;
                    userData.expToNext = data.expToNext || 1000;
                }
            } catch (e) {}
        }

        function saveInventory() {
            localStorage.setItem('yeter_inventory', JSON.stringify(inventory));
        }

        // Telegram данные
        if (tg) {
            tg.ready();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                userData.id = user.id;
                userData.firstName = user.first_name || '';
                userData.lastName = user.last_name || '';
                
                const fullName = (userData.firstName + ' ' + userData.lastName).trim() || 'Игрок';
                document.getElementById('profileName').innerText = fullName;
                
                if (user.photo_url) {
                    document.getElementById('profileAvatar').style.backgroundImage = `url('${user.photo_url}')`;
                    document.getElementById('profileAvatar').style.backgroundColor = 'transparent';
                    document.getElementById('profileAvatar').innerHTML = '';
                } else {
                    document.getElementById('profileAvatar').innerHTML = (userData.firstName.charAt(0) || 'П').toUpperCase();
                }
            }
        }

        // Обновление UI
        function updateUI() {
            document.getElementById('balanceDisplay').innerText = userData.balance;
            document.getElementById('profileLevelNumber').innerText = userData.level;
            document.getElementById('profileNextLevel').innerText = userData.level + 1;
            
            const progress = (userData.exp / userData.expToNext) * 100;
            document.getElementById('profileProgressFill').style.width = progress + '%';
            
            renderGifts();
            renderInventoryGrid();
            
            const viewAllBtn = document.getElementById('viewAllBtn');
            viewAllBtn.style.display = inventory.length > 0 ? 'flex' : 'none';
        }

        // Отрисовка первых 2 подарков
        function renderGifts() {
            const container = document.getElementById('giftsContainer');
            
            if (inventory.length === 0) {
                container.innerHTML = `
                    <div class="empty-gifts">
                        <p>У вас пока нет подарков</p>
                        <button class="add-gift-btn" onclick="window.location.href='shop.html'">
                            + Добавить подарок
                        </button>
                    </div>
                `;
            } else {
                let html = '<div class="gifts-grid">';
                inventory.slice(0, 2).forEach((gift, index) => {
                    html += `
                        <div class="gift-card" onclick="openGiftModal(${index})">
                            <img src="${gift.image || 'nft/placeholder.png'}" class="gift-image" alt="${gift.name}">
                            <span class="gift-name">${gift.name}</span>
                            <span class="gift-price">
                                <span class="puzzle-icon">🧩</span>
                                ${gift.price}
                            </span>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
        }

        // Отрисовка всех подарков
        function renderInventoryGrid() {
            const grid = document.getElementById('inventoryGrid');
            
            if (inventory.length === 0) {
                grid.innerHTML = '<div style="text-align: center; color: #8e98a3; grid-column: 1/3; padding: 20px;">Нет подарков</div>';
                return;
            }
            
            grid.innerHTML = inventory.map((gift, index) => `
                <div class="gift-card" onclick="openGiftModal(${index})">
                    <img src="${gift.image || 'nft/placeholder.png'}" class="gift-image" alt="${gift.name}">
                    <span class="gift-name">${gift.name}</span>
                    <span class="gift-price">
                        <span class="puzzle-icon">🧩</span>
                        ${gift.price}
                    </span>
                </div>
            `).join('');
        }

        // Открытие модалки подарка
        function openGiftModal(index) {
            const gift = inventory[index];
            if (!gift) return;

            document.getElementById('modalImage').src = gift.image || 'nft/placeholder.png';
            document.getElementById('modalTitle').innerText = gift.name;
            document.getElementById('modalPrice').innerHTML = `<span class="puzzle-icon">🧩</span> ${gift.price}`;

            const withdrawBtn = document.getElementById('withdrawBtn');
            const withdrawText = document.getElementById('withdrawText');
            
            if (gift.withdrawEnd && gift.withdrawEnd > Date.now()) {
                withdrawBtn.classList.remove('active');
                const remaining = Math.ceil((gift.withdrawEnd - Date.now()) / 60000);
                withdrawBtn.innerHTML = `<span class="lock-icon">🔒</span> <span class="timer-text">${remaining}</span><span class="minutes"> МИН</span>`;
                withdrawText.innerText = 'ВЫВЕСТИ';
                startTimerUpdate(gift, index);
            } else {
                gift.withdrawEnd = null;
                withdrawBtn.classList.add('active');
                withdrawBtn.innerHTML = 'ВЫВЕСТИ';
                withdrawText.innerText = '';
            }

            document.getElementById('giftModal').classList.add('active');
        }

        // Обновление таймера
        function startTimerUpdate(gift, index) {
            if (withdrawTimers[index]) clearInterval(withdrawTimers[index]);
            
            withdrawTimers[index] = setInterval(() => {
                if (!gift.withdrawEnd || gift.withdrawEnd <= Date.now()) {
                    clearInterval(withdrawTimers[index]);
                    delete withdrawTimers[index];
                    
                    gift.withdrawEnd = null;
                    saveInventory();
                    
                    const activeModal = document.getElementById('giftModal').classList.contains('active');
                    if (activeModal && document.getElementById('modalTitle').innerText === gift.name) {
                        const withdrawBtn = document.getElementById('withdrawBtn');
                        const withdrawText = document.getElementById('withdrawText');
                        
                        withdrawBtn.classList.add('active');
                        withdrawBtn.innerHTML = 'ВЫВЕСТИ';
                        withdrawText.innerText = '';
                    }
                    
                    renderGifts();
                    renderInventoryGrid();
                } else {
                    const remaining = Math.ceil((gift.withdrawEnd - Date.now()) / 60000);
                    if (document.getElementById('modalTitle').innerText === gift.name) {
                        const withdrawBtn = document.getElementById('withdrawBtn');
                        withdrawBtn.innerHTML = `<span class="lock-icon">🔒</span> <span class="timer-text">${remaining}</span><span class="minutes"> МИН</span>`;
                    }
                }
            }, 1000);
        }

        // Пополнение баланса
        document.getElementById('addBalanceBtn').addEventListener('click', () => {
            userData.balance += 1000;
            
            const savedData = JSON.parse(localStorage.getItem('yeter_user_data') || '{}');
            savedData.stars = userData.balance;
            localStorage.setItem('yeter_user_data', JSON.stringify(savedData));
            
            updateUI();
        });

        // Открытие всех подарков
        document.getElementById('viewAllBtn').addEventListener('click', () => {
            if (inventory.length > 0) {
                document.getElementById('inventoryModal').classList.add('active');
                renderInventoryGrid();
            }
        });

        // Закрытие модалок
        document.getElementById('closeInventoryModal').addEventListener('click', () => {
            document.getElementById('inventoryModal').classList.remove('active');
        });

        document.getElementById('closeGiftModal').addEventListener('click', () => {
            document.getElementById('giftModal').classList.remove('active');
        });

        document.getElementById('inventoryModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('inventoryModal')) {
                e.target.classList.remove('active');
            }
        });

        document.getElementById('giftModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('giftModal')) {
                e.target.classList.remove('active');
            }
        });

        // Инициализация
        loadData();
        updateUI();

        // Обновление таймеров
        setInterval(() => {
            let updated = false;
            inventory.forEach(gift => {
                if (gift.withdrawEnd && gift.withdrawEnd <= Date.now()) {
                    gift.withdrawEnd = null;
                    updated = true;
                }
            });
            if (updated) {
                saveInventory();
                updateUI();
            }
        }, 1000);
    </script>
</body>
</html>
