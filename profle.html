<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile · Inventory</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Font Awesome и Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
            will-change: transform;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.5;
            will-change: transform;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.5;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
            will-change: opacity;
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            padding-bottom: 100px;
            min-height: 100vh;
            z-index: 1;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            perspective: 1000;
        }

        /* Шапка профиля */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 20px 20px;
            gap: 12px;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #6a0dad;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            text-transform: uppercase;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .name-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1;
        }

        .fullname {
            font-size: 18px;
            font-weight: 700;
            color: white;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .username {
            font-size: 15px;
            color: #8e98a3;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Баланс - как в маркете */
        .balance-block {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 30px;
            padding: 4px 12px 4px 14px;
            flex-shrink: 0;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .balance-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .puzzle-icon {
            font-size: 14px;
            color: #ffd700;
        }

        .plus-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.05s ease;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            min-width: 28px;
            min-height: 28px;
        }

        .plus-btn:active {
            background: rgba(106, 13, 173, 0.6);
            transform: scale(0.95);
        }

        /* Контейнер для рамки профиля */
        .profile-frame-container {
            margin-top: 5px;
        }

        /* ОБЩАЯ РАМКА - инвентарь */
        .profile-frame {
            margin: 0 20px;
            background: rgba(10, 14, 22, 0.5);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 30px;
            padding: 25px 20px 25px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            position: relative;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        /* Заголовок инвентаря */
        .inventory-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .inventory-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inventory-title i {
            font-size: 24px;
            color: #b87aff;
        }

        .inventory-title span {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        /* Круг с ¡ */
        .info-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(106, 13, 173, 0.2);
            border: 1.5px solid rgba(184, 122, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s ease;
            line-height: 1;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            min-width: 40px;
            min-height: 40px;
        }

        .info-circle:active {
            background: rgba(106, 13, 173, 0.4);
            transform: scale(0.95);
        }

        .info-circle span {
            color: rgba(184, 122, 255, 0.8);
            font-size: 20px;
            font-weight: 500;
            display: block;
            line-height: 1;
        }

        .info-circle.active {
            background: rgba(106, 13, 173, 0.4);
            border-color: rgba(184, 122, 255, 0.8);
        }

        .info-circle.active span {
            color: #b87aff;
        }

        /* Кнопка Добавить подарок */
        .add-gift-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 0;
            border: 2px dashed rgba(184, 122, 255, 0.5);
            border-radius: 60px;
            background: rgba(106, 13, 173, 0.1);
            cursor: pointer;
            transition: background 0.1s ease;
            margin-bottom: 20px;
            color: #8e98a3;
            -webkit-tap-highlight-color: transparent;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            min-height: 80px;
        }

        .add-gift-btn:active {
            background: rgba(106, 13, 173, 0.25);
            transform: scale(0.98);
        }

        .add-gift-btn .plus-symbol {
            font-size: 32px;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 2px;
            color: #8e98a3;
        }

        .add-gift-btn .plus-text {
            font-size: 14px;
            color: #8e98a3;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Сетка инвентаря */
        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        /* Карточка в инвентаре */
        .inventory-item {
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            padding: 12px 8px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .inventory-item-image {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 8px;
            background: #2a1e3a;
            border: 1px solid rgba(184, 122, 255, 0.2);
        }

        .inventory-item-name {
            font-size: 13px;
            font-weight: 600;
            color: #f0f0f0;
            text-align: center;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 2px;
        }

        .inventory-item-price {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 13px;
            font-weight: 600;
            color: #b87aff;
        }

        .inventory-item-price .price-icon {
            font-size: 12px;
            color: #ffd700;
        }

        /* Пустой инвентарь */
        .empty-inventory {
            text-align: center;
            color: #8e98a3;
            font-size: 14px;
            line-height: 1.6;
            padding: 30px 0;
        }

        .empty-inventory i {
            font-size: 48px;
            color: #b87aff;
            opacity: 0.3;
            margin-bottom: 15px;
            display: block;
        }

        /* Подсказка */
        .hint-message {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 280px;
            background: #6a0dad;
            border-radius: 20px;
            padding: 16px 18px;
            box-shadow: 0 8px 0 #4a0b8a, 0 4px 15px rgba(106, 13, 173, 0.5);
            display: none;
            z-index: 10;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .hint-message.show {
            display: block;
            animation: fadeIn 0.15s ease;
        }

        .hint-message::before {
            content: '';
            position: absolute;
            top: -10px;
            right: 15px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 12px solid #6a0dad;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hint-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.5;
            font-weight: 500;
            text-align: left;
        }

        .hint-text span {
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 40px;
            display: inline-block;
            margin: 0 2px;
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-radius: 35px;
            border: 1px solid #2a1e3a;
            margin-bottom: 16px;
            width: calc(100% - 40px);
            left: 20px;
            right: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            transition: background 0.05s ease, color 0.05s ease;
            background: transparent;
            border: none;
            min-width: 80px;
            min-height: 44px;
            -webkit-tap-highlight-color: transparent;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.3);
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 20px;
            color: #8e98a3;
            margin-bottom: 2px;
            transition: color 0.05s ease;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: color 0.05s ease;
        }

        .nav-item.active {
            background: rgba(106, 13, 173, 0.25);
            color: #b87aff;
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item.active span {
            color: #b87aff;
        }

        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 440px) {
            .app {
                max-width: 100%;
            }
            
            .inventory-item-image {
                width: 70px;
                height: 70px;
            }
            
            .hint-message {
                width: 260px;
                right: 10px;
            }
        }
    </style>
</head>
<body class="no-select">
    <div class="stars" id="stars"></div>

    <div class="app">
        <!-- Шапка -->
        <div class="profile-header">
            <div class="profile-left">
                <div class="avatar" id="avatar">A</div>
                <div class="name-box">
                    <span class="fullname" id="fullName">Алексей Иванов</span>
                    <span class="username" id="username">@alexey</span>
                </div>
            </div>
            <div class="balance-block">
                <div class="balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceValue">0</span>
                </div>
                <div class="plus-btn" id="plusBtn">+</div>
            </div>
        </div>

        <!-- Контейнер для рамки профиля -->
        <div class="profile-frame-container">
            <div class="profile-frame">
                <!-- Заголовок инвентаря -->
                <div class="inventory-header">
                    <div class="inventory-title">
                        <i class="fas fa-box"></i>
                        <span>Инвентарь</span>
                    </div>
                    <div class="info-circle" id="infoCircle">
                        <span>¡</span>
                    </div>
                </div>

                <!-- Кнопка Добавить подарок -->
                <div class="add-gift-btn" id="addGiftBtn">
                    <span class="plus-symbol">+</span>
                    <span class="plus-text">Добавить подарок</span>
                </div>

                <!-- Сетка инвентаря -->
                <div id="inventoryContainer"></div>

                <!-- Подсказка -->
                <div class="hint-message" id="hintMessage">
                    <div class="hint-text">
                        Воспользуйся кнопкой <span>«Добавить подарок»</span>, чтобы добавить NFT в инвентарь и выставить его на продажу в магазине
                    </div>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <a href="market.html" class="nav-item" id="navMarket"><i class="fas fa-store"></i><span>МАРКЕТ</span></a>
            <a href="#" class="nav-item active" id="navProfile"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const STORAGE_KEY = 'nft_balance';
            const INVENTORY_KEY = 'nft_inventory';

            // Получение баланса
            function getBalance() {
                const balance = localStorage.getItem(STORAGE_KEY);
                return balance ? parseInt(balance, 10) : 500;
            }

            // Обновление баланса на странице
            function updateBalanceDisplay() {
                const balanceSpan = document.getElementById('balanceValue');
                if (balanceSpan) {
                    balanceSpan.innerText = getBalance();
                }
            }

            // Получение инвентаря
            function getInventory() {
                const inventory = localStorage.getItem(INVENTORY_KEY);
                return inventory ? JSON.parse(inventory) : [];
            }

            // Отображение инвентаря
            function renderInventory() {
                const container = document.getElementById('inventoryContainer');
                const inventory = getInventory();

                if (inventory.length === 0) {
                    container.innerHTML = `
                        <div class="empty-inventory">
                            <i class="fas fa-gift"></i>
                            <p>В инвентаре пока пусто</p>
                            <p class="small">Купите подарки в магазине</p>
                        </div>
                    `;
                } else {
                    let html = '<div class="inventory-grid">';
                    inventory.forEach(item => {
                        html += `
                            <div class="inventory-item">
                                <img src="${item.image}" alt="${item.name}" class="inventory-item-image" onerror="this.src='https://via.placeholder.com/80/6a0dad/ffffff?text=NFT'">
                                <div class="inventory-item-name">${item.name}</div>
                                <div class="inventory-item-price">
                                    <span class="price-icon">🧩</span>
                                    <span>${item.price}</span>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                }
            }

            // Звезды
            function initStars() {
                const starsContainer = document.getElementById('stars');
                if (!starsContainer) return;
                
                starsContainer.innerHTML = '';
                const starCount = 20;
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.opacity = (0.2 + Math.random() * 0.3).toString();
                    
                    starsContainer.appendChild(star);
                }
            }

            // Telegram данные
            function getTelegramData() {
                const tg = window.Telegram?.WebApp;
                
                const cachedData = sessionStorage.getItem('tg_user_data');
                if (cachedData) {
                    return JSON.parse(cachedData);
                }
                
                let firstName = 'Игрок';
                let lastName = '';
                let tgUsername = '';

                if (tg && tg.initDataUnsafe?.user) {
                    const user = tg.initDataUnsafe.user;
                    firstName = user.first_name || 'Игрок';
                    lastName = user.last_name || '';
                    tgUsername = user.username ? '@' + user.username : '';
                    
                    const userData = { firstName, lastName, tgUsername };
                    sessionStorage.setItem('tg_user_data', JSON.stringify(userData));
                    return userData;
                }
                
                return { firstName, lastName, tgUsername };
            }

            // Инициализация
            function init() {
                initStars();

                const userData = getTelegramData();
                const fullName = (userData.firstName + ' ' + userData.lastName).trim();
                
                document.getElementById('fullName').innerText = fullName;
                
                const usernameEl = document.getElementById('username');
                if (userData.tgUsername) {
                    usernameEl.innerText = userData.tgUsername;
                } else {
                    usernameEl.innerText = '@' + userData.firstName.toLowerCase().replace(/\s+/g, '');
                }

                const avatarDiv = document.getElementById('avatar');
                const tg = window.Telegram?.WebApp;
                
                if (tg && tg.initDataUnsafe?.user?.photo_url) {
                    const photoUrl = tg.initDataUnsafe.user.photo_url;
                    avatarDiv.style.backgroundImage = `url('${photoUrl}')`;
                    avatarDiv.style.backgroundSize = 'cover';
                    avatarDiv.innerText = '';
                } else {
                    avatarDiv.innerText = userData.firstName.charAt(0).toUpperCase();
                }

                updateBalanceDisplay();
                renderInventory();

                // Слушаем изменения из других вкладок
                window.addEventListener('storage', (e) => {
                    if (e.key === STORAGE_KEY) {
                        updateBalanceDisplay();
                    }
                    if (e.key === INVENTORY_KEY || e.key === 'inventory_updated') {
                        renderInventory();
                    }
                });

                // Кнопка + баланса
                document.getElementById('plusBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                });

                // Информационный кружок
                const infoCircle = document.getElementById('infoCircle');
                const hintMessage = document.getElementById('hintMessage');
                
                infoCircle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    hintMessage.classList.toggle('show');
                    infoCircle.classList.toggle('active');
                });
                
                document.addEventListener('click', (e) => {
                    if (!hintMessage.contains(e.target) && !infoCircle.contains(e.target)) {
                        hintMessage.classList.remove('show');
                        infoCircle.classList.remove('active');
                    }
                });

                // Кнопка добавить подарок
                document.getElementById('addGiftBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('Купите подарок в маркете!');
                });

                // Навигация
                const navMarket = document.getElementById('navMarket');
                const navProfile = document.getElementById('navProfile');

                navMarket.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = 'market.html';
                });

                navProfile.addEventListener('click', (e) => {
                    e.preventDefault();
                    navProfile.classList.add('active');
                    navMarket.classList.remove('active');
                });
            }

            if (!window._initialized) {
                window._initialized = true;
                
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', init);
                } else {
                    init();
                }
            }

        })();
    </script>
</body>
</html>
