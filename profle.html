<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile · Inventory</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Font Awesome и Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #03050a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 40% 50%, #0a0e1a 0%, #03050a 70%, #000103 100%);
            z-index: -2;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0;
            transition: opacity 0.1s ease;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
        }

        .app {
            max-width: 440px;
            width: 100%;
            background: transparent;
            padding-bottom: 100px;
            min-height: 100vh;
            z-index: 1;
        }

        /* Шапка как в маркете - аватар слева, баланс справа */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 20px 20px;
            gap: 12px;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #6a0dad;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid #b87aff;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            text-transform: uppercase;
        }

        .name-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1;
        }

        .fullname {
            font-size: 18px;
            font-weight: 700;
            color: white;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .username {
            font-size: 15px;
            color: #8e98a3;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .balance-block {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 14, 22, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 40px;
            padding: 8px 14px 8px 16px;
            flex-shrink: 0;
        }

        .balance-stars {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }

        .puzzle-icon {
            font-size: 16px;
            color: #ffd700;
        }

        .plus-btn {
            background: rgba(106, 13, 173, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b87aff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.1s;
            line-height: 1;
        }

        .plus-btn:active {
            background: rgba(106, 13, 173, 0.6);
            color: white;
        }

        /* Контейнер для рамки профиля */
        .profile-frame-container {
            margin-top: 5px;
        }

        /* ОБЩАЯ РАМКА - только инвентарь (без аватарки) */
        .profile-frame {
            margin: 0 20px;
            background: rgba(10, 14, 22, 0.5);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 30px;
            padding: 25px 20px 25px;
            backdrop-filter: blur(4px);
        }

        /* Заголовок инвентаря (без кнопки +) */
        .inventory-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .inventory-title i {
            font-size: 24px;
            color: #b87aff;
        }

        .inventory-title span {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        /* Пустой инвентарь */
        .empty-inventory {
            text-align: center;
            color: #8e98a3;
            font-size: 15px;
            line-height: 1.6;
            padding: 20px 0 20px;
        }

        .empty-inventory i {
            font-size: 64px;
            color: #b87aff;
            opacity: 0.5;
            margin-bottom: 20px;
            display: block;
        }

        .empty-inventory p {
            margin-bottom: 8px;
            font-size: 16px;
        }

        .empty-inventory .small {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Нижняя навигация — только MARKET и PROFILE */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 440px;
            margin: 0 auto;
            background: #0c0f16;
            display: flex;
            justify-content: space-around;
            padding: 12px 4px;
            border-radius: 35px;
            border: 1px solid #2a1e3a;
            margin-bottom: 20px;
            width: calc(100% - 40px);
            left: 20px;
            right: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #8e98a3;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            min-width: 100px;
        }

        .nav-item i {
            font-size: 20px;
            color: #8e98a3;
            margin-bottom: 2px;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .nav-item.active {
            background: rgba(106, 13, 173, 0.25);
            color: #b87aff;
        }

        .nav-item.active i {
            color: #b87aff;
        }

        .nav-item.active span {
            color: #b87aff;
        }

        .nav-item:active {
            background: rgba(106, 13, 173, 0.4);
            transform: scale(0.95);
        }

        .notification {
            position: fixed;
            top: 20px; right: 20px;
            padding: 12px 20px;
            border-radius: 60px;
            background: #00c853;
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 3000;
            transform: translateX(150%);
            transition: 0.3s;
            box-shadow: 0 4px 0 #00691e;
            pointer-events: none;
        }
        .notification.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="notification" id="notification">➕ Баланс пополнен</div>

    <div class="app">
        <!-- Шапка КАК В МАРКЕТЕ: аватар слева, имя+юзернейм, баланс справа -->
        <div class="profile-header">
            <div class="profile-left">
                <div class="avatar" id="avatar">A</div>
                <div class="name-box">
                    <span class="fullname" id="fullName">Алексей Иванов</span>
                    <span class="username" id="username">@alexey</span>
                </div>
            </div>
            <div class="balance-block">
                <div class="balance-stars">
                    <span class="puzzle-icon">🧩</span>
                    <span id="balanceValue">0</span>
                </div>
                <div class="plus-btn" id="plusBtn">+</div>
            </div>
        </div>

        <!-- Контейнер для рамки профиля -->
        <div class="profile-frame-container">
            <!-- ОДНА ОБЩАЯ РАМКА: ТОЛЬКО ИНВЕНТАРЬ (без аватарки и имени) -->
            <div class="profile-frame">
                <!-- Заголовок инвентаря -->
                <div class="inventory-title">
                    <i class="fas fa-box"></i>
                    <span>Инвентарь</span>
                </div>

                <!-- Пустой инвентарь -->
                <div class="empty-inventory">
                    <i class="fas fa-gift"></i>
                    <p>В инвентаре пока пусто</p>
                    <p class="small">Купите подарки в магазине</p>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация: MARKET и PROFILE -->
        <div class="bottom-nav">
            <a href="market.html" class="nav-item" id="navMarket"><i class="fas fa-store"></i><span>МАРКЕТ</span></a>
            <a href="#" class="nav-item active" id="navProfile"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></a>
        </div>
    </div>

    <script>
        (function() {
            // Звезды с анимацией
            function initStars() {
                const starsContainer = document.getElementById('stars');
                if (!starsContainer) return;
                
                starsContainer.innerHTML = '';
                const starCount = 80;
                const stars = [];
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    
                    const left = Math.random() * 100;
                    const top = Math.random() * 100;
                    const size = 1 + Math.floor(Math.random() * 2);
                    
                    star.style.left = left + '%';
                    star.style.top = top + '%';
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    
                    star.dataset.speed = 0.3 + Math.random() * 0.7;
                    star.dataset.phase = Math.random() * Math.PI * 2;
                    star.dataset.baseOpacity = 0.3 + Math.random() * 0.5;
                    
                    starsContainer.appendChild(star);
                    stars.push(star);
                }
                
                function animateStars() {
                    stars.forEach(star => {
                        const speed = parseFloat(star.dataset.speed);
                        const phase = parseFloat(star.dataset.phase);
                        const baseOp = parseFloat(star.dataset.baseOpacity);
                        
                        const time = performance.now() / 1000;
                        const opacity = baseOp + 0.3 * Math.sin(time * speed + phase);
                        
                        star.style.opacity = Math.max(0.1, Math.min(0.9, opacity));
                    });
                    
                    requestAnimationFrame(animateStars);
                }
                
                requestAnimationFrame(animateStars);
            }
            
            initStars();

            // Telegram данные
            const tg = window.Telegram?.WebApp;
            let firstName = 'Игрок';
            let lastName = '';
            let tgUsername = '';

            if (tg && tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                firstName = user.first_name || 'Игрок';
                lastName = user.last_name || '';
                tgUsername = user.username ? '@' + user.username : '';
            }

            // Полное имя
            const fullName = (firstName + ' ' + lastName).trim();
            
            // Заполняем шапку
            document.getElementById('fullName').innerText = fullName;
            
            // Юзернейм в шапке
            const usernameEl = document.getElementById('username');
            if (tgUsername) {
                usernameEl.innerText = tgUsername;
            } else {
                usernameEl.innerText = '@' + firstName.toLowerCase().replace(/\s+/g, '');
            }

            // Аватар в шапке
            const avatarDiv = document.getElementById('avatar');
            if (tg && tg.initDataUnsafe?.user?.photo_url) {
                const photoUrl = tg.initDataUnsafe.user.photo_url;
                avatarDiv.style.backgroundImage = `url('${photoUrl}')`;
                avatarDiv.style.backgroundSize = 'cover';
                avatarDiv.innerText = '';
            } else {
                avatarDiv.innerText = firstName.charAt(0).toUpperCase();
            }

            // Баланс 0
            const balanceSpan = document.getElementById('balanceValue');
            balanceSpan.innerText = '0';
            
            // Кнопка + баланса ничего не делает
            document.getElementById('plusBtn').addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Пополнение временно отключено');
            });

            // Навигация
            const navMarket = document.getElementById('navMarket');
            const navProfile = document.getElementById('navProfile');

            // Для маркета ссылка на market.html
            navMarket.addEventListener('click', (e) => {
                navMarket.classList.add('active');
                navProfile.classList.remove('active');
            });

            // Для профиля (мы уже на profle.html)
            navProfile.addEventListener('click', (e) => {
                e.preventDefault();
                navProfile.classList.add('active');
                navMarket.classList.remove('active');
            });

        })();
    </script>
</body>
</html>
